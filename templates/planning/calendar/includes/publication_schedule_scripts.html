{# Publication Schedule Scripts - extracted from publication/dashboard.html #}
<script src="{{ url_for('static', filename='js/planning/unified-item-card.js') }}"></script>
<script>
// Schedule Management
async function loadSchedule() {
    try {
        console.log('[loadSchedule] Starting...');
        // Get year/week from URL or use current week
        const urlParams = new URLSearchParams(window.location.search);
        const year = urlParams.get('year') || new Date().getFullYear();
        const week = urlParams.get('week') || (() => {
            const d = new Date();
            const dayNum = d.getDay() || 7;
            d.setDate(d.getDate() + 4 - dayNum);
            const yearStart = new Date(d.getFullYear(), 0, 1);
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        })();
        
        console.log(`[loadSchedule] Fetching schedule for year=${year}, week=${week}`);
        const response = await fetch(`/publication/api/dashboard/schedule?year=${year}&week=${week}`);
        const data = await response.json();
        
        console.log('[loadSchedule] API response:', data);
        
        if (data.success) {
            console.log('[loadSchedule] Rendering schedule...');
            renderSchedule(data.channels);
        } else {
            console.error('Error loading schedule:', data.error);
        }
    } catch (error) {
        console.error('Error loading schedule:', error);
    }
}

function renderSchedule(channels) {
    console.log('[renderSchedule] Starting render, channels:', Object.keys(channels));
    console.log('[renderSchedule] Channel data:', channels);
    
    if (!channels || Object.keys(channels).length === 0) {
        console.warn('[renderSchedule] No channels data provided');
        return;
    }
    
    // Clear all existing item cards (but keep empty states)
    document.querySelectorAll('.day-column .item-card').forEach(el => {
        el.remove();
    });
    
    // Show all empty states by default
    document.querySelectorAll('.day-column .empty-state').forEach(el => {
        el.style.display = 'block';
    });
    
    let totalRendered = 0;
    
    // Render items for each channel
    Object.keys(channels).forEach(channel => {
        const channelSection = document.querySelector(`#channel-${channel}`);
        if (!channelSection) {
            console.warn(`[renderSchedule] Channel section not found: #channel-${channel}`);
            return;
        }
        
        const items = channels[channel];
        if (!items || items.length === 0) {
            console.log(`[renderSchedule] No items for channel: ${channel}`);
            return;
        }
        
        console.log(`[renderSchedule] Rendering ${items.length} items for channel: ${channel}`);
        items.forEach((item, index) => {
            const day = item.day;
            if (!day || day < 1 || day > 7) {
                console.warn(`[renderSchedule] Invalid day for item ${index}:`, day, item);
                return;
            }
            
            // Find the day column for this channel
            const dayColumns = channelSection.querySelectorAll('.day-column');
            if (dayColumns.length < day) {
                console.warn(`[renderSchedule] Not enough day columns (${dayColumns.length}) for day ${day}`);
                return;
            }
            
            const dayColumn = dayColumns[day - 1];
            if (!dayColumn) {
                console.warn(`[renderSchedule] Day column not found for day ${day}`);
                return;
            }
            
            // Hide empty state
            const emptyState = dayColumn.querySelector('.empty-state');
            if (emptyState) {
                emptyState.style.display = 'none';
            }
            
            // Items should always have a title (type name), so don't skip based on title
            // Only skip if we have absolutely no identifying data
            if (!item.title && !item.type_name && !item.item_id && !item.post_id) {
                console.warn(`[renderSchedule] Skipping item with no data:`, item);
                return; // Skip this item
            }
            
            // Ensure item has required fields for unified-item-card
            if (!item.category && item.post_type) {
                item.category = item.post_type;
            }
            if (item.is_automated === undefined) {
                // Determine automation status based on post_type
                const automatedTypes = ['weekly_word', 'weekly_phrase', 'weekly_insult', 'product', 'message'];
                item.is_automated = automatedTypes.includes(item.post_type || item.category);
            }
            
            // Use unified item card component or create simple fallback
            let itemCard = null;
            
            if (typeof window.createUnifiedItemCard === 'function') {
                try {
                    itemCard = window.createUnifiedItemCard(item, {
                        category: item.category || item.post_type,
                        typeName: item.type_name,
                        title: item.title,
                        description: item.description,
                        year: item.year,
                        week: item.week,
                        channel: item.channel,
                        scheduled_time: item.scheduled_time,  // Pass scheduled time for display
                        postExists: item.post_exists !== undefined ? item.post_exists : false,  // Pass post_exists flag
                        postStatus: item.post_status || null,  // Pass post_status for status display
                        dataset: {
                            contentFormat: item.content_format,
                            typeName: item.type_name || '',
                            isAutomated: item.is_automated || false
                        },
                        onInfo: (e, item, card) => {
                            // Open schedule edit modal
                            if (window.openScheduleEditModal) {
                                window.openScheduleEditModal(item, card);
                            }
                        },
                        onClick: (e, item, card) => {
                            // Open schedule edit modal on card click
                            if (window.openScheduleEditModal) {
                                window.openScheduleEditModal(item, card);
                            }
                        }
                    });
                } catch (error) {
                    console.error('Error creating unified item card:', error, item);
                    itemCard = null;
                }
            }
            
            // If unified card creation failed or isn't available, create simple fallback
            if (!itemCard) {
                console.log('[renderSchedule] Creating fallback card for:', item);
                itemCard = document.createElement('div');
                itemCard.className = 'item-card';
                
                // Add automation badge
                const isAutomated = item.is_automated || false;
                const automationIcon = isAutomated ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-wrench"></i>';
                const automationClass = isAutomated ? 'automated' : 'manual';
                
                // Build card HTML
                const typeLabel = document.createElement('div');
                typeLabel.className = 'item-type-label';
                typeLabel.style.display = 'flex';
                typeLabel.style.alignItems = 'center';
                typeLabel.style.gap = '0.5rem';
                typeLabel.innerHTML = `
                    <span>${item.type_name || item.title || 'Item'}</span>
                    <span class="automation-badge ${automationClass}" title="${isAutomated ? 'Automated' : 'Manual'}">${automationIcon}</span>
                `;
                itemCard.appendChild(typeLabel);
                
                const titleEl = document.createElement('div');
                titleEl.className = 'item-title';
                titleEl.innerHTML = `${item.title || item.type_name || 'Untitled'}${item.scheduled_time ? ` <span style="color: var(--text-secondary); font-size: 0.8em;">@ ${item.scheduled_time}</span>` : ''}`;
                itemCard.appendChild(titleEl);
                
                const actionsEl = document.createElement('div');
                actionsEl.className = 'item-actions';
                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn-compact btn-info';
                editBtn.title = 'Edit schedule (day/time)';
                editBtn.innerHTML = '<i class="fas fa-edit"></i>';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (window.openScheduleEditModal) {
                        window.openScheduleEditModal(item, itemCard);
                    }
                };
                actionsEl.appendChild(editBtn);
                itemCard.appendChild(actionsEl);
            }
            
            dayColumn.appendChild(itemCard);
            totalRendered++;
        });
    });
    
    console.log(`[renderSchedule] Completed. Rendered ${totalRendered} items total.`);
}

function getTypeName(item) {
    return item.type_name || item.category.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function buildStatusLine(postStatus) {
    const normalized = postStatus && postStatus.trim() ? postStatus.trim().toLowerCase() : null;
    const statusClass = normalized ? `status-badge status-${normalized}` : 'status-badge status-none';
    const display = normalized ? (normalized.charAt(0).toUpperCase() + normalized.slice(1)) : 'Not created';
    return `<div class="status-line"><span class="${statusClass}" title="Status">${display}</span></div>`;
}

function buildActionButtons(postExists) {
    return `
        <div class="item-actions">
            ${postExists ? `
                <button class="icon-btn-compact btn-work-on" title="Open 1‑click">
                    <i class="fas fa-rocket"></i>
                </button>
            ` : `
                <button class="icon-btn-compact btn-create" title="Create post">
                    <i class="fas fa-play"></i>
                </button>
            `}
            <button class="icon-btn-compact btn-info" title="View in calendar">
                <i class="fas fa-info-circle"></i>
            </button>
        </div>
    `;
}

function setItemCardContent(itemCard, item, options) {
    const postStatus = options?.postExists ? (item.post_status || 'draft') : (item.post_status || null);
    const statusHtml = buildStatusLine(postStatus);
    const actionsHtml = buildActionButtons(options?.postExists);
    const descriptionHtml = options?.description ? `<div class="item-description">${options.description}</div>` : '';
    const typeName = options?.typeName || getTypeName(item);
    const title = options?.title || item.title || 'Untitled';

    itemCard.innerHTML = `
        <div class="item-type-label">${typeName}</div>
        <div class="item-title">${title}</div>
        <div class="compact-action-row">
            ${statusHtml}
            ${actionsHtml}
        </div>
        ${descriptionHtml}
    `;

    bindItemCardActions(itemCard, item);
}

function bindItemCardActions(itemCard, item) {
    const createBtn = itemCard.querySelector('.btn-create');
    if (createBtn) {
        createBtn.onclick = function(e) {
            e.stopPropagation();
            createPostFromItem(item, itemCard);
        };
    }

    const workBtn = itemCard.querySelector('.btn-work-on');
    if (workBtn) {
        workBtn.onclick = function(e) {
            e.stopPropagation();
            navigateToOneClick(item);
        };
    }

    const infoBtn = itemCard.querySelector('.btn-info');
    if (infoBtn) {
        infoBtn.onclick = function(e) {
            e.stopPropagation();
            openItemModal(item);
        };
    }

    itemCard.onclick = function(e) {
        if (e.target.closest('.icon-btn-compact')) return;
        openItemModal(item);
    };
}

async function createPostFromItem(item, itemCard) {
    console.log('[createPostFromItem] Called with item:', item, 'itemCard:', itemCard);
    
    // Only create for blog channel
    if (item.channel !== 'blog') {
        // For non-blog channels, navigate to one-click (existing behavior)
        navigateToOneClick(item);
        return;
    }
    
    // Disable button and show loading state
    const createBtn = itemCard.querySelector('.btn-create');
    const startBtn = itemCard.querySelector('.btn-start');
    const buttonToDisable = createBtn || startBtn;
    if (buttonToDisable) {
        buttonToDisable.disabled = true;
        if (startBtn) {
            startBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 0.25rem;"></i> Creating...';
        } else if (createBtn) {
            createBtn.textContent = 'Creating...';
        }
    }
    
    try {
        // Get item_id from various possible fields
        const item_id = getItemId(item);
        
        const requestBody = {
            category: item.category,
            item_id: item_id,
            year: item.year,
            week: item.week,
            output_channel: item.channel || 'blog'
        };
        
        console.log('[createPostFromItem] Item data:', item);
        console.log('[createPostFromItem] Extracted item_id:', item_id);
        console.log('[createPostFromItem] Request body:', requestBody);
        
        if (!requestBody.item_id) {
            console.error('[createPostFromItem] Missing item_id. Item data:', item);
            alert('Error: Cannot create post - item ID is missing. Please check the browser console (F12) for details.');
            throw new Error('Item ID is missing. Cannot create post without item_id.');
        }
        
        const response = await fetch('/launchpad/one-click-publication/api/create-post-from-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        });
        
        if (!response.ok) {
            let errorText;
            try {
                const errorJson = await response.json();
                errorText = errorJson.error || errorJson.message || JSON.stringify(errorJson);
            } catch (e) {
                errorText = await response.text();
            }
            console.error('[createPostFromItem] API error response:', response.status, errorText);
            throw new Error(errorText || `HTTP ${response.status}: ${response.statusText}`);
        }
        
        const result = await response.json();
        
        console.log('[createPostFromItem] API response:', result);
        
        if (result.success && result.post_id) {
            // Update the item data
            item.post_id = result.post_id;
            item.post_exists = true;
            item.post_status = 'draft';
            
            // Navigate to the first workflow stage based on category
            const postId = result.post_id;
            const category = item.category;
            let workflowUrl = null;
            
            // Determine first workflow stage based on category
            if (category === 'recipe') {
                // Recipes: taxonomy redirects to drafting, so go directly to drafting
                workflowUrl = `/posts/${postId}/sections/drafting`;
                if (item.year && item.week) {
                    workflowUrl += `?year=${item.year}&week=${item.week}`;
                }
            } else if (category === 'theme') {
                // Themes start at Planning -> Ideas
                workflowUrl = `/planning/posts/${postId}/calendar/ideas`;
                if (item.year && item.week) {
                    workflowUrl += `?year=${item.year}&week=${item.week}`;
                }
            } else if (category === 'profile_product' || category === 'profile_surname') {
                // Profiles start at Planning -> Taxonomy
                workflowUrl = `/planning/posts/${postId}/calendar/taxonomy`;
                if (item.year && item.week) {
                    workflowUrl += `?year=${item.year}&week=${item.week}`;
                }
            } else {
                // Default: Planning -> Ideas
                workflowUrl = `/planning/posts/${postId}/calendar/ideas`;
                if (item.year && item.week) {
                    workflowUrl += `?year=${item.year}&week=${item.week}`;
                }
            }
            
            // Navigate to workflow
            if (workflowUrl) {
                console.log('[createPostFromItem] Navigating to:', workflowUrl);
                window.location.href = workflowUrl;
            } else {
                console.warn('[createPostFromItem] No workflow URL determined, updating card UI');
                // Fallback: Update the card UI if navigation fails
                updateItemCardAfterCreation(itemCard, item);
            }
        } else {
            throw new Error(result.error || 'Failed to create post');
        }
    } catch (error) {
        console.error('[createPostFromItem] Error creating post:', error);
        console.error('[createPostFromItem] Error stack:', error.stack);
        console.error('[createPostFromItem] Item that failed:', item);
        
        // Show user-friendly error message
        let errorMessage = error.message || 'Unknown error occurred';
        if (errorMessage.includes('500') || errorMessage.includes('Internal Server Error')) {
            errorMessage = 'Server error occurred. Please check the browser console (F12) for details and try again.';
        }
        alert(`Error creating post: ${errorMessage}`);
        
        // Re-enable button
        const startBtn = itemCard.querySelector('.btn-start');
        if (startBtn) {
            startBtn.disabled = false;
            startBtn.innerHTML = '<i class="fas fa-play" style="margin-right: 0.25rem;"></i> Start';
        } else if (createBtn) {
            createBtn.disabled = false;
            createBtn.textContent = 'Create';
        }
    }
}

// Helper to get item_id from various possible fields
function getItemId(item) {
    return item.item_id || item.id || item.recipe_id || item.theme_id || item.profile_id;
}

function updateItemCardAfterCreation(itemCard, item) {
    // Update data attributes
    itemCard.dataset.postId = item.post_id;
    item.post_exists = true;
    const postStatus = (item.post_status || 'draft').toLowerCase();
    
    const typeLabelText = itemCard.querySelector('.item-type-label')?.textContent || getTypeName(item);
    const titleText = itemCard.querySelector('.item-title')?.textContent || item.title || 'Untitled';
    const descEl = itemCard.querySelector('.item-description');
    const descHtml = descEl ? descEl.innerHTML : '';

    setItemCardContent(itemCard, item, {
        postExists: true,
        typeName: typeLabelText,
        title: titleText,
        description: descHtml
    });
}

    document.getElementById('edit-week').value = item.week || '';

function closeScheduleEditModal() {
    const modal = document.getElementById('schedule-edit-modal');
    if (modal) {
        modal.style.display = 'none';
    }
}

// Close modal on overlay click
document.addEventListener('click', function(e) {
    const modal = document.getElementById('schedule-edit-modal');
    if (modal && e.target === modal) {
        closeScheduleEditModal();
    }
});

// Expose globally
window.openScheduleEditModal = openScheduleEditModal;
window.closeScheduleEditModal = closeScheduleEditModal;

function openItemModal(item) {
    // For publication schedule, info button opens edit modal
    // This is handled by openScheduleEditModal above
    return;
}

function openInCalendar(item) {
    // Navigate to week-view so users get contextual modal/details
    const y = item.year || new Date().getFullYear();
    const w = item.week || (new Date()).getWeek ? (new Date()).getWeek() : '';
    const url = `/planning/calendar?year=${y}&week=${w}&tab=week-view`;
    window.open(url, '_blank');
}

function navigateToOneClick(item) {
    // Product posts go directly to product post editing page
    if (item.category === 'product') {
        const queueId = item.queue_id || item.item_id;
        if (queueId) {
            window.location.href = `/launchpad/syndication/facebook/product_post?queue_id=${queueId}`;
            return;
        }
    }
    
    let url = '/launchpad/one-click-publication?';
    const params = [];
    
    if (item.post_id) {
        params.push(`post_id=${item.post_id}`);
    } else {
        params.push(`category=${item.category}`);
        params.push(`item_id=${item.item_id}`);
        params.push(`year=${item.year}`);
        params.push(`week=${item.week}`);
    }
    
    params.push(`output=${item.channel}`);
    
    url += params.join('&');
    window.location.href = url;
}

/**
 * Navigate to the pipeline page for a post
 * Uses the function from unified-item-card.js if available, otherwise defines it here
 * @param {Object} item - Item data
 * @param {number} postId - Post ID
 */
function navigateToPipeline(item, postId) {
    // Use the function from unified-item-card.js if available
    if (window.navigateToPipeline && typeof window.navigateToPipeline === 'function' && window.navigateToPipeline !== navigateToPipeline) {
        window.navigateToPipeline(item, postId);
        return;
    }
    
    const category = item.category || '';
    const year = item.year;
    const week = item.week;
    
    let workflowUrl = null;
    
    // Determine first workflow stage based on category
    if (category === 'recipe') {
        // Recipes: taxonomy redirects to drafting, so go directly to drafting
        workflowUrl = `/posts/${postId}/sections/drafting`;
    } else if (category === 'theme') {
        // Themes start at Planning -> Ideas
        workflowUrl = `/planning/posts/${postId}/calendar/ideas`;
    } else if (category === 'profile_product' || category === 'profile_surname') {
        // Profiles start at Planning -> Taxonomy
        workflowUrl = `/planning/posts/${postId}/calendar/taxonomy`;
    } else {
        // Default: Planning -> Ideas
        workflowUrl = `/planning/posts/${postId}/calendar/ideas`;
    }
    
    // Add year/week params if available
    if (year && week) {
        workflowUrl += `?year=${year}&week=${week}`;
    }
    
    console.log('[Publication Schedule] Navigating to pipeline:', workflowUrl);
    window.location.href = workflowUrl;
}


// Load schedule function - always try to load if on this tab
function loadScheduleIfVisible() {
    const scheduleView = document.querySelector('.publication-schedule-view');
    console.log('[Publication Schedule] loadScheduleIfVisible, scheduleView:', scheduleView);
    
    if (scheduleView) {
        console.log('[Publication Schedule] Loading schedule...');
        loadSchedule();
    } else {
        console.warn('[Publication Schedule] Schedule view not found in DOM');
    }
}

// Load schedule on initial page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('[Publication Schedule] DOMContentLoaded');
    // Check if we're on the publication-schedule tab
    const urlParams = new URLSearchParams(window.location.search);
    const activeTab = urlParams.get('tab');
    console.log('[Publication Schedule] Active tab from URL:', activeTab);
    
    // Also check if the publication-schedule-view exists (means tab is active)
    const scheduleView = document.querySelector('.publication-schedule-view');
    if (scheduleView || activeTab === 'publication-schedule') {

        }, 200);

});

// Also try loading after a delay to catch any edge cases
setTimeout(() => {
    const scheduleView = document.querySelector('.publication-schedule-view');
    if (scheduleView) {
        console.log('[Publication Schedule] Delayed load attempt');
        loadScheduleIfVisible();
    }
}, 1500);

// Expose function globally for tab switching
window.loadPublicationSchedule = loadScheduleIfVisible;
