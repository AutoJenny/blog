{# Publication Schedule Scripts - extracted from publication/dashboard.html #}
<script>
// Schedule Management
async function loadSchedule() {
    try {
        const response = await fetch('/publication/api/dashboard/schedule');
        const data = await response.json();
        
        if (data.success) {
            renderSchedule(data.channels);
        } else {
            console.error('Error loading schedule:', data.error);
        }
    } catch (error) {
        console.error('Error loading schedule:', error);
    }
}

function renderSchedule(channels) {
    // Clear all existing item cards (but keep empty states)
    document.querySelectorAll('.day-column .item-card').forEach(el => {
        el.remove();
    });
    
    // Show all empty states by default
    document.querySelectorAll('.day-column .empty-state').forEach(el => {
        el.style.display = 'block';
    });
    
    // Render items for each channel
    Object.keys(channels).forEach(channel => {
        const channelSection = document.querySelector(`#channel-${channel}`);
        if (!channelSection) return;
        
        const items = channels[channel];
        items.forEach(item => {
            const day = item.day;
            if (!day || day < 1 || day > 7) return;
            
            // Find the day column for this channel
            const dayColumns = channelSection.querySelectorAll('.day-column');
            if (dayColumns.length < day) return;
            
            const dayColumn = dayColumns[day - 1];
            if (!dayColumn) return;
            
            // Hide empty state
            const emptyState = dayColumn.querySelector('.empty-state');
            if (emptyState) {
                emptyState.style.display = 'none';
            }
            
            // Create item card
            const itemCard = document.createElement('div');
            itemCard.className = 'item-card';
            itemCard.dataset.category = item.category;
            itemCard.dataset.itemId = item.item_id;
            itemCard.dataset.year = item.year;
            itemCard.dataset.week = item.week;
            itemCard.dataset.channel = item.channel;
            itemCard.dataset.postId = item.post_id || '';
            itemCard.dataset.contentFormat = item.content_format;
            
            // Build title (remove prefixes since we have type badge)
            let title = item.title || 'Untitled';
            
            // Get type name
            const typeName = item.type_name || item.category.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
            
            // Only skip if we have absolutely no data (no title, no item_id, no post_id)
            if ((!title || title === 'Untitled') && !item.item_id && !item.post_id) {
                return; // Skip this item
            }
            
            // Determine if post exists and get status
            const postExists = item.post_exists === true || (item.post_id !== null && item.post_id !== undefined);
            const postStatus = item.post_status && item.post_status.trim() ? item.post_status.trim().toLowerCase() : null;
            
            // Build status indicator, create button, or work button
            let statusOrButton = '';
            if (postExists && postStatus) {
                // Post exists - show status badge and work button
                const statusClass = `status-badge status-${postStatus}`;
                const statusDisplay = postStatus.charAt(0).toUpperCase() + postStatus.slice(1);
                statusOrButton = `
                    <div class="${statusClass}">${statusDisplay}</div>
                    <button class="btn-work-on">Work on This</button>
                `;
            } else {
                // Post doesn't exist - show Create button
                statusOrButton = `<button class="btn-create">Create</button>`;
            }
            
            itemCard.innerHTML = `
                <div class="item-type-label">${typeName}</div>
                <div class="item-title">${title}</div>
                ${item.description ? `<div class="item-description">${item.description.substring(0, 50)}${item.description.length > 50 ? '...' : ''}</div>` : ''}
                ${statusOrButton}
            `;
            
            // Add click handlers
            const createBtn = itemCard.querySelector('.btn-create');
            if (createBtn) {
                createBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    createPostFromItem(item, itemCard);
                });
            }
            
            const workBtn = itemCard.querySelector('.btn-work-on');
            if (workBtn) {
                workBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navigateToOneClick(item);
                });
            }
            
            // If post exists, clicking card should navigate to post (or one-click with post_id)
            // If post doesn't exist, clicking card should also navigate (to create)
            itemCard.addEventListener('click', function(e) {
                // Don't navigate if clicking buttons (they have their own handlers)
                if (!e.target.classList.contains('btn-create') && !e.target.classList.contains('btn-work-on')) {
                    if (postExists) {
                        navigateToOneClick(item);
                    } else {
                        // For items without posts, clicking card also creates
                        createPostFromItem(item, itemCard);
                    }
                }
            });
            
            dayColumn.appendChild(itemCard);
        });
    });
}

async function createPostFromItem(item, itemCard) {
    // Only create for blog channel
    if (item.channel !== 'blog') {
        // For non-blog channels, navigate to one-click (existing behavior)
        navigateToOneClick(item);
        return;
    }
    
    // Disable button and show loading state
    const createBtn = itemCard.querySelector('.btn-create');
    if (createBtn) {
        createBtn.disabled = true;
        createBtn.textContent = 'Creating...';
    }
    
    try {
        const response = await fetch('/launchpad/one-click-publication/api/create-post-from-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: item.category,
                item_id: item.item_id,
                year: item.year,
                week: item.week,
                output_channel: item.channel
            })
        });
        
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success && result.post_id) {
            // Update the item data
            item.post_id = result.post_id;
            item.post_exists = true;
            item.post_status = 'draft';
            
            // Update the card UI
            updateItemCardAfterCreation(itemCard, item);
        } else {
            throw new Error(result.error || 'Failed to create post');
        }
    } catch (error) {
        console.error('Error creating post:', error);
        alert(`Error creating post: ${error.message}`);
        
        // Re-enable button
        if (createBtn) {
            createBtn.disabled = false;
            createBtn.textContent = 'Create';
        }
    }
}

function updateItemCardAfterCreation(itemCard, item) {
    // Update data attributes
    itemCard.dataset.postId = item.post_id;
    
    // Get existing elements
    const typeLabel = itemCard.querySelector('.item-type-label');
    const title = itemCard.querySelector('.item-title');
    const description = itemCard.querySelector('.item-description');
    
    // Build new status and button HTML
    const statusClass = 'status-badge status-draft';
    const statusDisplay = 'Draft';
    const newContent = `
        <div class="${statusClass}">${statusDisplay}</div>
        <button class="btn-work-on">Work on This</button>
    `;
    
    // Remove old button/status
    const oldButton = itemCard.querySelector('.btn-create');
    const oldStatus = itemCard.querySelector('.status-badge');
    if (oldButton) oldButton.remove();
    if (oldStatus) oldStatus.remove();
    
    // Insert new status and button
    const container = document.createElement('div');
    container.innerHTML = newContent;
    while (container.firstChild) {
        itemCard.appendChild(container.firstChild);
    }
    
    // Add click handler to new work button
    const workBtn = itemCard.querySelector('.btn-work-on');
    if (workBtn) {
        workBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            navigateToOneClick(item);
        });
    }
}

function navigateToOneClick(item) {
    let url = '/launchpad/one-click-publication?';
    const params = [];
    
    if (item.post_id) {
        params.push(`post_id=${item.post_id}`);
    } else {
        params.push(`category=${item.category}`);
        params.push(`item_id=${item.item_id}`);
        params.push(`year=${item.year}`);
        params.push(`week=${item.week}`);
    }
    
    params.push(`output=${item.channel}`);
    
    url += params.join('&');
    window.location.href = url;
}

// Load schedule on initial page load or when tab becomes visible
document.addEventListener('DOMContentLoaded', function() {
    loadScheduleIfVisible();
});

// Also load when tab is shown (in case of dynamic tab switching)
function loadScheduleIfVisible() {
    const scheduleView = document.querySelector('.publication-schedule-view');
    if (scheduleView && scheduleView.offsetParent !== null) {
        loadSchedule();
    }
}

// Expose function globally for tab switching
window.loadPublicationSchedule = loadScheduleIfVisible;
</script>
