{# Publication Schedule Scripts - extracted from publication/dashboard.html #}
<script src="{{ url_for('static', filename='js/planning/unified-item-card.js') }}"></script>
<script>
// Schedule Management
async function loadSchedule() {
    try {
        // Get year/week from URL or use current week
        const urlParams = new URLSearchParams(window.location.search);
        const year = urlParams.get('year') || new Date().getFullYear();
        const week = urlParams.get('week') || (() => {
            const d = new Date();
            const dayNum = d.getDay() || 7;
            d.setDate(d.getDate() + 4 - dayNum);
            const yearStart = new Date(d.getFullYear(), 0, 1);
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        })();
        
        const response = await fetch(`/publication/api/dashboard/schedule?year=${year}&week=${week}`);
        const data = await response.json();
        
        if (data.success) {
            renderSchedule(data.channels);
        } else {
            console.error('Error loading schedule:', data.error);
        }
    } catch (error) {
        console.error('Error loading schedule:', error);
    }
}

function renderSchedule(channels) {
    // Clear all existing item cards (but keep empty states)
    document.querySelectorAll('.day-column .item-card').forEach(el => {
        el.remove();
    });
    
    // Show all empty states by default
    document.querySelectorAll('.day-column .empty-state').forEach(el => {
        el.style.display = 'block';
    });
    
    // Render items for each channel
    Object.keys(channels).forEach(channel => {
        const channelSection = document.querySelector(`#channel-${channel}`);
        if (!channelSection) return;
        
        const items = channels[channel];
        items.forEach(item => {
            const day = item.day;
            if (!day || day < 1 || day > 7) return;
            
            // Find the day column for this channel
            const dayColumns = channelSection.querySelectorAll('.day-column');
            if (dayColumns.length < day) return;
            
            const dayColumn = dayColumns[day - 1];
            if (!dayColumn) return;
            
            // Hide empty state
            const emptyState = dayColumn.querySelector('.empty-state');
            if (emptyState) {
                emptyState.style.display = 'none';
            }
            
            // Only skip if we have absolutely no data (no title, no item_id, no post_id)
            if ((!item.title || item.title === 'Untitled') && !item.item_id && !item.post_id) {
                return; // Skip this item
            }
            
            // Use unified item card component
            const itemCard = window.createUnifiedItemCard(item, {
                category: item.category,
                typeName: item.type_name,
                title: item.title,
                description: item.description,
                year: item.year,
                week: item.week,
                channel: item.channel,
                dataset: {
                    contentFormat: item.content_format,
                    typeName: item.type_name || ''
                },
                onCreate: (e, item, card) => {
                    createPostFromItem(item, card);
                },
                onWorkOn: (e, item, card) => {
                    navigateToOneClick(item);
                },
                onInfo: (e, item, card) => {
                    openItemModal(item);
                },
                onClick: (e, item, card) => {
                    openItemModal(item);
                }
            });
            
            dayColumn.appendChild(itemCard);
        });
    });
}

function getTypeName(item) {
    return item.type_name || item.category.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function buildStatusLine(postStatus) {
    const normalized = postStatus && postStatus.trim() ? postStatus.trim().toLowerCase() : null;
    const statusClass = normalized ? `status-badge status-${normalized}` : 'status-badge status-none';
    const display = normalized ? (normalized.charAt(0).toUpperCase() + normalized.slice(1)) : 'Not created';
    return `<div class="status-line"><span class="${statusClass}" title="Status">${display}</span></div>`;
}

function buildActionButtons(postExists) {
    return `
        <div class="item-actions">
            ${postExists ? `
                <button class="icon-btn-compact btn-work-on" title="Open 1‑click">
                    <i class="fas fa-rocket"></i>
                </button>
            ` : `
                <button class="icon-btn-compact btn-create" title="Create post">
                    <i class="fas fa-play"></i>
                </button>
            `}
            <button class="icon-btn-compact btn-info" title="View in calendar">
                <i class="fas fa-info-circle"></i>
            </button>
        </div>
    `;
}

function setItemCardContent(itemCard, item, options) {
    const postStatus = options?.postExists ? (item.post_status || 'draft') : (item.post_status || null);
    const statusHtml = buildStatusLine(postStatus);
    const actionsHtml = buildActionButtons(options?.postExists);
    const descriptionHtml = options?.description ? `<div class="item-description">${options.description}</div>` : '';
    const typeName = options?.typeName || getTypeName(item);
    const title = options?.title || item.title || 'Untitled';

    itemCard.innerHTML = `
        <div class="item-type-label">${typeName}</div>
        <div class="item-title">${title}</div>
        <div class="compact-action-row">
            ${statusHtml}
            ${actionsHtml}
        </div>
        ${descriptionHtml}
    `;

    bindItemCardActions(itemCard, item);
}

function bindItemCardActions(itemCard, item) {
    const createBtn = itemCard.querySelector('.btn-create');
    if (createBtn) {
        createBtn.onclick = function(e) {
            e.stopPropagation();
            createPostFromItem(item, itemCard);
        };
    }

    const workBtn = itemCard.querySelector('.btn-work-on');
    if (workBtn) {
        workBtn.onclick = function(e) {
            e.stopPropagation();
            navigateToOneClick(item);
        };
    }

    const infoBtn = itemCard.querySelector('.btn-info');
    if (infoBtn) {
        infoBtn.onclick = function(e) {
            e.stopPropagation();
            openItemModal(item);
        };
    }

    itemCard.onclick = function(e) {
        if (e.target.closest('.icon-btn-compact')) return;
        openItemModal(item);
    };
}

async function createPostFromItem(item, itemCard) {
    // Only create for blog channel
    if (item.channel !== 'blog') {
        // For non-blog channels, navigate to one-click (existing behavior)
        navigateToOneClick(item);
        return;
    }
    
    // Disable button and show loading state
    const createBtn = itemCard.querySelector('.btn-create');
    if (createBtn) {
        createBtn.disabled = true;
        createBtn.textContent = 'Creating...';
    }
    
    try {
        const response = await fetch('/launchpad/one-click-publication/api/create-post-from-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: item.category,
                item_id: item.item_id,
                year: item.year,
                week: item.week,
                output_channel: item.channel
            })
        });
        
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (result.success && result.post_id) {
            // Update the item data
            item.post_id = result.post_id;
            item.post_exists = true;
            item.post_status = 'draft';
            
            // Update the card UI
            updateItemCardAfterCreation(itemCard, item);
        } else {
            throw new Error(result.error || 'Failed to create post');
        }
    } catch (error) {
        console.error('Error creating post:', error);
        alert(`Error creating post: ${error.message}`);
        
        // Re-enable button
        if (createBtn) {
            createBtn.disabled = false;
            createBtn.textContent = 'Create';
        }
    }
}

function updateItemCardAfterCreation(itemCard, item) {
    // Update data attributes
    itemCard.dataset.postId = item.post_id;
    item.post_exists = true;
    const postStatus = (item.post_status || 'draft').toLowerCase();
    
    const typeLabelText = itemCard.querySelector('.item-type-label')?.textContent || getTypeName(item);
    const titleText = itemCard.querySelector('.item-title')?.textContent || item.title || 'Untitled';
    const descEl = itemCard.querySelector('.item-description');
    const descHtml = descEl ? descEl.innerHTML : '';

    setItemCardContent(itemCard, item, {
        postExists: true,
        typeName: typeLabelText,
        title: titleText,
        description: descHtml
    });
}

function openItemModal(item) {
    // Open appropriate modal based on item category
    const category = item.category || '';
    const itemId = item.item_id || item.id;
    const postId = item.post_id;
    
    if (category === 'theme' || category === 'theme_selection') {
        if (itemId) {
            const ideaModal = window.getIdeaModal ? window.getIdeaModal() : null;
            if (ideaModal) {
                ideaModal.openTheme(itemId);
                return;
            }
        }
    } else if (category === 'profile_product' || category === 'profile_surname') {
        const profileId = postId || itemId;
        if (profileId) {
            const profileModal = window.getProfileModal ? window.getProfileModal() : null;
            if (profileModal) {
                profileModal.open(profileId);
                return;
            }
        }
    } else if (category === 'recipe') {
        if (postId) {
            window.location.href = `/planning/posts/${postId}`;
            return;
        } else if (itemId) {
            window.location.href = `/recipes`;
            return;
        }
    } else if (category === 'weekly_word' || category === 'weekly_phrase' || category === 'weekly_insult') {
        if (itemId) {
            const ideaModal = window.getIdeaModal ? window.getIdeaModal() : null;
            if (ideaModal) {
                ideaModal.open(itemId);
                return;
            }
        }
    } else if (category === 'product') {
        // Product posts: navigate to product post editing page
        const queueId = item.queue_id || itemId;
        if (queueId) {
            window.location.href = `/launchpad/syndication/facebook/product_post?queue_id=${queueId}`;
            return;
        }
    }
    
    // Fallback: navigate to week-view
    openInCalendar(item);
}

function openInCalendar(item) {
    // Navigate to week-view so users get contextual modal/details
    const y = item.year || new Date().getFullYear();
    const w = item.week || (new Date()).getWeek ? (new Date()).getWeek() : '';
    const url = `/planning/calendar?year=${y}&week=${w}&tab=week-view`;
    window.open(url, '_blank');
}

function navigateToOneClick(item) {
    // Product posts go directly to product post editing page
    if (item.category === 'product') {
        const queueId = item.queue_id || item.item_id;
        if (queueId) {
            window.location.href = `/launchpad/syndication/facebook/product_post?queue_id=${queueId}`;
            return;
        }
    }
    
    let url = '/launchpad/one-click-publication?';
    const params = [];
    
    if (item.post_id) {
        params.push(`post_id=${item.post_id}`);
    } else {
        params.push(`category=${item.category}`);
        params.push(`item_id=${item.item_id}`);
        params.push(`year=${item.year}`);
        params.push(`week=${item.week}`);
    }
    
    params.push(`output=${item.channel}`);
    
    url += params.join('&');
    window.location.href = url;
}

// Load schedule on initial page load or when tab becomes visible
document.addEventListener('DOMContentLoaded', function() {
    loadScheduleIfVisible();
});

// Also load when tab is shown (in case of dynamic tab switching)
function loadScheduleIfVisible() {
    const scheduleView = document.querySelector('.publication-schedule-view');
    if (scheduleView && scheduleView.offsetParent !== null) {
        loadSchedule();
    }
}

// Expose function globally for tab switching
window.loadPublicationSchedule = loadScheduleIfVisible;
</script>
