{# Publication Schedule Styles - extracted from publication/dashboard.html #}
<style>
:root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-yellow: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
    --border-color: #334155;
}

.publication-schedule-view {
    padding: 0;
}

.schedule-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0 0 1rem 0;
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.legend-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
}

.legend-pill.theme { color: #fbbf24; }
.legend-pill.recipe { color: #f97316; }
.legend-pill.profile { color: #38bdf8; }
.legend-pill.word { color: #c084fc; }
.legend-pill.phrase { color: #22d3ee; }
.legend-pill.insult { color: #f472b6; }
.legend-pill.annual { color: #3b82f6; }
.legend-pill.special { color: #10b981; }
.legend-pill.syndication { color: #60a5fa; }

.channel-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.channel-section h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-primary);
}

.week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1rem;
}

.day-column {
    min-height: 200px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1rem;
    transition: all 0.2s;
}

.day-column:hover {
    border-color: var(--accent-blue);
}

.day-header {
    font-weight: 600;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.empty-state {
    color: var(--text-secondary);
    font-size: 0.875rem;
    text-align: center;
    padding: 2rem 0;
    opacity: 0.7;
}

.item-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
}

.item-card:hover {
    border-color: var(--accent-blue);
    box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
}

.item-type-label {
    color: var(--accent-green);
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.item-title {
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
}

.status-line { margin: 0 0 0.35rem 0; }

.item-description {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
    line-height: 1.4;
}

.compact-action-row {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-top: 0.25rem;
}
.item-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: capitalize;
    border: 1px solid transparent;
}

.status-badge.status-draft { background: #0f172a; color: var(--accent-yellow); border-color: var(--accent-yellow); }
.status-badge.status-published { background: #0f172a; color: var(--accent-green); border-color: var(--accent-green); }
.status-badge.status-deleted { background: #1f2937; color: var(--accent-red); border-color: var(--accent-red); }
.status-badge.status-publishing { background: #0f172a; color: var(--accent-blue); border-color: var(--accent-blue); }
.status-badge.status-error { background: #1f2937; color: var(--accent-red); border-color: var(--accent-red); }
.status-badge.status-none { background: #0f172a; color: var(--text-secondary); border-color: var(--border-color); }

.icon-btn-compact {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-primary);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.icon-btn-compact:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.icon-btn-compact:disabled { opacity: 0.5; cursor: not-allowed; }

/* Type-specific card colors - matching week-view */
.item-card.type-theme { border-color: #f97316; background: rgba(249, 115, 22, 0.12); color: #f8fafc; }
.item-card.type-recipe { border-color: #f59e0b; background: rgba(245, 158, 11, 0.12); color: #f8fafc; }
.item-card.type-profile,
.item-card.type-profile-product,
.item-card.type-profile-surname { border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); color: #f8fafc; }
.item-card.type-weekly-word,
.item-card.type-word { border-color: #22c55e; background: rgba(34, 197, 94, 0.12); color: #f8fafc; }
.item-card.type-weekly-phrase,
.item-card.type-phrase { border-color: #22d3ee; background: rgba(34, 211, 238, 0.12); color: #f8fafc; }
.item-card.type-weekly-insult,
.item-card.type-insult { border-color: #f472b6; background: rgba(244, 114, 182, 0.12); color: #f8fafc; }
.item-card.type-event { border-color: #10b981; background: rgba(16, 185, 129, 0.12); color: #f8fafc; }
.item-card.type-scheduled { border-color: #3b82f6; background: rgba(59, 130, 246, 0.12); color: #f8fafc; }
.item-card.type-product { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #f8fafc; }
</style>
