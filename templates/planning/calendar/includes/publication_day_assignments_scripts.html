{# Publication Day Assignments Scripts - extracted from publication/dashboard.html #}
<script>
// Prevent multiple script executions
if (window.dayAssignmentsScriptLoaded) {
    console.warn('Day assignments script already loaded, skipping re-initialization');
} else {
    window.dayAssignmentsScriptLoaded = true;

// Day Assignment Management
let assignments = [];
let changedAssignments = new Set();
let isLoadingDayAssignments = false; // Prevent multiple simultaneous loads
let dayNames = {
    1: 'Monday',
    2: 'Tuesday',
    3: 'Wednesday',
    4: 'Thursday',
    5: 'Friday',
    6: 'Saturday',
    7: 'Sunday'
};

async function loadDayAssignments() {
    if (isLoadingDayAssignments) return; // Prevent concurrent loads
    isLoadingDayAssignments = true;
    try {
        const response = await fetch('/publication/api/publication-days');
        const data = await response.json();
        
        if (data.success) {
            assignments = data.assignments;
            dayNames = data.day_names;
            renderDayAssignments();
            populateFilters(data.post_types, data.channels);
        } else {
            console.error('Failed to load assignments:', data.error);
        }
    } catch (error) {
        console.error('Error loading assignments:', error);
    } finally {
        isLoadingDayAssignments = false;
    }
}

function populateFilters(postTypes, channels) {
    const postTypeFilter = document.getElementById('filter-post-type');
    const channelFilter = document.getElementById('filter-channel');
    
    if (!postTypeFilter || !channelFilter) return;
    
    postTypes.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        postTypeFilter.appendChild(option);
    });
    
    channels.forEach(channel => {
        const option = document.createElement('option');
        option.value = channel;
        option.textContent = channel.charAt(0).toUpperCase() + channel.slice(1);
        channelFilter.appendChild(option);
    });
}

function renderDayAssignments() {
    const tbody = document.getElementById('day-assignments-tbody');
    const postTypeFilter = document.getElementById('filter-post-type');
    const channelFilter = document.getElementById('filter-channel');
    
    if (!tbody || !postTypeFilter || !channelFilter) return;
    
    const postTypeFilterValue = postTypeFilter.value;
    const channelFilterValue = channelFilter.value;
    
    // Group assignments by post_type and content_format
    const grouped = {};
    assignments.forEach(assignment => {
        if (postTypeFilterValue && assignment.post_type !== postTypeFilterValue) return;
        if (channelFilterValue && assignment.channel !== channelFilterValue) return;
        
        const key = `${assignment.post_type}|${assignment.content_format}`;
        if (!grouped[key]) {
            grouped[key] = {
                post_type: assignment.post_type,
                content_format: assignment.content_format,
                channels: {}
            };
        }
        grouped[key].channels[assignment.channel] = assignment;
    });
    
    tbody.innerHTML = '';
    
    Object.keys(grouped).sort().forEach(key => {
        const group = grouped[key];
        const row = document.createElement('tr');
        
        // Post Type column
        const typeCell = document.createElement('td');
        typeCell.textContent = group.post_type;
        row.appendChild(typeCell);
        
        // Content Format column
        const formatCell = document.createElement('td');
        formatCell.textContent = group.content_format;
        row.appendChild(formatCell);
        
        // Channel columns
        ['blog', 'facebook', 'instagram', 'twitter', 'newsletter'].forEach(channel => {
            const cell = document.createElement('td');
            const assignment = group.channels[channel];
            
            if (assignment) {
                const select = document.createElement('select');
                select.className = 'day-select';
                select.dataset.assignmentId = assignment.id;
                
                // Store original value for change detection
                const originalValue = assignment.publication_day !== null && assignment.publication_day !== undefined 
                    ? parseInt(assignment.publication_day) 
                    : null;
                select.dataset.originalValue = originalValue !== null ? originalValue.toString() : '';
                
                // Add options
                const nullOption = document.createElement('option');
                nullOption.value = '';
                nullOption.textContent = 'Not assigned';
                if (originalValue === null) nullOption.selected = true;
                select.appendChild(nullOption);
                
                for (let day = 1; day <= 7; day++) {
                    const option = document.createElement('option');
                    option.value = day.toString();
                    option.textContent = dayNames[day];
                    if (originalValue === day) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }
                
                select.addEventListener('change', function() {
                    const originalStr = this.dataset.originalValue || '';
                    const storedOriginal = originalStr === '' ? null : parseInt(originalStr);
                    const newValue = this.value === '' ? null : parseInt(this.value);
                    const isChanged = storedOriginal !== newValue;
                    
                    if (isChanged) {
                        this.classList.add('changed');
                        changedAssignments.add(assignment.id);
                    } else {
                        this.classList.remove('changed');
                        changedAssignments.delete(assignment.id);
                    }
                    updateSaveButton();
                });
                
                cell.appendChild(select);
                
                // Add badges
                if (assignment.is_primary) {
                    const primaryBadge = document.createElement('span');
                    primaryBadge.className = 'primary-badge';
                    primaryBadge.textContent = 'Primary';
                    cell.appendChild(primaryBadge);
                }
                if (assignment.is_required) {
                    const requiredBadge = document.createElement('span');
                    requiredBadge.className = 'required-badge';
                    requiredBadge.textContent = 'Required';
                    cell.appendChild(requiredBadge);
                }
                if (!assignment.is_active) {
                    const inactiveBadge = document.createElement('span');
                    inactiveBadge.className = 'format-badge';
                    inactiveBadge.style.opacity = '0.5';
                    inactiveBadge.textContent = 'Inactive';
                    cell.appendChild(inactiveBadge);
                }
            } else {
                cell.textContent = '-';
                cell.style.color = 'var(--text-secondary)';
                cell.style.opacity = '0.5';
            }
            
            row.appendChild(cell);
        });
        
        tbody.appendChild(row);
    });
}

function updateSaveButton() {
    const saveBtn = document.getElementById('btn-save-all');
    if (!saveBtn) return;
    saveBtn.disabled = changedAssignments.size === 0;
    if (changedAssignments.size > 0) {
        saveBtn.textContent = `Save ${changedAssignments.size} Change(s)`;
    } else {
        saveBtn.textContent = 'Save All Changes';
    }
}

async function saveAllChanges() {
    const updates = [];
    document.querySelectorAll('.day-select.changed').forEach(select => {
        const assignmentId = parseInt(select.dataset.assignmentId);
        const newValue = select.value ? parseInt(select.value) : null;
        updates.push({ id: assignmentId, publication_day: newValue });
    });
    
    if (updates.length === 0) return;
    
    try {
        const response = await fetch('/publication/api/publication-days/bulk', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ updates })
        });
        
        const data = await response.json();
        
        if (data.success) {
            document.querySelectorAll('.day-select.changed').forEach(select => {
                select.classList.remove('changed');
            });
            changedAssignments.clear();
            updateSaveButton();
            await loadDayAssignments();
            alert(`Successfully updated ${updates.length} assignment(s)`);
        } else {
            alert('Error saving changes: ' + data.error);
        }
    } catch (error) {
        console.error('Error saving changes:', error);
        alert('Error saving changes. Please try again.');
    }
}

function resetChanges() {
    document.querySelectorAll('.day-select.changed').forEach(select => {
        const assignmentId = parseInt(select.dataset.assignmentId);
        const assignment = assignments.find(a => a.id === assignmentId);
        if (assignment) {
            select.value = assignment.publication_day || '';
            select.classList.remove('changed');
        }
    });
    changedAssignments.clear();
    updateSaveButton();
}

// Initialize on DOM ready (only once)
let initialized = false;
document.addEventListener('DOMContentLoaded', function() {
    if (initialized) return; // Prevent multiple initializations
    initialized = true;
    
    loadDayAssignmentsIfVisible();
    setupEventListeners();
});

// Load assignments if tab is visible (with recursion protection)
let isCheckingVisibility = false;
function loadDayAssignmentsIfVisible() {
    // Prevent recursion
    if (isCheckingVisibility) {
        console.warn('loadDayAssignmentsIfVisible called recursively, aborting');
        return;
    }
    
    isCheckingVisibility = true;
    try {
        const dayAssignmentsView = document.querySelector('.publication-day-assignments-view');
        if (dayAssignmentsView && dayAssignmentsView.offsetParent !== null) {
            if (assignments.length === 0 && !isLoadingDayAssignments) {
                loadDayAssignments();
            }
        }
    } finally {
        isCheckingVisibility = false;
    }
}

// Setup event listeners (only once)
let eventListenersSetup = false;
function setupEventListeners() {
    if (eventListenersSetup) return; // Prevent duplicate listeners
    eventListenersSetup = true;
    
    const saveBtn = document.getElementById('btn-save-all');
    const resetBtn = document.getElementById('btn-reset-changes');
    const postTypeFilter = document.getElementById('filter-post-type');
    const channelFilter = document.getElementById('filter-channel');
    
    if (saveBtn) {
        saveBtn.addEventListener('click', saveAllChanges);
    }
    if (resetBtn) {
        resetBtn.addEventListener('click', resetChanges);
    }
    if (postTypeFilter) {
        postTypeFilter.addEventListener('change', renderDayAssignments);
    }
    if (channelFilter) {
        channelFilter.addEventListener('change', renderDayAssignments);
    }
}

// Expose function globally for tab switching (use different name to avoid conflict)
window.loadDayAssignmentsTab = loadDayAssignmentsIfVisible;

} // End of script loading guard
</script>
