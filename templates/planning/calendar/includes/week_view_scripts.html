{# Week View Scripts - extracted from week_view.html #}
<script>
window.postId = 0;  {# No post_id needed for unified calendar #}
window.currentStage = 'calendar';
window.currentSubstage = 'week-view';

// Simple week navigation by updating URL
function navigateWeek(delta) {
  const urlParams = new URLSearchParams(window.location.search);
  let year = parseInt(urlParams.get('year')) || new Date().getFullYear();
  let week = parseInt(urlParams.get('week')) || getCurrentISOWeek();
  
  // Calculate new week
  const date = getDateFromISOWeek(year, week);
  date.setDate(date.getDate() + (delta * 7));
  const newYear = date.getFullYear();
  const newWeek = getISOWeek(date);
  
  // Update URL
  urlParams.set('year', newYear);
  urlParams.set('week', newWeek);
  window.location.search = urlParams.toString();
}

function getCurrentISOWeek() {
  const now = new Date();
  return getISOWeek(now);
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getDateFromISOWeek(year, week) {
  const simple = new Date(year, 0, 1 + (week - 1) * 7);
  const dow = simple.getDay();
  const ISOweekStart = simple;
  if (dow <= 4) {
    ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
  } else {
    ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
  }
  return ISOweekStart;
}
</script>

<script type="module">
// Wait for unified-item-card to be available and DOM to be ready
(async function() {
    // Wait for unified-item-card function
    while (typeof window.createUnifiedItemCard !== 'function') {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
        await new Promise(resolve => {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', resolve);
            } else {
                resolve();
            }
        });
    }
    
    // Additional small delay to ensure all elements are in DOM
    await new Promise(resolve => setTimeout(resolve, 100));
    
    // Now import the module
    await import('/static/js/planning/calendar-week-view.js');
})();
</script>

<script>
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', () => {
    const ideaModal = getIdeaModal();
    const profileModal = window.getProfileModal ? window.getProfileModal() : null;
    
    document.addEventListener('click', (e) => {
        const themeItem = e.target.closest('.week-themes .item.idea');
        if (themeItem && themeItem.dataset.ideaId) {
            const ideaId = themeItem.dataset.ideaId;
            ideaModal.open(parseInt(ideaId));
        }
    });
    
    document.addEventListener('click', (e) => {
        const eventItem = e.target.closest('.item.event');
        if (eventItem && eventItem.dataset.eventId) {
            const eventId = parseInt(eventItem.dataset.eventId);
            const event = window.currentWeekEvents?.find(ev => ev.id === eventId);
            if (event) {
                ideaModal.open(null, event);
            }
        }
    });
    
    window.addEventListener('idea-saved', () => {
        const currentYear = parseInt(document.getElementById('week-year')?.textContent || new Date().getFullYear());
        const currentWeek = parseInt(document.getElementById('week-number')?.textContent || 44);
        if (typeof loadWeek === 'function') {
            loadWeek(currentYear, currentWeek);
        } else {
            location.reload();
        }
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Esc') {
            const ideaModal = document.getElementById('idea-modal');
            if (ideaModal && ideaModal.style.display === 'flex') {
                const modal = getIdeaModal();
                if (modal) {
                    modal.close();
                }
            }
            
            const profileModal = document.getElementById('profile-modal');
            if (profileModal && profileModal.style.display === 'flex') {
                const modal = window.getProfileModal ? window.getProfileModal() : null;
                if (modal && typeof modal.close === 'function') {
                    modal.close();
                } else {
                    profileModal.style.display = 'none';
                }
            }
        }
    });
});
</script>
