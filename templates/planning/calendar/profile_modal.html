<!-- Profile Management Modal Component -->
<!-- For creating and editing Product & Category Profiles -->

<div id="profile-modal" class="profile-modal-overlay" style="display: none;">
    <div class="profile-modal-container">
        <!-- Modal Header -->
        <div class="profile-modal-header">
            <div class="profile-modal-header-top">
                <h2 class="profile-modal-title" id="profile-modal-title">Create Profile</h2>
                <button class="profile-modal-close" id="profile-modal-close" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="profile-modal-type-selector">
                <label class="profile-type-option">
                    <input type="radio" name="profile-type" value="product" id="profile-type-product" checked />
                    <span><i class="fas fa-briefcase"></i> Product Profile</span>
                </label>
                <label class="profile-type-option">
                    <input type="radio" name="profile-type" value="category" id="profile-type-category" />
                    <span><i class="fas fa-folder"></i> Category Profile</span>
                </label>
            </div>
        </div>

        <!-- Modal Body -->
        <div class="profile-modal-body" id="profile-modal-body">
            
            <div id="profile-modal-loading" class="profile-modal-loading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>

            <!-- Main Form -->
            <form id="profile-modal-form" class="profile-modal-form">
                <!-- Profile Type Section -->
                <section class="profile-section">
                    <h3 class="profile-section-title">
                        <i class="fas fa-info-circle"></i>
                        Profile Type
                    </h3>
                    
                    <div class="profile-form-group">
                        <label class="profile-label required">Profile Type</label>
                        <div class="profile-type-buttons">
                            <button type="button" class="profile-type-btn active" data-type="product">
                                <i class="fas fa-briefcase"></i> Product Profile
                            </button>
                            <button type="button" class="profile-type-btn" data-type="category">
                                <i class="fas fa-folder"></i> Category Profile
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Product Selection (for Product Profiles) -->
                <section class="profile-section" id="product-selection-section">
                    <h3 class="profile-section-title">
                        <i class="fas fa-box"></i>
                        Select Product
                    </h3>
                    
                    <div class="profile-form-group">
                        <label for="profile-product-search" class="profile-label required">Search Products</label>
                        <input type="text" id="profile-product-search" class="profile-input" 
                               placeholder="Search by product name, SKU, or producer...">
                        <div id="product-search-results" class="search-results"></div>
                    </div>
                    
                    <div id="selected-product" class="selected-item" style="display: none;">
                        <div class="selected-item-info">
                            <img id="selected-product-image" src="" alt="Product image">
                            <div>
                                <h4 id="selected-product-name"></h4>
                                <p id="selected-product-producer"></p>
                                <p id="selected-product-price"></p>
                            </div>
                        </div>
                        <button type="button" class="btn-remove" id="remove-product">Remove</button>
                    </div>
                </section>

                <!-- Category Selection (for Category Profiles) -->
                <section class="profile-section" id="category-selection-section" style="display: none;">
                    <h3 class="profile-section-title">
                        <i class="fas fa-folder"></i>
                        Select Category
                    </h3>
                    
                    <div class="profile-form-group">
                        <label for="profile-category-select" class="profile-label required">Category</label>
                        <select id="profile-category-select" class="profile-select">
                            <option value="">-- Select Category --</option>
                        </select>
                    </div>
                    
                    <div id="selected-category" class="selected-item" style="display: none;">
                        <div class="selected-item-info">
                            <div>
                                <h4 id="selected-category-name"></h4>
                                <p id="selected-category-path"></p>
                                <p id="selected-category-level"></p>
                            </div>
                        </div>
                        <button type="button" class="btn-remove" id="remove-category">Remove</button>
                    </div>
                </section>

                <!-- Basic Information Section -->
                <section class="profile-section">
                    <h3 class="profile-section-title">
                        <i class="fas fa-edit"></i>
                        Basic Information
                    </h3>
                    
                    <div class="profile-form-group">
                        <label for="profile-title" class="profile-label required">Title</label>
                        <input type="text" id="profile-title" name="title" class="profile-input" required 
                               placeholder="e.g., Lambswool Scarf by Lochcarron">
                    </div>

                    <div class="profile-form-group">
                        <label for="profile-standfirst" class="profile-label">Standfirst</label>
                        <textarea id="profile-standfirst" name="standfirst" class="profile-textarea" rows="2"
                                  placeholder="One-sentence summary for hero section and meta description..."></textarea>
                    </div>
                </section>

                <!-- Scheduling Section -->
                <section class="profile-section">
                    <h3 class="profile-section-title">
                        <i class="fas fa-calendar"></i>
                        Schedule for Week
                    </h3>
                    
                    <div class="profile-form-grid">
                        <div class="profile-form-group">
                            <label for="profile-weekday" class="profile-label">Weekday</label>
                            <select id="profile-weekday" name="weekday" class="profile-select">
                                <option value="">-- Select Day --</option>
                                <option value="1">Monday</option>
                                <option value="2">Tuesday</option>
                                <option value="3">Wednesday</option>
                                <option value="4">Thursday</option>
                                <option value="5">Friday</option>
                                <option value="6">Saturday</option>
                                <option value="7">Sunday</option>
                            </select>
                        </div>
                        
                        <div class="profile-form-group">
                            <label class="profile-label">Week</label>
                            <input type="text" id="profile-week-display" class="profile-input" readonly
                                   value="Current week from calendar">
                            <input type="hidden" id="profile-year" name="year">
                            <input type="hidden" id="profile-week-number" name="week_number">
                        </div>
                    </div>
                </section>

                <!-- Error Message -->
                <div id="profile-modal-error" class="profile-error" style="display: none;"></div>
            </form>
        </div>

        <!-- Modal Footer -->
        <div class="profile-modal-footer">
            <button type="button" class="btn-secondary" id="profile-modal-cancel">Cancel</button>
            <button type="button" class="btn-primary" id="profile-modal-save">Save Profile</button>
            <button type="button" class="btn-danger" id="profile-modal-delete" style="display: none;">Delete</button>
        </div>
    </div>
</div>
