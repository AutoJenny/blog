{# Select Source Component Include #}
{# Reusable component for selecting products/categories as sources #}

<!-- Source Selection Section -->
<section class="content-generator-section" id="source-selection-section">
    <h3 class="content-generator-section-title">
        <i class="fas fa-search"></i>
        Select Source
    </h3>
    
    <!-- Product Selection -->
    <div id="product-selection-group">
        <div class="content-generator-search-row">
            <div class="content-generator-form-group">
                <label for="content-generator-product-search" class="content-generator-label required">Search Products</label>
                <input type="text" id="content-generator-product-search" class="content-generator-input" 
                       placeholder="Search by product name, SKU, or producer...">
                <div id="content-generator-product-search-results" class="search-results"></div>
            </div>
            
            <div class="content-generator-form-group">
                <label for="content-generator-product-smart-search" class="content-generator-label">
                    <i class="fas fa-lightbulb"></i> Smart Search
                </label>
                <input type="text" id="content-generator-product-smart-search" class="content-generator-input" 
                       placeholder="Search by meaning...">
                <div id="content-generator-product-smart-search-results" class="search-results"></div>
            </div>
        </div>
        
        <div id="content-generator-selected-product" class="selected-item" style="display: none;">
            <div class="selected-item-info">
                <img id="content-generator-product-image" src="" alt="Product image">
                <div>
                    <h4 id="content-generator-product-name"></h4>
                    <p id="content-generator-product-producer"></p>
                    <p id="content-generator-product-price"></p>
                </div>
            </div>
            <button type="button" class="btn-remove" id="content-generator-remove-product">Remove</button>
        </div>
    </div>
    
    <!-- Category Selection -->
    <div id="category-selection-group" style="display: none;">
        <div class="content-generator-form-group">
            <label for="content-generator-category-select" class="content-generator-label required">Category</label>
            <select id="content-generator-category-select" class="content-generator-select">
                <option value="">-- Select Category --</option>
            </select>
        </div>
        
        <div id="content-generator-selected-category" class="selected-item" style="display: none;">
            <div class="selected-item-info">
                <div>
                    <h4 id="content-generator-category-name"></h4>
                    <p id="content-generator-category-path"></p>
                </div>
            </div>
            <button type="button" class="btn-remove" id="content-generator-remove-category">Remove</button>
        </div>
    </div>
</section>
