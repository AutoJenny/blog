{# Profile Creation Modal #}
{# Modal for creating a new profile post using Product Browser #}

<div id="profile-creation-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 900px; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
            <h3>Create Profile Post</h3>
            <span class="close" onclick="closeProfileCreationModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p style="color: #cbd5e1; margin-bottom: 1.5rem;">Select a product or category to create a profile post:</p>
            
            <!-- Product Browser Component (navigation hidden for modal) -->
            <div id="profile-modal-product-browser">
                {% include 'includes/product_browser_component.html' %}
            </div>
            
            <!-- Selected Product Display -->
            <div id="profile-selected-product" style="display: none; margin-top: 1.5rem; padding: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px;">
                <h4 style="color: #f1f5f9; margin-bottom: 0.5rem;">Selected Product:</h4>
                <div id="profile-selected-product-info" style="color: #cbd5e1;"></div>
                <button id="profile-create-post-btn" class="btn btn-primary" style="margin-top: 1rem; padding: 0.75rem 1.5rem; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-plus"></i> Create Profile Post
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let selectedProductId = null;
let selectedProductName = null;

function openProfileCreationModal() {
    const modal = document.getElementById('profile-creation-modal');
    if (modal) {
        modal.style.display = 'block';
        // Hide navigation in product browser for modal context
        const navElement = document.getElementById('product-browser-navigation');
        if (navElement) {
            navElement.style.display = 'none';
        }
        // Reset selection
        selectedProductId = null;
        selectedProductName = null;
        document.getElementById('profile-selected-product').style.display = 'none';
    }
}

function closeProfileCreationModal() {
    const modal = document.getElementById('profile-creation-modal');
    if (modal) {
        modal.style.display = 'none';
        // Reset selection
        selectedProductId = null;
        selectedProductName = null;
        document.getElementById('profile-selected-product').style.display = 'none';
    }
}

// Handle product selection from Product Browser component
window.onProductBrowserSelect = function(productId, productName) {
    selectedProductId = productId;
    selectedProductName = productName;
    
    // Show selected product info
    const selectedDiv = document.getElementById('profile-selected-product');
    const infoDiv = document.getElementById('profile-selected-product-info');
    
    if (selectedDiv && infoDiv) {
        infoDiv.innerHTML = `
            <div style="color: #f1f5f9; font-weight: 600; margin-bottom: 0.25rem;">${escapeHtml(productName)}</div>
            <div style="color: #94a3b8; font-size: 0.875rem;">Product ID: ${productId}</div>
        `;
        selectedDiv.style.display = 'block';
    }
};

// Create profile post
document.addEventListener('DOMContentLoaded', function() {
    const createBtn = document.getElementById('profile-create-post-btn');
    if (createBtn) {
        createBtn.addEventListener('click', async function() {
            if (!selectedProductId) {
                alert('Please select a product first');
                return;
            }
            
            // Disable button and show loading
            createBtn.disabled = true;
            createBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            
            try {
                // Create profile post via API
                const response = await fetch('/api/posts/create-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product_id: selectedProductId,
                        product_name: selectedProductName
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.post_id) {
                    // Redirect to the new post's planning page
                    window.location.href = `/planning/posts/${data.post_id}/calendar/week-view`;
                } else {
                    throw new Error(data.error || 'Failed to create profile post');
                }
            } catch (error) {
                console.error('Error creating profile post:', error);
                alert('Error creating profile post: ' + error.message);
                createBtn.disabled = false;
                createBtn.innerHTML = '<i class="fas fa-plus"></i> Create Profile Post';
            }
        });
    }
});

// Close modal when clicking outside
window.addEventListener('click', function(event) {
    const modal = document.getElementById('profile-creation-modal');
    if (event.target === modal) {
        closeProfileCreationModal();
    }
});

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

<style>
#profile-creation-modal {
    position: fixed;
    z-index: 1001;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
}

#profile-creation-modal .modal-content {
    background: #1e293b;
    margin: 5% auto;
    padding: 0;
    border: 1px solid #334155;
    border-radius: 8px;
    width: 90%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
}

#profile-creation-modal .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #334155;
    position: sticky;
    top: 0;
    background: #1e293b;
    z-index: 10;
}

#profile-creation-modal .modal-header h3 {
    color: #f1f5f9;
    margin: 0;
}

#profile-creation-modal .close {
    color: #94a3b8;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
}

#profile-creation-modal .close:hover {
    color: #f1f5f9;
}

#profile-creation-modal .modal-body {
    padding: 1.5rem;
}

#profile-modal-product-browser {
    margin-bottom: 1rem;
}

#profile-selected-product {
    border-top: 2px solid #334155;
    padding-top: 1rem;
}

.btn-primary:hover:not(:disabled) {
    background: #047857 !important;
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
</style>
