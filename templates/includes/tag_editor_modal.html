{# Tag Editor Modal Include #}
{# Reusable modal for editing product tags #}

<script>
// Tag Editor Modal
let currentEditingProductId = null;
let tagEditorModal = null;

// Make function globally accessible
window.openTagEditor = function(productId) {
    currentEditingProductId = productId;
    
    // Create modal if it doesn't exist
    if (!tagEditorModal) {
        createTagEditorModal();
    }
    
    // Load current product tags and available tags
    loadTagsForEditor(productId);
    
    // Show modal
    tagEditorModal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function createTagEditorModal() {
    tagEditorModal = document.createElement('div');
    tagEditorModal.className = 'tag-editor-modal';
    tagEditorModal.innerHTML = `
        <div class="tag-editor-modal-content">
            <div class="tag-editor-header">
                <h2>Edit Tags</h2>
                <button class="tag-editor-close" onclick="closeTagEditor()">&times;</button>
            </div>
            <div class="tag-editor-body" id="tag-editor-body">
                <div class="tag-editor-loading">Loading tags...</div>
            </div>
        </div>
    `;
    document.body.appendChild(tagEditorModal);
    
    // Close on background click
    tagEditorModal.addEventListener('click', (e) => {
        if (e.target === tagEditorModal) {
            closeTagEditor();
        }
    });
}

window.closeTagEditor = function() {
    if (tagEditorModal) {
        tagEditorModal.style.display = 'none';
        document.body.style.overflow = '';
    }
}

async function loadTagsForEditor(productId) {
    const body = document.getElementById('tag-editor-body');
    body.innerHTML = '<div class="tag-editor-loading">Loading tags...</div>';
    
    try {
        // Get current product data
        const productResponse = await fetch(`/products/api/${productId}/full`);
        const productData = await productResponse.json();
        
        if (!productData.success) {
            throw new Error(productData.error || 'Failed to load product');
        }
        
        // Get all available tags
        const tagsResponse = await fetch('/tags/api/all');
        const tagsData = await tagsResponse.json();
        
        if (!tagsData.success) {
            throw new Error(tagsData.error || 'Failed to load tags');
        }
        
        const currentTags = productData.product_data.product_type_data || {};
        const availableTags = tagsData.tags;
        
        // Render tag editor
        renderTagEditor(currentTags, availableTags);
        
    } catch (error) {
        console.error('Error loading tags:', error);
        body.innerHTML = `<div class="tag-editor-error">Error loading tags: ${error.message}</div>`;
    }
}

function renderTagEditor(currentTags, availableTags) {
    const body = document.getElementById('tag-editor-body');
    
    let html = '';
    
    // Product Category
    const identityActive = getActiveTagsForGroup('identity', currentTags, availableTags);
    html += createTagGroup('identity', 'Product Category', currentTags, availableTags, identityActive);
    
    // Design
    if (availableTags.physical_attributes) {
        const physicalActive = getActiveTagsForGroup('physical', currentTags, availableTags);
        html += createTagGroup('physical', 'Design', currentTags, availableTags, physicalActive);
    }
    
    // Usage
    if (availableTags.usage_context) {
        const usageActive = getActiveTagsForGroup('usage', currentTags, availableTags);
        html += createTagGroup('usage', 'Usage', currentTags, availableTags, usageActive);
    }
    
    body.innerHTML = html;
    
    // Initialize accordions
    initializeTagEditorAccordions();
}

function getActiveTagsForGroup(groupType, currentTags, availableTags) {
    const active = [];
    
    if (groupType === 'identity') {
        if (currentTags.disambiguation?.product_form) {
            active.push({type: 'product_form', value: currentTags.disambiguation.product_form, label: 'Category'});
        }
        if (currentTags.core_type) {
            active.push({type: 'core_type', value: currentTags.core_type, label: 'Product Group'});
        }
        if (currentTags.subtype) {
            active.push({type: 'subtype', value: currentTags.subtype, label: 'Product Type'});
        }
    } else if (groupType === 'physical') {
        if (currentTags.materials && currentTags.materials.length > 0) {
            active.push({type: 'materials', values: currentTags.materials, label: 'Materials'});
        }
        if (currentTags.patterns && currentTags.patterns.length > 0) {
            active.push({type: 'patterns', values: currentTags.patterns, label: 'Patterns'});
        }
        if (currentTags.decorations && currentTags.decorations.length > 0) {
            active.push({type: 'decorations', values: currentTags.decorations, label: 'Motif'});
        }
    } else if (groupType === 'usage') {
        if (currentTags.occasions && currentTags.occasions.length > 0) {
            active.push({type: 'occasions', values: currentTags.occasions, label: 'Occasions'});
        }
        if (currentTags.styles && currentTags.styles.length > 0) {
            active.push({type: 'styles', values: currentTags.styles, label: 'Styles'});
        }
    }
    
    return active;
}

function createTagGroup(groupId, groupName, currentTags, availableTags, activeTags) {
    const storageKey = `tag-editor-accordion-${groupId}`;
    const savedState = localStorage.getItem(storageKey);
    const isOpen = savedState === null ? true : savedState === 'open';
    
    let html = `<div class="tag-editor-group-accordion" data-group-id="${groupId}" data-accordion-state="${isOpen ? 'open' : 'closed'}">`;
    html += `<div class="tag-editor-group-header" onclick="toggleTagGroup('${groupId}')">`;
    html += `<i class="fas fa-chevron-down tag-editor-accordion-icon"></i>`;
    html += `<span class="tag-editor-group-name">${groupName}</span>`;
    
    // Show active tags preview when closed
    if (activeTags.length > 0 && !isOpen) {
        const previewHTML = activeTags.map(a => {
            if (a.values) {
                const tagValues = a.values.slice(0, 2);
                const moreCount = a.values.length > 2 ? a.values.length - 2 : 0;
                let html = `${a.label}: `;
                html += tagValues.map(val => `<span class="tag-preview-value">${val}</span>`).join(', ');
                if (moreCount > 0) {
                    html += ` <span class="tag-preview-value">+${moreCount}</span>`;
                }
                return html;
            } else {
                return `${a.label}: <span class="tag-preview-value">${a.value}</span>`;
            }
        }).join('; ');
        html += `<span class="tag-editor-group-preview">${previewHTML}</span>`;
    }
    
    html += '</div>';
    html += `<div class="tag-editor-group-content" ${!isOpen ? 'style="display: none;"' : ''}>`;
    
    if (groupId === 'identity') {
        // Category (Product Form)
        if (availableTags.identity_classification && availableTags.identity_classification.product_form) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Category:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'product_form\', \'Category\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentCategory = currentTags.disambiguation?.product_form;
            for (const form of availableTags.identity_classification.product_form) {
                const isSelected = form.tag === currentCategory;
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="product_form" 
                               data-tag-value="${form.tag}"
                               onclick="toggleTag(this, 'product_form', '${form.tag}')">
                          ${form.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
        
        // Product Group (Core Type)
        if (availableTags.identity_classification && availableTags.identity_classification.core_type) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Product Group:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'core_type\', \'Product Group\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentCoreType = currentTags.core_type;
            const filteredCoreTypes = availableTags.identity_classification.core_type;
            
            for (const coreType of filteredCoreTypes) {
                const isSelected = coreType.tag === currentCoreType;
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="core_type" 
                               data-tag-value="${coreType.tag}"
                               onclick="toggleTag(this, 'core_type', '${coreType.tag}')">
                          ${coreType.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
        
        // Product Type
        if (currentTags.core_type && availableTags.identity_classification && availableTags.identity_classification.subtype) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Product Type:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'subtype\', \'Product Type\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentSubtype = currentTags.subtype;
            for (const subtype of availableTags.identity_classification.subtype) {
                const isSelected = subtype.tag === currentSubtype;
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="subtype" 
                               data-tag-value="${subtype.tag}"
                               onclick="toggleTag(this, 'subtype', '${subtype.tag}')">
                          ${subtype.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
    } else if (groupId === 'physical') {
        // Materials
        if (availableTags.physical_attributes.materials) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Materials:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'materials\', \'Materials\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentMaterials = currentTags.materials || [];
            for (const material of availableTags.physical_attributes.materials) {
                if (material.tag === '__missing__') continue;
                const isSelected = currentMaterials.includes(material.tag);
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="materials" 
                               data-tag-value="${material.tag}"
                               onclick="toggleTag(this, 'materials', '${material.tag}')">
                          ${material.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
        
        // Patterns
        if (availableTags.physical_attributes.patterns) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Patterns:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'patterns\', \'Patterns\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentPatterns = currentTags.patterns || [];
            for (const pattern of availableTags.physical_attributes.patterns) {
                const isSelected = currentPatterns.includes(pattern.tag);
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="patterns" 
                               data-tag-value="${pattern.tag}"
                               onclick="toggleTag(this, 'patterns', '${pattern.tag}')">
                          ${pattern.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
        
        // Motif
        if (availableTags.physical_attributes.decorations) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Motif:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'decorations\', \'Motif\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentDecorations = currentTags.decorations || [];
            for (const decoration of availableTags.physical_attributes.decorations) {
                const isSelected = currentDecorations.includes(decoration.tag);
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="decorations" 
                               data-tag-value="${decoration.tag}"
                               onclick="toggleTag(this, 'decorations', '${decoration.tag}')">
                          ${decoration.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
    } else if (groupId === 'usage') {
        // Occasions
        if (availableTags.usage_context.occasions) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Occasions:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'occasions\', \'Occasions\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentOccasions = currentTags.occasions || [];
            for (const occasion of availableTags.usage_context.occasions) {
                const isSelected = currentOccasions.includes(occasion.tag);
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="occasions" 
                               data-tag-value="${occasion.tag}"
                               onclick="toggleTag(this, 'occasions', '${occasion.tag}')">
                          ${occasion.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
        
        // Styles
        if (availableTags.usage_context.styles) {
            html += '<div class="tag-editor-subgroup">';
            html += '<div class="tag-editor-label-row"><div class="tag-editor-label">Styles:</div><button class="tag-editor-add-btn" onclick="addNewTag(\'styles\', \'Styles\')">Add...</button></div>';
            html += '<div class="tag-editor-tags">';
            const currentStyles = currentTags.styles || [];
            for (const style of availableTags.usage_context.styles) {
                const isSelected = currentStyles.includes(style.tag);
                html += `<span class="tag-editor-tag ${isSelected ? 'selected' : 'inactive'}" 
                               data-tag-type="styles" 
                               data-tag-value="${style.tag}"
                               onclick="toggleTag(this, 'styles', '${style.tag}')">
                          ${style.tag.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        </span>`;
            }
            html += '</div></div>';
        }
    }
    
    html += '</div></div>';
    return html;
}

function toggleTagGroup(groupId) {
    const accordion = document.querySelector(`.tag-editor-group-accordion[data-group-id="${groupId}"]`);
    if (!accordion) return;
    
    const currentState = accordion.getAttribute('data-accordion-state');
    const newState = currentState === 'open' ? 'closed' : 'open';
    
    accordion.setAttribute('data-accordion-state', newState);
    const content = accordion.querySelector('.tag-editor-group-content');
    const icon = accordion.querySelector('.tag-editor-accordion-icon');
    
    if (newState === 'closed') {
        content.style.display = 'none';
        icon.style.transform = 'rotate(-90deg)';
    } else {
        content.style.display = 'block';
        icon.style.transform = 'rotate(0deg)';
    }
    
    // Save state to localStorage
    localStorage.setItem(`tag-editor-accordion-${groupId}`, newState);
    
    // Update preview when closing
    if (newState === 'closed') {
        updateGroupPreview(groupId);
    }
}

function updateGroupPreview(groupId) {
    const accordion = document.querySelector(`.tag-editor-group-accordion[data-group-id="${groupId}"]`);
    if (!accordion) return;
    
    const header = accordion.querySelector('.tag-editor-group-header');
    let preview = header.querySelector('.tag-editor-group-preview');
    
    // Get active tags by subgroup
    const subgroups = accordion.querySelectorAll('.tag-editor-subgroup');
    const activeItems = [];
    
    subgroups.forEach(subgroup => {
        const label = subgroup.querySelector('.tag-editor-label')?.textContent.replace(':', '');
        const selectedTags = Array.from(subgroup.querySelectorAll('.tag-editor-tag.selected'));
        
        if (selectedTags.length > 0) {
            const tagValues = selectedTags.map(tag => tag.textContent.trim()).slice(0, 2);
            const moreCount = selectedTags.length > 2 ? selectedTags.length - 2 : 0;
            
            // Create HTML with labels in normal color and tag names in orange
            let previewHTML = `${label}: `;
            previewHTML += tagValues.map(val => `<span class="tag-preview-value">${val}</span>`).join(', ');
            if (moreCount > 0) {
                previewHTML += ` <span class="tag-preview-value">+${moreCount}</span>`;
            }
            activeItems.push(previewHTML);
        }
    });
    
    if (activeItems.length === 0) {
        if (preview) preview.remove();
        return;
    }
    
    const previewHTML = activeItems.join('; ');
    
    if (!preview) {
        preview = document.createElement('span');
        preview.className = 'tag-editor-group-preview';
        header.appendChild(preview);
    }
    preview.innerHTML = previewHTML;
}

function initializeTagEditorAccordions() {
    const accordions = document.querySelectorAll('.tag-editor-group-accordion');
    accordions.forEach(accordion => {
        const state = accordion.getAttribute('data-accordion-state');
        const content = accordion.querySelector('.tag-editor-group-content');
        const icon = accordion.querySelector('.tag-editor-accordion-icon');
        const groupId = accordion.getAttribute('data-group-id');
        
        if (state === 'closed') {
            content.style.display = 'none';
            icon.style.transform = 'rotate(-90deg)';
            // Update preview for closed accordions
            updateGroupPreview(groupId);
        } else {
            content.style.display = 'block';
            icon.style.transform = 'rotate(0deg)';
        }
    });
}

function toggleTag(element, tagType, tagValue) {
    // Toggle selection
    element.classList.toggle('selected');
    element.classList.toggle('inactive');
    
    // Get current state
    const isSelected = element.classList.contains('selected');
    
    // For single-selection tags, deselect others
    if (tagType === 'product_form' || tagType === 'core_type' || tagType === 'subtype') {
        // Deselect all other tags of the same type
        const allTagsOfType = document.querySelectorAll(`.tag-editor-tag[data-tag-type="${tagType}"]`);
        allTagsOfType.forEach(tag => {
            if (tag !== element) {
                tag.classList.remove('selected');
                tag.classList.add('inactive');
            }
        });
    }
    
    // Prepare update data
    const updateData = {};
    
    if (tagType === 'product_form') {
        // Single selection - replace current
        updateData.disambiguation = {
            product_form: isSelected ? tagValue : null
        };
    } else if (tagType === 'core_type') {
        // Single selection - replace current
        updateData.core_type = isSelected ? tagValue : null;
        // Clear subtype if core_type is deselected
        if (!isSelected) {
            updateData.subtype = null;
        }
    } else if (tagType === 'subtype') {
        // Single selection - replace current
        updateData.subtype = isSelected ? tagValue : null;
    } else {
        // Array-based tags (materials, patterns, decorations, occasions, styles)
        // Get all selected tags of this type
        const selectedTags = Array.from(document.querySelectorAll(
            `.tag-editor-tag[data-tag-type="${tagType}"].selected`
        )).map(el => el.getAttribute('data-tag-value'));
        
        updateData[tagType] = selectedTags;
    }
    
    // Auto-save
    saveTagUpdate(updateData);
    
    // Update previews for closed accordions
    const accordions = document.querySelectorAll('.tag-editor-group-accordion[data-accordion-state="closed"]');
    accordions.forEach(accordion => {
        const groupId = accordion.getAttribute('data-group-id');
        updateGroupPreview(groupId);
    });
}

async function saveTagUpdate(updateData) {
    if (!currentEditingProductId) return Promise.resolve();
    
    try {
        const response = await fetch(`/products/api/${currentEditingProductId}/tags`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(updateData)
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Reload the product display to show updated tags
            if (window.currentProductId === currentEditingProductId) {
                loadProduct(currentEditingProductId);
            }
            return Promise.resolve();
        } else {
            console.error('Error saving tags:', data.error);
            alert('Error saving tags: ' + (data.error || 'Unknown error'));
            return Promise.reject(new Error(data.error));
        }
    } catch (error) {
        console.error('Error saving tags:', error);
        alert('Error saving tags: ' + error.message);
        return Promise.reject(error);
    }
}

function addNewTag(tagType, tagLabel) {
    const tagName = prompt(`Enter new ${tagLabel.toLowerCase()} tag name:`);
    if (!tagName || !tagName.trim()) {
        return;
    }
    
    // Normalize tag name (lowercase, replace spaces with underscores)
    const normalizedTag = tagName.trim().toLowerCase().replace(/\s+/g, '_');
    
    // Check if tag already exists
    const existingTag = document.querySelector(`.tag-editor-tag[data-tag-type="${tagType}"][data-tag-value="${normalizedTag}"]`);
    if (existingTag) {
        alert('This tag already exists');
        // Select it if it exists
        existingTag.classList.add('selected');
        existingTag.classList.remove('inactive');
        return;
    }
    
    // Add the new tag to the current product immediately
    const updateData = {};
    
    if (tagType === 'product_form') {
        updateData.disambiguation = {
            product_form: normalizedTag
        };
    } else if (tagType === 'core_type') {
        updateData.core_type = normalizedTag;
    } else if (tagType === 'subtype') {
        updateData.subtype = normalizedTag;
    } else {
        // Array-based tags - get current values and add new one
        const currentValues = [];
        const existingSelected = document.querySelectorAll(`.tag-editor-tag[data-tag-type="${tagType}"].selected`);
        existingSelected.forEach(tag => {
            currentValues.push(tag.getAttribute('data-tag-value'));
        });
        currentValues.push(normalizedTag);
        updateData[tagType] = currentValues;
    }
    
    // Save to database
    saveTagUpdate(updateData).then(() => {
        // Reload tags to get the updated list
        loadTagsForEditor(currentEditingProductId);
    });
}
</script>
