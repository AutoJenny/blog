<!-- Authoring LLM Module - Split into Settings and Prompts panels -->
<div class="authoring-llm-module">
    
    <!-- LLM Settings Panel -->
    <div class="llm-settings-panel" id="llm-settings-panel">
        <div class="panel-header" onclick="toggleLLMSettingsAccordion()">
            <h4 id="settings-title">LLM Settings: Loading...</h4>
            <div class="header-actions">
                <i class="fas fa-chevron-up" id="settings-accordion-icon"></i>
            </div>
        </div>
        
        <div class="panel-content" id="settings-accordion-content" style="display: none;">
            <!-- Active Settings Display -->
            <div id="llm-provider-info" class="provider-info">
                <!-- LLM provider, model, and settings will appear here -->
            </div>
            
            <!-- Provider Selection -->
            <div class="provider-selection">
                <label for="llm-provider-select">Provider:</label>
                <select id="llm-provider-select">
                    <option value="Ollama">Ollama</option>
                    <option value="OpenAI">OpenAI</option>
                </select>
            </div>
            
            <!-- Model Selection -->
            <div class="model-selection">
                <label for="llm-model-select">Model:</label>
                <select id="llm-model-select">
                    <option value="llama3.2:latest">llama3.2:latest</option>
                    <option value="gpt-4">gpt-4</option>
                </select>
            </div>
            
            <!-- Parameters -->
            <div class="model-parameters">
                <div class="param-row">
                    <label for="temperature">Temperature:</label>
                    <input type="range" id="temperature" value="0.7" min="0" max="2" step="0.1">
                    <span class="param-value" id="temperature-value">0.7</span>
                </div>
                <div class="param-row">
                    <label for="max-tokens">Max Tokens:</label>
                    <input type="number" id="max-tokens" value="2000" min="100" max="4000" step="100">
                </div>
            </div>
        </div>
    </div>

    <!-- LLM Prompts Panel -->
    <div class="llm-prompts-panel" id="llm-prompts-panel">
        <div class="panel-header" onclick="toggleLLMPromptsAccordion()">
            <h4 id="prompt-title">Prompt (Authoring): Loading...</h4>
            <div class="header-actions">
                <button class="btn btn-primary btn-sm" id="generate-btn">
                    <i class="fas fa-magic"></i> Generate
                </button>
                <i class="fas fa-chevron-up" id="prompts-accordion-icon"></i>
            </div>
        </div>
        
        <div class="panel-content" id="prompts-accordion-content" style="display: none;">
            <!-- Prompt Display -->
            <div id="llm-prompt-display" class="prompt-display">
                <!-- LLM prompt will appear here -->
            </div>
            
            <!-- Prompt Edit Form -->
            <div id="llm-prompt-edit" class="prompt-edit" style="display: none;">
                <div class="form-group">
                    <label for="system-prompt-edit">System Prompt</label>
                    <textarea id="system-prompt-edit" rows="4" placeholder="System prompt..."></textarea>
                </div>
                <div class="form-group">
                    <label for="user-prompt-edit">User Prompt</label>
                    <textarea id="user-prompt-edit" rows="8" placeholder="User prompt..."></textarea>
                </div>
                <div class="prompt-actions">
                    <button class="btn btn-secondary" id="save-prompt-btn">Save</button>
                    <button class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
                </div>
            </div>
            
            <!-- Edit Controls -->
            <div class="prompt-actions" id="prompt-actions">
                <button class="btn btn-secondary" id="edit-prompt-btn">Edit Prompt</button>
            </div>
        </div>
    </div>
    
</div>
