<!-- Image Prompts Output Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/authoring/output-panel-image-prompts.css') }}">

<div class="output-panel" id="image-prompts-output-panel">
    <div class="panel-header" onclick="toggleImagePromptsOutputAccordion()">
        <h4><span class="panel-name-green">Output:</span> <span id="current-section-title">Select a section to generate image prompts</span></h4>
        <div class="header-actions">
            <button class="btn-primary" id="save-prompt-btn" disabled>Save</button>
            <button class="btn-secondary" id="regenerate-prompt-btn" disabled>Regenerate</button>
            <i class="fas fa-chevron-down" id="image-prompts-accordion-icon"></i>
        </div>
    </div>
    
    <div class="panel-content" id="image-prompts-accordion-content" style="display: block;">
        <!-- Generated Prompt Display -->
        <div class="prompt-display">
            <h5>Generated Image Prompt</h5>
            <div class="prompt-content">
                <textarea id="generated-prompt-textarea" rows="6" placeholder="Generated image prompt will appear here." disabled></textarea>
                <div class="editor-stats">
                    <span id="char-count">0 chars</span>
                    <span id="last-saved">Not saved</span>
                </div>
            </div>
        </div>
        
        <!-- Prompt Metadata -->
        <div class="prompt-metadata">
            <h5>Prompt Details</h5>
            <div class="metadata-grid">
                <div class="metadata-item">
                    <label>Model:</label>
                    <span id="prompt-model">-</span>
                </div>
                <div class="metadata-item">
                    <label>Character Count:</label>
                    <span id="prompt-character-count">-</span>
                </div>
                <div class="metadata-item">
                    <label>Style:</label>
                    <span id="prompt-style">-</span>
                </div>
                <div class="metadata-item">
                    <label>Generated:</label>
                    <span id="prompt-generated-time">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/authoring/output-panel-image-prompts.js') }}"></script>
