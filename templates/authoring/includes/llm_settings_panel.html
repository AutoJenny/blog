<!-- LLM Settings Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/authoring/llm-settings-panel.css') }}">

<!-- LLM Settings Panel - Self-contained include -->
<div class="llm-settings-panel" id="llm-settings-panel">
    <div class="panel-header" onclick="toggleLLMSettingsAccordion()">
        <h4><span class="panel-name-green">LLM Settings:</span> <span id="settings-title">Loading...</span></h4>
        <div class="header-actions">
            <i class="fas fa-chevron-up" id="settings-accordion-icon"></i>
        </div>
    </div>
    
    <div class="panel-content" id="settings-accordion-content" style="display: none;">
        <!-- Active Settings Display -->
        <div id="llm-provider-info" class="provider-info">
            <!-- LLM provider, model, and settings will appear here -->
        </div>
        
        <!-- Provider Selection -->
        <div class="provider-selection">
            <label for="llm-provider-select">Provider:</label>
            <select id="llm-provider-select">
                <option value="Ollama">Ollama</option>
                <option value="OpenAI">OpenAI</option>
            </select>
        </div>
        
        <!-- Model Selection -->
        <div class="model-selection">
            <label for="llm-model-select">Model:</label>
            <select id="llm-model-select">
                <option value="llama3.2:latest">llama3.2:latest</option>
                <option value="gpt-4">gpt-4</option>
            </select>
        </div>
        
        <!-- Parameters -->
        <div class="model-parameters">
            <div class="param-row">
                <label for="temperature">Temperature:</label>
                <input type="range" id="temperature" value="0.7" min="0" max="2" step="0.1">
                <span class="param-value" id="temperature-value">0.7</span>
            </div>
            <div class="param-row">
                <label for="max-tokens">Max Tokens:</label>
                <input type="number" id="max-tokens" value="2000" min="100" max="4000" step="100">
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/authoring/llm-settings-panel.js') }}"></script>
