<section class="panel panel-styles">
  <h2 class="panel-title">Image Styles (Post-wide)</h2>
  <div class="panel-body">
    <div id="styles-list"></div>
    <div class="styles-actions" style="margin-top:0.75rem; display:flex; gap:0.5rem;">
      <button id="create-style-btn" class="btn btn-primary">Create Style</button>
      <button id="activate-style-btn" class="btn btn-secondary" disabled>Activate Selected</button>
    </div>
    <textarea id="style-json-editor" rows="8" style="width:100%; margin-top:0.75rem; font-family:monospace; background:#1e293b; color:#e2e8f0; border:1px solid #475569; padding:0.5rem; border-radius:4px;"></textarea>
    <div style="margin-top:0.5rem; font-size:0.9rem; color:#bbb;">
      Styles apply to all sections in this post. Manage variants and choose one active style.
    </div>
  </div>
</section>

<script>
console.log('[Styles Panel] Script loaded, setting up event listener...');

document.addEventListener('authoring:styles:loaded', function(e){
  console.log('[Styles Panel] Event received:', e.detail);
  const data = e.detail || {};
  const styles = (data.styles || []).map(s => ({ name: s.name, style_json: s.style_json, is_active: s.is_active }));
  const list = document.getElementById('styles-list');
  if(!list) {
    console.error('[Styles Panel] styles-list element not found');
    return;
  }
  console.log('[Styles Panel] Rendering', styles.length, 'styles');
  list.innerHTML = '';
  styles.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'style-row';
    row.style = 'display:flex; align-items:center; gap:0.5rem; padding:0.25rem 0;';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'style-select';
    radio.value = String(idx);
    if(s.is_active) radio.checked = true;
    const label = document.createElement('span');
    label.textContent = s.name || 'Unnamed Style';
    if(s.is_active){
      const badge = document.createElement('span');
      badge.textContent = 'Active';
      badge.style = 'margin-left:0.5rem; color:#7bf; font-size:0.85rem;';
      label.appendChild(badge);
    }
    row.appendChild(radio);
    row.appendChild(label);
    row.addEventListener('click', () => {
      console.log('[Styles Panel] Style clicked:', s.name);
      radio.checked = true;
      const activateBtn = document.getElementById('activate-style-btn');
      if(activateBtn) activateBtn.disabled = false;
      const editor = document.getElementById('style-json-editor');
      if(editor) {
        try {
          editor.value = JSON.stringify(s.style_json || {}, null, 2);
          console.log('[Styles Panel] JSON populated:', s.style_json);
        } catch(e) { 
          console.error('[Styles Panel] JSON error:', e);
          editor.value = '{}'; 
        }
      }
    });
    list.appendChild(row);
  });
  
  // Auto-populate the first style's JSON
  if(styles.length > 0) {
    const firstStyle = styles[0];
    const editor = document.getElementById('style-json-editor');
    if(editor && firstStyle.style_json) {
      try {
        editor.value = JSON.stringify(firstStyle.style_json, null, 2);
        console.log('[Styles Panel] Auto-populated first style JSON');
      } catch(e) {
        console.error('[Styles Panel] Auto-populate error:', e);
      }
    }
  }
});

document.addEventListener('DOMContentLoaded', function(){
  const createBtn = document.getElementById('create-style-btn');
  const activateBtn = document.getElementById('activate-style-btn');
  const editor = document.getElementById('style-json-editor');
  if(createBtn){
    createBtn.addEventListener('click', async () => {
      let name = prompt('Name this style variant:', 'Default');
      if(name === null) return;
      let payload = {};
      try { payload = JSON.parse(editor.value || '{}'); } catch { alert('Invalid JSON'); return; }
      await window.AuthoringStyles.createStyle(name, payload, true);
    });
  }
  if(activateBtn){
    activateBtn.addEventListener('click', async () => {
      const selected = document.querySelector('input[name="style-select"]:checked');
      if(!selected) return;
      await window.AuthoringStyles.activateStyle(Number(selected.value));
    });
  }
});
</script>
