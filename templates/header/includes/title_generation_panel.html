<!-- Title Generation Panel -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/title-generation-panel.css') }}">

<div class="title-generation-panel" id="title-generation-panel">
    <div class="panel-header" onclick="toggleTitleGenerationAccordion()">
        <h4><span class="panel-name-green">Title Generation:</span> <span id="title-generation-status">Generate multiple title options</span></h4>
        <div class="header-actions">
            <i class="fas fa-chevron-down" id="title-generation-accordion-icon"></i>
        </div>
    </div>
    <div class="panel-content" id="title-generation-content">
        <!-- Prompt View Panel -->
        {% set panel_type = 'title' %}
        {% include 'header/includes/prompt_view_panel.html' %}
        
        <div class="title-options" id="title-options">
            <!-- Title options will be populated dynamically -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/header/title-generation-panel.js') }}"></script>
