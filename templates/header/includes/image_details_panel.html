<!-- Image Details Panel -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/image-details-panel.css') }}?v=9999&t=1737036000">

<div class="image-details-panel" id="image-details-panel">
    <div class="panel-header" onclick="toggleImageDetailsAccordion()">
        <h4><span class="panel-name-green">Image Details:</span> <span id="image-details-status">Caption and alt text</span></h4>
        <div class="header-actions" onclick="event.stopPropagation()">
            <button class="btn-primary" id="generate-details-btn">Generate</button>
            <i class="fas fa-chevron-down" id="image-details-accordion-icon"></i>
        </div>
    </div>
    <div class="panel-content" id="image-details-content">
        <div class="image-caption">
            <label for="image-caption-input">Caption:</label>
            <textarea id="image-caption-input" placeholder="Caption will be generated..."></textarea>
        </div>
        <div class="image-alt-text">
            <label for="image-alt-input">Alt Text:</label>
            <textarea id="image-alt-input" placeholder="Alt text will be generated..."></textarea>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/header/image-details-panel.js') }}?v=9999&t=1737036000"></script>
