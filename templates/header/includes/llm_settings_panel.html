<!-- LLM Settings Panel - Collapsible -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/header-panel.css') }}">
<div class="llm-settings-panel" id="llm-settings-panel">
    <div class="panel-header" onclick="toggleLLMSettingsAccordion()">
        <h4><span class="panel-name-green">LLM Settings:</span> Prompt Generation Model</h4>
        <div class="header-actions" onclick="event.stopPropagation()">
            <button class="btn-primary" id="generate-llm-message-btn" style="padding: 0.5rem 1rem; border-radius: 4px; background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 600;">
                <i class="fas fa-magic"></i> Generate LLM-Imaging Message
            </button>
            <i class="fas fa-chevron-down" id="llm-settings-accordion-icon"></i>
        </div>
    </div>
    <div class="panel-content collapsed" id="llm-settings-accordion-content">
        <div class="model-selection">
            <label for="llm-provider-select">Provider:</label>
            <select id="llm-provider-select">
                <option value="ollama">Ollama</option>
                <option value="openai">OpenAI</option>
            </select>
        </div>
        <div class="model-selection">
            <label for="llm-model-select">Model:</label>
            <select id="llm-model-select">
                <option value="llama3.2:latest">llama3.2:latest</option>
                <option value="gpt-4">gpt-4</option>
            </select>
        </div>
    </div>
</div>

<script>
function toggleLLMSettingsAccordion() {
    const content = document.getElementById('llm-settings-accordion-content');
    const icon = document.getElementById('llm-settings-accordion-icon');
    if (content && icon) {
        const isCurrentlyOpen = !content.classList.contains('collapsed');
        content.classList.toggle('collapsed');
        icon.classList.toggle('open');
        // Save state to sessionStorage
        sessionStorage.setItem('llm-settings-accordion', !isCurrentlyOpen ? 'closed' : 'open');
    }
}

// Restore accordion state from sessionStorage on page load
document.addEventListener('DOMContentLoaded', function() {
    const content = document.getElementById('llm-settings-accordion-content');
    const icon = document.getElementById('llm-settings-accordion-icon');
    if (content && icon) {
        const savedState = sessionStorage.getItem('llm-settings-accordion');
        if (savedState === 'open') {
            content.classList.remove('collapsed');
            icon.classList.add('open');
        } else {
            content.classList.add('collapsed');
            icon.classList.remove('open');
        }
    }
});
</script>
