<!-- Profile Header Prompt Panel - Profile-specific -->
<div class="accordion-panel" id="profile-header-prompt-panel">
    <div class="panel-header" onclick="toggleAccordion('profile-header-prompt-content', 'profile-header-prompt-icon')">
        <h4><i class="fas fa-magic"></i> Header Image Prompt Generation</h4>
        <div class="header-actions">
            <i class="fas fa-chevron-down" id="profile-header-prompt-icon"></i>
        </div>
    </div>
    <div class="panel-content collapsed" id="profile-header-prompt-content">
        <div class="prompt-generation-section">
            <p style="color: #94a3b8; margin-bottom: 1rem;">
                Generate a header image prompt based on the product information and post content.
            </p>
            
            <button class="btn-primary" id="generate-profile-header-prompt-btn" style="margin-bottom: 1rem;">

                    <button class="btn-secondary" id="copy-prompt-btn" title="Copy prompt to clipboard">

        </div>
    </div>
</div>
