<!-- Mini-Preview Panel -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/mini-preview-panel.css') }}">

<div class="mini-preview-panel" id="mini-preview-panel">
    <div class="panel-header">
        <h4><span class="panel-name-green">Mini-Preview:</span> <span id="mini-preview-status">Post Preview</span></h4>
    </div>
    <div class="panel-content">
        <div class="preview-tabs">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="development" onclick="switchPreviewTab('development')">
                    Development
                </button>
                <button class="tab-button" data-tab="final" onclick="switchPreviewTab('final')">
                    Final
                </button>
            </div>
            
            <div class="tab-content">
                <div class="tab-pane active" id="development-tab">
                    <div class="preview-content" id="development-preview">
                        <h5>Post Content</h5>
                        
                        <div class="content-field">
                            <label>Selected Idea:</label>
                            <div class="field-value" id="dev-selected-idea">Loading...</div>
                        </div>
                        
                        <div class="content-field">
                            <label>Expanded Idea:</label>
                            <div class="field-value accordion-field" id="dev-expanded-idea-container">
                                <div class="accordion-header" onclick="toggleFieldAccordion('dev-expanded-idea')">
                                    <span class="field-preview" id="dev-expanded-idea-preview">Loading...</span>
                                    <i class="fas fa-chevron-down accordion-icon" id="dev-expanded-idea-icon"></i>
                                </div>
                                <div class="accordion-content collapsed" id="dev-expanded-idea-content">
                                    <div class="field-full-content" id="dev-expanded-idea">Loading...</div>
                                </div>
                            </div>
                        </div>
                        
                        <h5>Section Content</h5>
                        <div class="sections-container" id="sections-container">
                            <!-- Section content will be populated dynamically -->
                        </div>
                    </div>
                </div>
                </div>
                
                <div class="tab-pane" id="final-tab">
                    <div class="preview-content" id="final-preview">
                        <!-- Final preview content will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/header/mini-preview-panel.js') }}"></script>
