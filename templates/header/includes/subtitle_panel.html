<!-- Subtitle Panel -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/subtitle-panel.css') }}">

<div class="subtitle-panel" id="subtitle-panel">
    <div class="panel-header" onclick="toggleSubtitleAccordion()">
        <h4><span class="panel-name-green">Subtitle:</span> <span id="subtitle-status">Generated subtitle (editable)</span></h4>
        <div class="header-actions">
            <i class="fas fa-chevron-down" id="subtitle-accordion-icon"></i>
        </div>
    </div>
    <div class="panel-content" id="subtitle-content">
        <!-- Prompt View Panel -->
        {% set panel_type = 'subtitle' %}
        {% include 'header/includes/prompt_view_panel.html' %}
        
        <div class="subtitle-options" id="subtitle-options">
            <!-- Subtitle options will be populated dynamically -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/header/subtitle-panel.js') }}"></script>
