<!-- Progress Panel -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/header/progress-panel.css') }}">

<div class="progress-panel" id="progress-panel">
    <div class="panel-header">
        <h4><span class="panel-name-green">Progress:</span> <span id="progress-status">Header Stage</span></h4>
    </div>
    <div class="panel-content" id="progress-content">
        <div class="progress-steps">
            <div class="step completed">
                <i class="fas fa-check"></i>
                <span>Title & Summary</span>
            </div>
            <div class="step current">
                <i class="fas fa-circle"></i>
                <span>Header Image</span>
            </div>
            <div class="step pending">
                <i class="far fa-circle"></i>
                <span>SEO & Meta</span>
            </div>
            <div class="step pending">
                <i class="far fa-circle"></i>
                <span>Publishing Details</span>
            </div>
            <div class="step pending">
                <i class="far fa-circle"></i>
                <span>Final Review</span>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/header/progress-panel.js') }}"></script>
