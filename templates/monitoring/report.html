{% extends "base.html" %}

{% block title %}Monitoring Report - BlogForge{% endblock %}

{% block head %}
<style>
    .monitoring-report {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
    }
    
    .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #334155;
    }
    
    .report-title {
        font-size: 2rem;
        font-weight: 700;
        color: #f1f5f9;
    }
    
    .status-controls {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        background: #1e293b;
        border: 1px solid #334155;
    }
    
    .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }
    
    .status-dot.running {
        background: #10b981;
        animation: none;
    }
    
    .status-dot.stopped {
        background: #ef4444;
    }
    
    .control-btn {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: none;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .control-btn.start {
        background: #10b981;
        color: white;
    }
    
    .control-btn.start:hover {
        background: #059669;
    }
    
    .control-btn.stop {
        background: #ef4444;
        color: white;
    }
    
    .control-btn.stop:hover {
        background: #dc2626;
    }
    
    .events-table {
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
    }
    
    .events-table-header {
        background: #0f172a;
        padding: 1rem;
        display: grid;
        grid-template-columns: 180px 200px 1fr 80px;
        gap: 1rem;
        font-weight: 600;
        color: #94a3b8;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid #334155;
    }
    
    .event-row {
        display: grid;
        grid-template-columns: 180px 200px 1fr 80px;
        gap: 1rem;
        padding: 1rem;
        border-bottom: 1px solid #334155;
        transition: background 0.2s ease;
    }
    
    .event-row:hover {
        background: #0f172a;
    }
    
    .event-row:last-child {
        border-bottom: none;
    }
    
    .event-timestamp {
        color: #94a3b8;
        font-size: 0.875rem;
        font-family: 'Courier New', monospace;
    }
    
    .event-script {
        color: #a5b4fc;
        font-size: 0.875rem;
        font-weight: 500;
    }
    
    .event-message {
        color: #e2e8f0;
        font-size: 0.875rem;
        line-height: 1.5;
    }
    
    .event-result {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .result-icon {
        font-size: 1.25rem;
    }
    
    .result-icon.success {
        color: #10b981;
    }
    
    .result-icon.error {
        color: #ef4444;
    }
    
    .result-icon.warning {
        color: #f59e0b;
    }
    
    .loading {
        text-align: center;
        padding: 3rem;
        color: #94a3b8;
    }
    
    .empty-state {
        text-align: center;
        padding: 3rem;
        color: #94a3b8;
    }
    
    .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: #64748b;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    /* Filter Tabs */
    .filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 2px solid #334155;
        padding-bottom: 0.5rem;
    }
    
    .filter-tab {
        padding: 0.75rem 1.5rem;
        background: transparent;
        border: none;
        border-bottom: 3px solid transparent;
        color: #94a3b8;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.875rem;
    }
    
    .filter-tab:hover {
        color: #e2e8f0;
        background: #1e293b;
    }
    
    .filter-tab.active {
        color: #a5b4fc;
        border-bottom-color: #a5b4fc;
    }
</style>
{% endblock %}

{% block content %}
<div class="monitoring-report">
    <div class="report-header">
        <h1 class="report-title">Automation Monitoring Report</h1>
        <div class="status-controls">
            <div class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Checking...</span>
            </div>
            <button class="control-btn start hidden" id="start-btn">Start Monitor</button>
            <button class="control-btn stop hidden" id="stop-btn">Stop Monitor</button>
        </div>
    </div>
    
    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All Events</button>
        <button class="filter-tab" data-filter="posting">Automated Postings</button>
        <button class="filter-tab" data-filter="admin">Administrative</button>
    </div>
    
    <div class="events-table">
        <div class="events-table-header">
            <div>Timestamp</div>
            <div>Script</div>
            <div>Message</div>
            <div>Result</div>
        </div>
        <div id="events-container">
            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading events...
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    const STATUS_DOT = document.getElementById('status-dot');
    const STATUS_TEXT = document.getElementById('status-text');
    const START_BTN = document.getElementById('start-btn');
    const STOP_BTN = document.getElementById('stop-btn');
    const EVENTS_CONTAINER = document.getElementById('events-container');
    
    let eventsRefreshInterval = null;
    let currentFilter = 'all';
    
    /**
     * Update monitoring status
     */
    function updateStatus() {
        fetch('/monitoring/status')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.is_running) {
                        STATUS_DOT.className = 'status-dot running';
                        STATUS_TEXT.textContent = 'Running';
                        START_BTN.classList.add('hidden');
                        STOP_BTN.classList.remove('hidden');
                    } else {
                        STATUS_DOT.className = 'status-dot stopped';
                        STATUS_TEXT.textContent = 'Stopped';
                        START_BTN.classList.remove('hidden');
                        STOP_BTN.classList.add('hidden');
                    }
                }
            })
            .catch(error => {
                console.error('Error checking status:', error);
            });
    }
    
    /**
     * Load events
     */
    function loadEvents(filter = 'all') {
        const url = `/monitoring/api/events${filter !== 'all' ? '?type=' + filter : ''}`;
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.events && data.events.length > 0) {
                    renderEvents(data.events);
                } else {
                    EVENTS_CONTAINER.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-inbox"></i>
                            <p>No events found${filter !== 'all' ? ' for this filter' : ''}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error loading events:', error);
                EVENTS_CONTAINER.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Error loading events: ${error.message}</p>
                    </div>
                `;
            });
    }
    
    /**
     * Handle filter tab clicks
     */
    function setupFilterTabs() {
        const tabs = document.querySelectorAll('.filter-tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Update active state
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Update filter and reload events
                currentFilter = tab.dataset.filter;
                loadEvents(currentFilter);
            });
        });
    }
    
    /**
     * Render events
     */
    function renderEvents(events) {
        const html = events.map(event => {
            const timestamp = new Date(event.timestamp).toLocaleString();
            const resultIcon = getResultIcon(event.result);
            
            return `
                <div class="event-row">
                    <div class="event-timestamp">${timestamp}</div>
                    <div class="event-script">${event.script}</div>
                    <div class="event-message">${escapeHtml(event.message)}</div>
                    <div class="event-result">${resultIcon}</div>
                </div>
            `;
        }).join('');
        
        EVENTS_CONTAINER.innerHTML = html;
    }
    
    /**
     * Get result icon
     */
    function getResultIcon(result) {
        const icons = {
            'success': '<i class="fa-solid fa-circle-check result-icon success"></i>',
            'error': '<i class="fa-solid fa-circle-xmark result-icon error"></i>',
            'warning': '<i class="fa-solid fa-triangle-exclamation result-icon warning"></i>'
        };
        return icons[result] || '<i class="fa-solid fa-circle result-icon"></i>';
    }
    
    /**
     * Escape HTML
     */
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    /**
     * Start monitoring
     */
    function startMonitoring() {
        START_BTN.disabled = true;
        START_BTN.textContent = 'Starting...';
        
        fetch('/monitoring/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateStatus();
                    setTimeout(() => {
                        START_BTN.disabled = false;
                        START_BTN.textContent = 'Start Monitor';
                    }, 2000);
                } else {
                    alert('Failed to start: ' + (data.error || 'Unknown error'));
                    START_BTN.disabled = false;
                    START_BTN.textContent = 'Start Monitor';
                }
            })
            .catch(error => {
                alert('Error: ' + error.message);
                START_BTN.disabled = false;
                START_BTN.textContent = 'Start Monitor';
            });
    }
    
    /**
     * Stop monitoring
     */
    function stopMonitoring() {
        if (!confirm('Are you sure you want to stop the monitoring system?')) {
            return;
        }
        
        STOP_BTN.disabled = true;
        STOP_BTN.textContent = 'Stopping...';
        
        fetch('/monitoring/stop', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateStatus();
                    setTimeout(() => {
                        STOP_BTN.disabled = false;
                        STOP_BTN.textContent = 'Stop Monitor';
                    }, 2000);
                } else {
                    alert('Failed to stop: ' + (data.error || 'Unknown error'));
                    STOP_BTN.disabled = false;
                    STOP_BTN.textContent = 'Stop Monitor';
                }
            })
            .catch(error => {
                alert('Error: ' + error.message);
                STOP_BTN.disabled = false;
                STOP_BTN.textContent = 'Stop Monitor';
            });
    }
    
    // Initialize
    updateStatus();
    loadEvents(currentFilter);
    setupFilterTabs();
    
    // Refresh status every 30 seconds
    setInterval(updateStatus, 30000);
    
    // Refresh events every 60 seconds
    eventsRefreshInterval = setInterval(() => loadEvents(currentFilter), 60000);
    
    // Button handlers
    START_BTN.addEventListener('click', startMonitoring);
    STOP_BTN.addEventListener('click', stopMonitoring);
    
    // Cleanup
    window.addEventListener('beforeunload', () => {
        if (eventsRefreshInterval) {
            clearInterval(eventsRefreshInterval);
        }
    });
})();
</script>
{% endblock %}
