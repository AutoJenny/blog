{% extends "base.html" %}

{% block title %}History: {{ project_name }}{% endblock %}

{% block head %}
<style>
    .chat-history-page { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    .chat-history-title { font-size: 1.75rem; font-weight: 700; color: #f1f5f9; margin-bottom: 1.5rem; }
    .chat-toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
    .chat-toolbar button { padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #475569; background: #334155; color: #e2e8f0; font-size: 0.875rem; cursor: pointer; transition: background 0.15s; }
    .chat-toolbar button:hover { background: #475569; }
    .chat-toolbar .import-badge { font-size: 0.75rem; background: #f59e0b; color: #000; border-radius: 9999px; padding: 0.125rem 0.5rem; margin-left: 0.25rem; font-weight: 600; }

    .accordion-container { display: flex; flex-direction: column; gap: 0.5rem; }
    .conv-accordion { border: 1px solid #334155; border-radius: 0.75rem; overflow: hidden; background: #1e293b; }
    .conv-header { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.25rem; cursor: pointer; user-select: none; transition: background 0.15s; }
    .conv-header:hover { background: #334155; }
    .conv-header-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
    .conv-chevron { color: #94a3b8; transition: transform 0.2s; font-size: 0.875rem; }
    .conv-chevron.open { transform: rotate(90deg); }
    .conv-name { font-weight: 600; color: #f1f5f9; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-name-input { background: #0f172a; border: 1px solid #475569; border-radius: 0.375rem; color: #f1f5f9; padding: 0.25rem 0.5rem; font-size: 0.95rem; font-weight: 600; width: 100%; max-width: 300px; }
    .conv-header-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .conv-timestamp { font-size: 0.75rem; color: #64748b; }
    .conv-delete { color: #64748b; cursor: pointer; font-size: 0.875rem; transition: color 0.15s; padding: 0.25rem; }
    .conv-delete:hover { color: #ef4444; }
    .conv-edit { color: #64748b; cursor: pointer; font-size: 0.875rem; transition: color 0.15s; padding: 0.25rem; }
    .conv-edit:hover { color: #60a5fa; }

    .conv-body { display: none; border-top: 1px solid #334155; padding: 1rem 1.25rem; }
    .conv-body.open { display: block; }

    .msg-item { padding: 0.75rem 0; border-bottom: 1px solid #1e293b; }
    .msg-item:last-child { border-bottom: none; }
    .msg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.375rem; }
    .msg-role { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .msg-role.user { color: #60a5fa; }
    .msg-role.assistant { color: #34d399; }
    .msg-header-right { display: flex; align-items: center; gap: 0.5rem; }
    .msg-timestamp { font-size: 0.7rem; color: #64748b; }
    .msg-delete { color: #64748b; cursor: pointer; font-size: 0.75rem; transition: color 0.15s; padding: 0.125rem; }
    .msg-delete:hover { color: #ef4444; }
    .msg-content { color: #cbd5e1; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }

    .empty-state { text-align: center; color: #64748b; padding: 3rem 1rem; }
    .empty-state i { font-size: 2rem; margin-bottom: 0.75rem; display: block; }

    .new-conv-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .new-conv-modal-bg.open { display: flex; }
    .new-conv-modal { background: #1e293b; border: 1px solid #475569; border-radius: 0.75rem; padding: 1.5rem; width: 100%; max-width: 400px; }
    .new-conv-modal h3 { color: #f1f5f9; font-size: 1.125rem; margin-bottom: 1rem; }
    .new-conv-modal input { width: 100%; padding: 0.5rem 0.75rem; background: #0f172a; border: 1px solid #475569; border-radius: 0.375rem; color: #f1f5f9; font-size: 0.875rem; margin-bottom: 1rem; box-sizing: border-box; }
    .new-conv-modal .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
    .new-conv-modal button { padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; font-size: 0.875rem; cursor: pointer; }
    .new-conv-modal .btn-cancel { background: #334155; color: #e2e8f0; }
    .new-conv-modal .btn-create { background: #2563eb; color: #fff; }
    .new-conv-modal .btn-create:hover { background: #1d4ed8; }
</style>
{% endblock %}

{% block content %}
<div class="chat-history-page">
    <h1 class="chat-history-title">History: {{ project_name }}</h1>

    <div class="chat-toolbar">
        <button id="btn-new-conv"><i class="fa-solid fa-plus"></i> New Conversation</button>
        <button id="btn-import"><i class="fa-solid fa-file-import"></i> Import Chats <span id="import-badge" class="import-badge" style="display:none"></span></button>
    </div>

    <div id="accordion-container" class="accordion-container">
        <div class="empty-state" id="empty-state">
            <i class="fa-solid fa-comments"></i>
            <p>No conversations yet. Create one to get started.</p>
        </div>
    </div>
</div>

<div class="new-conv-modal-bg" id="new-conv-modal-bg">
    <div class="new-conv-modal">
        <h3>New Conversation</h3>
        <input type="text" id="new-conv-name" placeholder="Conversation name (required)" autofocus>
        <div class="modal-actions">
            <button class="btn-cancel" id="btn-modal-cancel">Cancel</button>
            <button class="btn-create" id="btn-modal-create">Create</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chat_history.js') }}"></script>
{% endblock %}
