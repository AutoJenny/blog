<!-- Recipe Sections Management - Editable sections with descriptions -->
<div class="recipe-sections-management" id="recipe-sections-management">
    <div class="sections-header">
        <h3>Recipe Sections</h3>
        <p class="sections-intro">Manage your recipe sections. Each section has a heading and description that guides content generation.</p>
    </div>
    
    <div class="sections-list-editable" id="sections-list-editable">
        <!-- Sections will be loaded dynamically -->
    </div>
</div>

<style>
.recipe-sections-management {
    padding: 1.5rem;
    background: #1f2937;
    border-radius: 8px;
    margin-bottom: 2rem;
}

.sections-header h3 {
    color: #7dd3fc;
    margin-bottom: 0.5rem;
    font-size: 1.25rem;
}

.sections-intro {
    color: #9ca3af;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
}

.sections-list-editable {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.section-editable-item {
    background: #111827;
    border: 2px solid #374151;
    border-radius: 8px;
    padding: 1.25rem;
    transition: border-color 0.2s;
}

.section-editable-item:hover {
    border-color: #4b5563;
}

.section-editable-item.editing {
    border-color: #7dd3fc;
}

.section-header-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

.section-number-badge {
    background: #7dd3fc;
    color: #0f172a;
    font-weight: bold;
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.875rem;
    min-width: 2.5rem;
    text-align: center;
}

.section-type-badge {
    background: #374151;
    color: #9ca3af;
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
    text-transform: uppercase;
    font-family: monospace;
}

.section-editable-fields {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.field-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.field-label {
    color: #7dd3fc;
    font-size: 0.875rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.field-label .required {
    color: #ef4444;
}

.field-input {
    background: #1f2937;
    color: #e5e7eb;
    border: 2px solid #374151;
    border-radius: 6px;
    padding: 0.75rem;
    font-family: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s;
}

.field-input:focus {
    outline: none;
    border-color: #7dd3fc;
}

.field-input.description-field {
    min-height: 100px;
    resize: vertical;
}

.section-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid #374151;
}

.btn-save-section {
    background: #7dd3fc;
    color: #0f172a;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-save-section:hover:not(:disabled) {
    background: #56b8d3;
}

.btn-save-section:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.save-indicator {
    color: #10b981;
    font-size: 0.875rem;
    display: none;
}

.save-indicator.show {
    display: inline-block;
}

.loading {
    opacity: 0.6;
    pointer-events: none;
}
</style>

<script>
class RecipeSectionsManager {
    constructor(postId) {
        this.postId = postId;
        this.sections = [];
        this.editingSections = new Set();
        this.init();
    }
    
    async init() {
        await this.loadSections();
        this.render();
    }
    
    async loadSections() {
        try {
            const response = await fetch(`/authoring/api/posts/${this.postId}/sections`);
            const data = await response.json();
            
            if (data.success && data.sections) {
                this.sections = data.sections.sort((a, b) => 
                    (a.section_order || a.order || 0) - (b.section_order || b.order || 0)
                );
            }
        } catch (error) {
            console.error('Error loading sections:', error);
        }
    }
    
    render() {
        const container = document.getElementById('sections-list-editable');
        if (!container) return;
        
        container.innerHTML = '';
        
        this.sections.forEach((section, index) => {
            const sectionEl = this.createSectionElement(section, index);
            container.appendChild(sectionEl);
        });
    }
    
    createSectionElement(section, index) {
        const div = document.createElement('div');
        div.className = 'section-editable-item';
        div.dataset.sectionId = section.id;
        
        const sectionType = section.section_type || '';
        const sectionTypeDisplay = sectionType.replace('recipe_', '').replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        const heading = section.section_heading || section.title || 'Untitled Section';
        const description = section.section_description || section.description || '';
        
        div.innerHTML = `
            <div class="section-header-row">
                <span class="section-number-badge">${section.section_order || section.order || index + 1}</span>
                ${sectionType ? `<span class="section-type-badge">${sectionTypeDisplay}</span>` : ''}
            </div>
            
            <div class="section-editable-fields">
                <div class="field-group">
                    <label class="field-label">
                        Section Heading
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        class="field-input section-heading-input" 
                        data-section-id="${section.id}"
                        value="${this.escapeHtml(heading)}"
                        placeholder="Enter section heading"
                    >
                </div>
                
                <div class="field-group">
                    <label class="field-label">
                        Section Description
                        <span class="required">*</span>
                    </label>
                    <textarea 
                        class="field-input description-field section-description-input" 
                        data-section-id="${section.id}"
                        placeholder="Describe what content should be generated for this section"
                    >${this.escapeHtml(description)}</textarea>
                </div>
            </div>
            
            <div class="section-actions">
                <span class="save-indicator" data-section-id="${section.id}">✓ Saved</span>
                <button 
                    class="btn-save-section" 
                    data-section-id="${section.id}"
                    onclick="recipeSectionsManager.saveSection(${section.id})"
                >
                    Save Changes
                </button>
            </div>
        `;
        
        // Add auto-save on blur
        const headingInput = div.querySelector('.section-heading-input');
        const descInput = div.querySelector('.section-description-input');
        
        headingInput.addEventListener('blur', () => {
            this.saveSection(section.id);
        });
        
        descInput.addEventListener('blur', () => {
            this.saveSection(section.id);
        });
        
        return div;
    }
    
    async saveSection(sectionId) {
        const sectionEl = document.querySelector(`[data-section-id="${sectionId}"]`);
        if (!sectionEl) return;
        
        const headingInput = sectionEl.querySelector('.section-heading-input');
        const descInput = sectionEl.querySelector('.section-description-input');
        const saveBtn = sectionEl.querySelector('.btn-save-section');
        const saveIndicator = sectionEl.querySelector('.save-indicator');
        
        const heading = headingInput.value.trim();
        const description = descInput.value.trim();
        
        if (!heading || !description) {
            alert('Both heading and description are required');
            return;
        }
        
        // Disable inputs and show loading
        headingInput.disabled = true;
        descInput.disabled = true;
        saveBtn.disabled = true;
        sectionEl.classList.add('loading');
        
        try {
            const response = await fetch(`/authoring/api/posts/${this.postId}/sections/${sectionId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    section_heading: heading,
                    section_description: description
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Show save indicator
                saveIndicator.classList.add('show');
                setTimeout(() => {
                    saveIndicator.classList.remove('show');
                }, 2000);
                
                // Update local data
                const section = this.sections.find(s => s.id === sectionId);
                if (section) {
                    section.section_heading = heading;
                    section.section_description = description;
                }
            } else {
                alert('Error saving section: ' + (data.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error saving section:', error);
            alert('Error saving section. Please try again.');
        } finally {
            // Re-enable inputs
            headingInput.disabled = false;
            descInput.disabled = false;
            saveBtn.disabled = false;
            sectionEl.classList.remove('loading');
        }
    }
    
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
}

// Initialize when DOM is ready
let recipeSectionsManager;
document.addEventListener('DOMContentLoaded', function() {
    if (window.postId && window.postType === 'recipe') {
        recipeSectionsManager = new RecipeSectionsManager(window.postId);
    }
});
</script>
