<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - BlogForge</title>
    <link href="/static/css/dist/main.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .header-gradient {
            background: linear-gradient(90deg, #181c2a 0%, #23273a 100%);
        }
    </style>
</head>

<body class="min-h-screen bg-dark-bg text-dark-text flex flex-col">
    {% include 'shared/header.html' %}

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto mt-8 bg-dark-bg border border-dark-border rounded-xl shadow-lg p-8">
            <h1 class="text-2xl font-bold text-white mb-2 flex items-center gap-2">
                <i class="fa-solid fa-gear text-indigo-400"></i> Settings
            </h1>
            <p class="text-dark-text mb-8">
                System settings and configuration.
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Taxonomy -->
                <a href="/settings/taxonomy"
                    class="bg-[#23273a] rounded-lg border border-dark-border p-6 hover:bg-[#2a2f45] transition group">
                    <div class="flex items-center gap-3 mb-3">
                        <i class="fa-solid fa-tags text-2xl text-indigo-400 group-hover:text-indigo-300"></i>
                        <h2 class="text-lg font-semibold text-white">Taxonomy</h2>
                    </div>
                    <p class="text-dark-text text-sm">
                        View taxonomy tiers, categories, content types, and formats.
                    </p>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-indigo-950 border-t border-dark-border py-6 mt-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-dark-text">
                &copy; 2025 BlogForge. All rights reserved.
            </p>
        </div>
    </footer>
</body>
</html>
