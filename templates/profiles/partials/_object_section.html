<section class="blog-section profile-section profile-section--object">
    <h2>{{ section.section_heading or 'The Object' }}</h2>
    
    <div class="section-content">
        {% if section.polished %}
            {{ section.polished|safe }}
        {% elif section.draft %}
            {{ section.draft|safe }}
        {% endif %}
    </div>
    
    {% if section.image and section.image.path %}
    <figure class="section-image">
        <img src="{{ section.image.path }}" 
             alt="{{ section.image.alt_text or 'Product image' }}"
             {% if section.image.width %}width="{{ section.image.width }}"{% endif %}
             {% if section.image.height %}height="{{ section.image.height }}"{% endif %}>
        {% if section.image_captions %}
        <figcaption>{{ section.image_captions }}</figcaption>
        {% endif %}
    </figure>
    {% endif %}
</section>
