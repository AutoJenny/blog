<!-- Imaging Model Selection Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/imaging/model-selection.css') }}">
<script src="{{ url_for('static', filename='js/imaging/model-selection.js') }}"></script>
<div class="model-selection-panel" id="model-selection-panel">
    <div class="panel-header" onclick="toggleModelSelectionAccordion()">
        <h4 id="model-title"><span class="panel-name-green">Modal Selection:</span> Loading...</h4>
        <div class="header-actions">
            <i class="fas fa-chevron-up" id="model-accordion-icon"></i>
        </div>
    </div>
    
    <div class="panel-content" id="model-accordion-content">
        <!-- Model Selection -->
        <div class="image-model-selection" id="image-model-selection">
            <label for="image-model-select">Image Generation Model:</label>
            <select id="image-model-select" name="image_model">
                <option value="sdxl-lora">SDXL LoRA (Local)</option>
                <option value="dall-e-3">DALL-E 3 (OpenAI)</option>
                <option value="gpt-image-1">GPT-Image-1 (OpenAI)</option>
                <option value="dall-e-2">DALL-E 2 (OpenAI)</option>
            </select>
        </div>

        <!-- Model Parameters -->
        <div class="model-parameters" id="parameters-container">
            <!-- SDXL + LoRA Parameters -->
            <div class="parameter-group" id="sdxl-basic-params">
                <h5>Basic Settings</h5>
                <div class="param-row">
                    <label for="width">Width:</label>
                    <input type="number" id="width" name="width" value="1792" min="512" max="2048" step="64">
                </div>
                <div class="param-row">
                    <label for="height">Height:</label>
                    <input type="number" id="height" name="height" value="1024" min="512" max="2048" step="64">
                </div>
                <div class="param-row">
                    <label for="steps">Steps:</label>
                    <input type="range" id="steps" name="steps" value="30" min="10" max="50" step="1">
                    <span class="param-value" id="steps-value">30</span>
                </div>
                <div class="param-row">
                    <label for="cfg">CFG Scale:</label>
                    <input type="range" id="cfg" name="cfg" value="5.5" min="1.0" max="20.0" step="0.1">
                    <span class="param-value" id="cfg-value">5.5</span>
                </div>
                <div class="param-row">
                    <label for="seed">Seed:</label>
                    <input type="number" id="seed" name="seed" placeholder="Random" min="0" max="999999999">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="generateRandomSeed()">Random</button>
                </div>
            </div>

            <!-- LoRA Controls -->
            <div class="parameter-group" id="lora-controls">
                <h5>LoRA Settings</h5>
                
                <!-- Active LoRAs List -->
                <div class="active-loras" id="active-loras">
                    <div class="lora-item" data-lora-id="aether-watercolor">
                        <div class="lora-info">
                            <span class="lora-name">Aether Watercolor & Ink</span>
                            <span class="lora-status">Active</span>
                        </div>
                        <div class="lora-controls">
                            <div class="lora-scale-control">
                                <label for="lora-scale-aether">Scale:</label>
                                <input type="range" id="lora-scale-aether" name="lora_scale" 
                                       value="0.85" min="0.0" max="1.0" step="0.05">
                                <span class="param-value" id="lora-scale-value">0.85</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DALL-E Parameters (hidden by default) -->
            <div class="parameter-group" id="dalle-params" style="display: none;">
                <h5>DALL-E Settings</h5>
                <div class="param-row">
                    <label for="dalle-size">Size:</label>
                    <select id="dalle-size" name="size">
                        <option value="1792x1024">1792x1024</option>
                        <option value="1024x1792">1024x1792</option>
                        <option value="1024x1024">1024x1024</option>
                    </select>
                </div>
                <div class="param-row">
                    <label for="dalle-quality">Quality:</label>
                    <select id="dalle-quality" name="quality">
                        <option value="standard">Standard</option>
                        <option value="hd">HD</option>
                    </select>
                </div>
                <div class="param-row">
                    <label for="dalle-style">Style:</label>
                    <select id="dalle-style" name="style">
                        <option value="natural">Natural</option>
                        <option value="vivid">Vivid</option>
                    </select>
                </div>
            </div>

            <!-- GPT-Image-1 Parameters (hidden by default) -->
            <div class="parameter-group" id="gpt-image-1-params" style="display: none;">
                <h5>GPT-Image-1 Settings</h5>
                <div class="param-row">
                    <label for="gpt-image-size">Size:</label>
                    <select id="gpt-image-size" name="size">
                        <option value="1024x1024">1024x1024 (Square)</option>
                        <option value="1792x1024">1792x1024 (Landscape)</option>
                        <option value="1024x1792">1024x1792 (Portrait)</option>
                        <option value="512x512">512x512 (Small)</option>
                        <option value="256x256">256x256 (Thumbnail)</option>
                    </select>
                </div>
                <div class="param-row">
                    <label for="gpt-image-quality">Quality:</label>
                    <select id="gpt-image-quality" name="quality">
                        <option value="standard">Standard</option>
                        <option value="hd">HD</option>
                    </select>
                </div>
                <div class="param-row">
                    <label for="gpt-image-style">Style:</label>
                    <select id="gpt-image-style" name="style">
                        <option value="natural">Natural (Photorealistic)</option>
                        <option value="vivid">Vivid (Artistic)</option>
                    </select>
                </div>
                <div class="param-row">
                    <label for="gpt-image-n">Number of Images:</label>
                    <input type="number" id="gpt-image-n" name="n" min="1" max="10" value="1">
                </div>
                <div class="param-row">
                    <label for="gpt-image-seed">Seed (Optional):</label>
                    <input type="number" id="gpt-image-seed" name="seed" placeholder="Leave empty for random">
                </div>
                <div class="param-row">
                    <label for="gpt-image-background">Background:</label>
                    <select id="gpt-image-background" name="background">
                        <option value="">Default</option>
                        <option value="transparent">Transparent</option>
                        <option value="white">White</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Action Buttons - Generate button moved to header -->
    </div>
</div>
