<!-- Prompt Construction Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/imaging/prompt-construction.css') }}">
<script src="{{ url_for('static', filename='js/imaging/prompt-construction.js') }}"></script>

<div class="prompt-construction-panel">
    <div class="panel-header" onclick="togglePromptConstructionAccordion()">
        <h4 id="prompt-title"><span class="panel-name-green">Generated Image Prompts</span></h4>
        <div class="panel-actions" style="display:flex; align-items:center; gap:.5rem;">
            <button type="button" id="regenerate-prompt-btn" title="Regenerate prompt for selected section" style="display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .6rem; font-size:.85rem; border-radius:6px; background:#334155; color:#e2e8f0; border:1px solid #475569; cursor:pointer;">
                <i class="fas fa-sync-alt"></i>
                Regenerate
            </button>
            <i class="fas fa-chevron-down" id="prompt-accordion-icon"></i>
        </div>
    </div>
    
    <div class="panel-content" id="prompt-accordion-content" style="display: none;">
        <!-- Generated Prompts Display -->
        <div id="generated-prompts-container">
            <div class="no-selection-message">
                <p>Select a section from the left panel to view its generated image prompt.</p>
            </div>
        </div>
        
        <!-- Multiple Selection Display -->
        <div id="multiple-prompts-container" style="display: none;">
            <div class="multiple-selection-header">
                <h5>Multiple Sections Selected</h5>
                <p>Image prompts for selected sections:</p>
            </div>
            <div id="multiple-prompts-list">
                <!-- Multiple prompts will be displayed here -->
            </div>
        </div>
    </div>
</div>

<script>
// Generated Image Prompts Panel - Display functionality
document.addEventListener('DOMContentLoaded', function() {
    console.log('[Generated Prompts] Initializing panel...');
    
    // Set up section selection listener
    setupSectionSelectionListener();
    
    // Initialize with any pre-selected sections
    initializePanel();

    // Bind regenerate button (no UI changes elsewhere)
    const regenBtn = document.getElementById('regenerate-prompt-btn');
    if (regenBtn) {
        regenBtn.addEventListener('click', async function(e) {
            e.stopPropagation();
            await regenerateCurrentSectionPrompt();
        });
    }

    // Persist selection on global sectionSelected events (in case selection is made by other modules)
    document.addEventListener('sectionSelected', function(event) {
        try {
            const sectionId = event?.detail?.sectionId;
            if (!sectionId) return;
            const postId = window.postId || 60;
            localStorage.setItem(`imaging_selected_section_${postId}`, String(sectionId));
        } catch (_) { /* ignore */ }
    });
});

// Clear any invalid cached data on page load
document.addEventListener('DOMContentLoaded', function() {
    // Accept numeric section IDs; do not clear cached numeric IDs
    // Keep any cached selection to restore user context
});

function setupSectionSelectionListener() {
    console.log('[Generated Prompts] Setting up section selection listener');
    
    // Listen for section selection changes
    document.addEventListener('sectionSelected', async function(event) {
        const sectionId = event.detail.sectionId;
        console.log('[Generated Prompts] sectionSelected event received:', sectionId);
        
        await displayPromptForSection(sectionId);
    });
    
    // Listen for multiple section selection
    document.addEventListener('sectionsSelected', async function(event) {
        const sectionIds = event.detail.sectionIds;
        console.log('[Generated Prompts] sectionsSelected event received:', sectionIds);
        
        await displayPromptsForMultipleSections(sectionIds);
    });
    
    // Also listen for clicks on section items
    document.addEventListener('click', async function(event) {
        const sectionItem = event.target.closest('.section-item[data-section-id]');
        if (sectionItem) {
            const sectionId = sectionItem.getAttribute('data-section-id');
            console.log('[Generated Prompts] Section clicked:', sectionId);
            try {
                const postId = window.postId || 60;
                localStorage.setItem(`imaging_selected_section_${postId}`, String(sectionId));
            } catch (e) { /* ignore */ }
            
            await displayPromptForSection(sectionId);
            // Inform other modules (e.g., image-generation-handler)
            try {
                const evt = new CustomEvent('sectionSelected', { detail: { sectionId } });
                document.dispatchEvent(evt);
            } catch (e) { /* ignore */ }
        }
    });
    
    console.log('[Generated Prompts] Section selection listener set up complete');
}

async function initializePanel() {
    // Check if there are any pre-selected sections
    const selectedSections = document.querySelectorAll('.section-item.selected[data-section-id]');
    if (selectedSections.length > 0) {
        if (selectedSections.length === 1) {
            const sectionId = selectedSections[0].getAttribute('data-section-id');
            await displayPromptForSection(sectionId);
        } else {
            const sectionIds = Array.from(selectedSections).map(s => s.getAttribute('data-section-id'));
            await displayPromptsForMultipleSections(sectionIds);
        }
    }

    // If none selected, try to restore last selection from storage
    try {
        const postId = window.postId || 60;
        const stored = localStorage.getItem(`imaging_selected_section_${postId}`);
        if (stored) {
            // Check if the stored section ID exists (numeric IDs like "803" are valid)
            const el = document.querySelector(`.section-item[data-section-id="${stored}"]`);
            if (el) {
                el.click(); // triggers the normal selection flow and events
            } else {
                // If cached selection is invalid, clear it; we'll auto-select first section below
                localStorage.removeItem(`imaging_selected_section_${postId}`);
            }
        }
    } catch (e) { /* ignore */ }

    // If still no selection, auto-select the first section to populate panels
    const stillNoneSelected = !document.querySelector('.section-item.selected[data-section-id]');
    if (stillNoneSelected) {
        const first = document.querySelector('.section-item[data-section-id]');
        if (first) {
            first.click();
        }
    }
}

async function displayPromptForSection(sectionId, { forceReload = false } = {}) {
    if (!sectionId) return;
    
    try {
        console.log('[Generated Prompts] Displaying prompt for section:', sectionId);
        
        // Fetch section data (force API reload if requested)
        const sectionData = await fetchSectionData(sectionId, { forceReload });
        if (!sectionData) {
            console.error('[Generated Prompts] Section data not found for ID:', sectionId);
            showNoPromptMessage(sectionId);
            return;
        }
        
        console.log('[Generated Prompts] Section data:', sectionData);
        
        // Hide multiple selection container
        document.getElementById('multiple-prompts-container').style.display = 'none';
        
        // Display the prompt
        displaySinglePrompt(sectionData);
        
    } catch (error) {
        console.error('[Generated Prompts] Error displaying prompt for section:', error);
        showErrorMessage(sectionId, error.message);
    }
}

async function displayPromptsForMultipleSections(sectionIds) {
    if (!sectionIds || sectionIds.length === 0) return;
    
    try {
        console.log('[Generated Prompts] Displaying prompts for multiple sections:', sectionIds);
        
        // Show multiple selection container
        document.getElementById('multiple-prompts-container').style.display = 'block';
        
        // Clear previous content
        const multiplePromptsList = document.getElementById('multiple-prompts-list');
        multiplePromptsList.innerHTML = '';
        
        // Fetch and display prompts for each section
        for (const sectionId of sectionIds) {
            const sectionData = await fetchSectionData(sectionId);
            if (sectionData) {
                const promptElement = createPromptElement(sectionData);
                multiplePromptsList.appendChild(promptElement);
            }
        }
        
    } catch (error) {
        console.error('[Generated Prompts] Error displaying multiple prompts:', error);
    }
}

async function fetchSectionData(sectionId, { forceReload = false } = {}) {
    // Handle "hero" as a special case - it's not a real section
    if (sectionId === 'hero' || String(sectionId) === 'hero') {
        console.log('[Generated Prompts] Hero image selected - fetching prompt from recipe_image_style section');
        try {
            const postId = window.postId || 60;
            const resp = await fetch(`/authoring/api/posts/${postId}/sections`);
            if (!resp.ok) return null;
            
            const data = await resp.json();
            const sections = data.sections || data;
            if (!Array.isArray(sections)) return null;
            
            const styleSection = sections.find(s => s.section_type === 'recipe_image_style');
            if (!styleSection || !styleSection.post_section_elements) return null;
            
            let elements = styleSection.post_section_elements;
            if (typeof elements === 'string') {
                elements = JSON.parse(elements);
            }
            
            if (elements && elements.hero_image_prompt) {
                const heroPrompt = elements.hero_image_prompt;
                const promptText = typeof heroPrompt === 'string' 
                    ? heroPrompt 
                    : (heroPrompt.description || heroPrompt.image_prompt || heroPrompt.prompt);
                
                if (promptText) {
                    return {
                        id: 'hero',
                        section_heading: 'Hero Image',
                        image_prompts: { image_prompt: promptText },
                        section_type: 'hero'
                    };
                }
            }
        } catch (e) {
            console.error('[Generated Prompts] Error fetching hero prompt:', e);
        }
        return null;
    }
    
    // Prefer fresh imaging API data unless cache has image_prompts for this section
    if (!forceReload && window.sectionsData && window.sectionsData.length > 0) {
        const cached = window.sectionsData.find(s => s.id == sectionId);
        if (cached) {
            const hasPrompts = !!(cached.image_prompts && (
                (typeof cached.image_prompts === 'string' && cached.image_prompts.trim().length > 0) ||
                (typeof cached.image_prompts === 'object' && (cached.image_prompts.image_prompt || cached.image_prompts.base_concept))
            ));
            if (hasPrompts) {
                console.log('[Generated Prompts] Using cached section with image_prompts');
                return cached;
            } else {
                console.log('[Generated Prompts] Cached section lacks image_prompts; fetching fresh from imaging API');
            }
        } else {
            console.log('[Generated Prompts] Section not found in cached data; fetching fresh from imaging API');
        }
    }
    
    // If not found, fetch directly from API
    const postId = window.postId || 60;
    console.log('[Generated Prompts] Fetching from API for postId:', postId);
    const response = await fetch(`/imaging/api/posts/${postId}/sections`);
    const data = await response.json();
    
    if (data.success && data.sections) {
        const sectionData = data.sections.find(s => s.id == sectionId);
        console.log('[Generated Prompts] Found section via API:', sectionData);
        return sectionData;
    }
    
    return null;
}

function displaySinglePrompt(sectionData) {
    const container = document.getElementById('generated-prompts-container');
    
    if (sectionData.image_prompts) {
        let promptData = sectionData.image_prompts;
        
        // Handle both JSON object and plain text
        if (typeof promptData === 'string') {
            try {
                promptData = JSON.parse(promptData);
            } catch (e) {
                // If not valid JSON, treat as plain text
                promptData = { image_prompt: promptData.trim() };
            }
        }
        
        // Extract the actual prompt
        const promptText = promptData.image_prompt || promptData;
        
        if (promptText && typeof promptText === 'string' && 
            !promptText.includes("I'm ready to assist") && 
            !promptText.includes("Please provide")) {
            const promptElement = createPromptElement(sectionData, promptData);
            container.innerHTML = '';
            container.appendChild(promptElement);
        } else {
            showNoPromptMessage(sectionData.id, 'No valid prompt generated yet');
        }
    } else {
        showNoPromptMessage(sectionData.id, 'No image prompt generated');
    }
}

function createPromptElement(sectionData, promptData = null) {
    const element = document.createElement('div');
    element.className = 'prompt-display-item';
    element.setAttribute('data-section-id', sectionData.id);
    
    // Parse prompt data if not provided
    if (!promptData && sectionData.image_prompts) {
        if (typeof sectionData.image_prompts === 'object') {
            promptData = sectionData.image_prompts;
        } else {
            try {
                promptData = JSON.parse(sectionData.image_prompts);
            } catch (e) {
                promptData = { image_prompt: sectionData.image_prompts };
            }
        }
    }
    
    const imagePrompt = promptData?.image_prompt || promptData;
    
    if (imagePrompt && typeof imagePrompt === 'string') {
        element.innerHTML = `
            <div class="prompt-header">
                <h6 class="section-title">${sectionData.section_heading || `Section ${sectionData.id}`}</h6>
                <div class="prompt-meta">
                    <span class="prompt-length">${imagePrompt.length} characters</span>
                    ${promptData.dimensions ? `<span class="prompt-dimensions">${promptData.dimensions}</span>` : ''}
                </div>
            </div>
            <div class="prompt-content">
                <div class="prompt-text">${imagePrompt}</div>
            </div>
            ${promptData.style ? `<div class="prompt-style"><strong>Style:</strong> ${promptData.style}</div>` : ''}
            ${promptData.base_concept && promptData.base_concept !== imagePrompt ? 
                `<div class="prompt-base"><strong>Base Concept:</strong> ${promptData.base_concept}</div>` : ''}
        `;
    } else {
        element.innerHTML = `
            <div class="prompt-header">
                <h6 class="section-title">${sectionData.section_heading || `Section ${sectionData.id}`}</h6>
            </div>
            <div class="prompt-content">
                <div class="no-prompt-message">
                    <p>No image prompt generated for this section.</p>
                    <p class="hint">Generate prompts in the Authoring → Image Prompts stage first.</p>
                </div>
            </div>
        `;
    }
    
    return element;
}

function showNoPromptMessage(sectionId, message = 'No image prompt available') {
    const container = document.getElementById('generated-prompts-container');
    container.innerHTML = `
        <div class="no-prompt-message">
            <h6>Section ${sectionId}</h6>
            <p>${message}</p>
            <p class="hint">Generate prompts in the Authoring → Image Prompts stage first.</p>
        </div>
    `;
}

function showErrorMessage(sectionId, errorMessage) {
    const container = document.getElementById('generated-prompts-container');
    container.innerHTML = `
        <div class="error-message">
            <h6>Section ${sectionId}</h6>
            <p>Error loading prompt: ${errorMessage}</p>
        </div>
    `;
}

// Regenerate prompt for the currently selected section using existing authoring endpoint
async function regenerateCurrentSectionPrompt() {
    try {
        // Resolve current section id
        const selected = document.querySelector('.section-item.selected[data-section-id]');
        const currentEl = document.querySelector('.prompt-display-item[data-section-id]');
        const sectionId = selected?.getAttribute('data-section-id') || currentEl?.getAttribute('data-section-id');
        const postId = window.postId || 60;
        if (!sectionId) {
            alert('Select a section first.');
            return;
        }

        // UI feedback: disable button and show spinner
        const regenBtn = document.getElementById('regenerate-prompt-btn');
        const prevLabel = regenBtn ? regenBtn.innerHTML : '';
        if (regenBtn) {
            regenBtn.disabled = true;
            regenBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Regenerating...';
        }

        // Ensure current model selection is persisted for this post (so backend uses correct cap)
        try {
            if (window.modelSelectionPanel && typeof window.modelSelectionPanel.saveConfiguration === 'function') {
                await window.modelSelectionPanel.saveConfiguration();
            }
        } catch (_) { /* non-fatal */ }

        // Use currently displayed prompt text as a seed and request a variation
        const existingText = document.querySelector('.prompt-text')?.textContent?.trim() || '';
        const compiledPrompt = [
            'Regenerate a high-quality image prompt as JSON {"image_prompt":"..."} only. Maintain style guidelines and constraints. Produce a different, equally strong variation. If a character limit applies, target near the cap without exceeding it.',
            existingText ? `Previous prompt for context (do not repeat verbatim): ${existingText}` : ''
        ].filter(Boolean).join('\n\n');

        // Fallback LLM settings (authoring endpoint requires them)
        const settings = {
            provider: 'Ollama',
            model: 'llama3.2:latest',
            temperature: 0.7,
            maxTokens: 2000
        };

        // Call the existing authoring API to regenerate and persist
        const resp = await fetch('/authoring/api/generate-image-prompt-from-builder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                compiled_prompt: compiledPrompt,
                llm_provider: settings.provider,
                llm_model: settings.model,
                temperature: settings.temperature,
                max_tokens: settings.maxTokens,
                post_id: postId,
                section_id: Number(sectionId)
            })
        });

        if (!resp.ok) {
            throw new Error('HTTP ' + resp.status);
        }
        const data = await resp.json();
        if (!data.success) {
            throw new Error(data.error || 'Unknown error');
        }

        // Reload prompt from DB for this section to reflect the new value (bypass cache)
        await displayPromptForSection(sectionId, { forceReload: true });

        // Toast feedback
        try {
            const note = document.createElement('div');
            note.style.cssText = 'position:fixed;top:16px;right:16px;background:#10b981;color:#fff;padding:10px 14px;border-radius:6px;z-index:10000;font-size:.9rem;box-shadow:0 4px 10px rgba(0,0,0,.2)';
            note.textContent = 'Prompt regenerated successfully';
            document.body.appendChild(note);
            setTimeout(() => { if (note.parentNode) note.parentNode.removeChild(note); }, 2000);
        } catch (_) { /* ignore */ }

    } catch (err) {
        console.error('[Generated Prompts] Regenerate failed:', err);
        alert('Failed to regenerate: ' + (err?.message || err));
    } finally {
        // Restore button state
        const regenBtn = document.getElementById('regenerate-prompt-btn');
        if (regenBtn) {
            regenBtn.disabled = false;
            regenBtn.innerHTML = prevLabel || 'Regenerate';
        }
    }
}
</script>
