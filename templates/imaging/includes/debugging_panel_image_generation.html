<!-- Debugging Panel - Image Generation specific; self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/imaging/debugging-panel.css') }}">
<script src="{{ url_for('static', filename='js/imaging/debugging-panel.js') }}"></script>
<div class="debugging-panel">
    <div class="accordion-header" onclick="toggleDebuggingAccordion()">
        <h5><span class="panel-name-green">Debugging</span></h5>
        <div class="accordion-toggle">
            <i class="fas fa-chevron-down" id="debugging-accordion-icon"></i>
        </div>
    </div>
    
    <div class="accordion-content" id="debugging-accordion-content" style="display: none;">
        {% include 'imaging/includes/input_details_accordion.html' %}
        
        <!-- Image Generation Results Panel -->
        <div class="image-generation-results-panel">
            <div class="results-header">
                <h4 id="results-title">Image Generation Results</h4>
            </div>
            
            <!-- Image Generation Debug Display -->
            <div class="image-generation-debug-section" style="margin-bottom: 1rem;">
                <div class="debug-header accordion-header" onclick="toggleDebugAccordion()">
                    <h5 style="color: #f1f5f9; margin-bottom: 0.5rem;">🔍 Image Generation Debug</h5>
                    <div class="accordion-toggle">
                        <i class="fas fa-chevron-down" id="debug-accordion-icon"></i>
                    </div>
                </div>
                <div class="accordion-content" id="debug-accordion-content" style="display: none;">
                    <div id="image-generation-debug" class="image-generation-debug" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; color: #cbd5e1; max-height: 300px; overflow-y: auto; white-space: pre-wrap;">
                        <!-- Image generation debug info will appear here -->
                    </div>
                </div>
            </div>
            
            <!-- Generated Image Display -->
            <div class="generated-image-section" style="margin-bottom: 1rem;">
                <h5 style="color: #f1f5f9; margin-bottom: 0.5rem;">Generated Image</h5>
                <div id="generated-image-display" class="generated-image-display" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; text-align: center;">
                    <!-- Generated image will appear here -->
                </div>
            </div>
            
            <!-- Results Display -->
            <div id="image-generation-results-display" class="image-generation-results-display">
                <!-- Generated results will appear here -->
            </div>
        </div>
    </div>
</div>
<script>
// Optional: placeholder for future debugging-panel specific JS
</script>
