<!-- Photo Selection Panel -->
<div class="panel photo-selection-panel" id="photo-selection-panel">
    <div class="panel-header">
        <h3><i class="fas fa-check-circle"></i> Selected Photo</h3>
    </div>
    <div class="panel-content">
        <div id="selected-photo-display" style="display: none;">
            <div class="selected-photo-preview">
                <img id="selected-photo-image" src="" alt="Selected photo" style="width: 100%; border-radius: 8px; margin-bottom: 1rem;">
            </div>
            <div class="selected-photo-info">
                <p><strong>Provider:</strong> <span id="selected-photo-provider"></span></p>
                <p><strong>Photographer:</strong> <a id="selected-photo-photographer-link" href="" target="_blank"><span id="selected-photo-photographer"></span></a></p>
                <p><strong>Credits:</strong> <span id="selected-photo-credits"></span></p>
                <p><strong>Dimensions:</strong> <span id="selected-photo-dimensions"></span></p>
            </div>
            <button id="deselect-photo-btn" class="btn btn-secondary btn-sm">
                <i class="fas fa-times"></i> Deselect
            </button>
        </div>
        <div id="no-selection-message" class="text-muted text-center">
            <p>No photo selected. Select a photo from the search results above.</p>
        </div>
    </div>
</div>
