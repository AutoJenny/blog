<!-- Output Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/imaging/output-panel.css') }}">
<script src="{{ url_for('static', filename='js/imaging/output-panel.js') }}"></script>

<div class="image-results-viewer">
  <div class="viewer-header">
    <h4 id="current-section-title"><span class="panel-name-green">Output:</span> Select a section to view images</h4>
    <div class="header-actions">
      <button type="button" id="generate-image-btn" class="btn btn-primary btn-sm" onclick="window.imageGenerationHandler?.handleGenerateImage();">
        <i class="fas fa-magic"></i> Generate Image
      </button>
    </div>
  </div>

  <!-- Image Display Area -->
  <div id="image-display-area" class="image-display-area">
    <div class="no-selection-message">
      <i class="fas fa-image" style="font-size: 3rem; color: #64748b; margin-bottom: 1rem;"></i>
      <p style="color: #94a3b8; font-size: 1.1rem;">Select a section to view its generated images</p>
    </div>
  </div>

</div>
