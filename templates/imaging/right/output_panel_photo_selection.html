<!-- Photo Selection Output Panel -->
<div class="panel output-panel" id="photo-selection-output-panel">
    <div class="panel-header">
        <h3><i class="fas fa-eye"></i> Photo Preview</h3>
    </div>
    <div class="panel-content">
        <div id="photo-preview-area" class="photo-preview-area">
            <p class="text-muted text-center">Select a photo to see preview and details</p>
        </div>
        
        <div id="photo-selection-actions" class="mt-3" style="display: none;">
            <button id="save-photo-selection-btn" class="btn btn-success">
                <i class="fas fa-save"></i> Save Selection
            </button>
        </div>
    </div>
</div>
