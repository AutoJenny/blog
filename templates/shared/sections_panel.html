<!-- Sections Panel - Self-contained include with CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/authoring/sections-panel.css') }}">
<script src="{{ url_for('static', filename='js/authoring/sections-panel.js') }}"></script>

<!-- Sections Panel - Self-contained include -->
<div class="sections-panel" id="sections-panel">
    <div class="panel-header">
        <h3><span class="panel-name-green">Sanctions:</span></h3>
        <div class="section-controls">
            <button class="btn-secondary" id="select-all-btn">Select All</button>
            <button class="btn-primary" id="batch-generate-btn">Generate All</button>
        </div>
    </div>
    
    <!-- Ollama Status Indicator -->
    <div id="ollama-status-indicator" class="ollama-status-indicator" style="display: none; padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; font-size: 0.875rem;">
        <span id="ollama-status-icon" style="margin-right: 0.5rem;"></span>
        <span id="ollama-status-text"></span>
        <button id="ollama-start-btn" class="btn-secondary" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; display: none;">Start Ollama</button>
    </div>
    
    <div class="section-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="draft">Draft</button>
        <button class="filter-btn" data-filter="complete">Complete</button>
        <button class="filter-btn" data-filter="needs-review">Needs Review</button>
    </div>
    
    <div class="sections-list" id="sections-list">
        <!-- Sections will be loaded dynamically -->
    </div>
</div>
