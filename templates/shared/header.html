<!-- Header (self-contained) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/shared/site-header.css') }}">
<header class="header-gradient shadow-lg border-b border-dark-border py-4">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-nowrap items-center justify-between h-16 space-x-6">
            <div class="flex items-center space-x-8 flex-1 min-w-0">
                <!-- Logo and Title -->
                <a href="/" class="flex items-center gap-3 text-white text-2xl font-bold tracking-tight">
                    <img src="/static/images/site/brand-logo.png" alt="BlogForge Logo" class="w-10 h-10 rounded-full shadow" style="background:#23273a; width: 40px; height: 40px;" />
                    <span class="font-bold text-white">BlogForge</span>
                </a>
            </div>
            <div class="flex items-center space-x-4 ml-8"></div>
            <div class="flex-shrink-0 flex items-center gap-4 ml-4">
                <!-- Alert Notifications -->
                <a href="/planning/posts/0/calendar/week-view" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">Calendar</a>
                <a href="/posts" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">Posts</a>
                <a href="/newsletter" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">Newsletter</a>
                <a href="/launchpad/" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">Launchpad</a>
                <!-- Modules Dropdown moved here -->
                <div class="relative group nav-group" tabindex="0">
                    <button class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition flex items-center gap-1 focus:outline-none" aria-haspopup="true" aria-expanded="false">
                        <i class="fa-solid fa-cubes"></i> Modules <i class="fa fa-caret-down text-xs"></i>
                    </button>
                    <div class="nav-dropdown absolute left-0 mt-2 min-w-[180px] rounded-lg shadow-lg z-50 hidden">
                        <a href="/db/" class="block px-4 py-2 text-sm flex items-center gap-2 hover:bg-dark-bg transition">
                            <i class="fa-solid fa-database text-purple-400"></i> Database
                        </a>
                        <a href="/llm/" class="block px-4 py-2 text-sm flex items-center gap-2 hover:bg-dark-bg transition">
                            <i class="fa-solid fa-brain text-pink-400"></i> AI
                        </a>
                        <a href="/llm/images" class="block px-4 py-2 text-sm flex items-center gap-2 hover:bg-dark-bg transition">
                            <i class="fa-solid fa-image text-dark-accent"></i> Images
                        </a>
                        <a href="/servers/" class="block px-4 py-2 text-sm flex items-center gap-2 hover:bg-dark-bg transition">
                            <i class="fa-solid fa-server text-green-400"></i> Servers
                        </a>
                        <a href="http://localhost:5000/" class="block px-4 py-2 text-sm flex items-center gap-2 hover:bg-dark-bg transition">
                            <i class="fa-solid fa-rocket text-orange-400"></i> Launchpad
                        </a>
                    </div>
                </div>
                <a href="/docs/" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Docs
                </a>
                <a href="/settings" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Settings
                </a>
                <div class="relative" id="alert-container">
                    <button class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition flex items-center gap-2 relative" id="alert-bell" onclick="toggleAlertDropdown()">
                        <i class="fas fa-bell"></i>
                        <span class="alert-badge" id="alert-badge" style="display: none;">0</span>
                    </button>
                    <div class="alert-dropdown absolute right-0 mt-2 w-80 rounded-lg shadow-lg z-50 hidden" id="alert-dropdown">
                        <div class="alert-header">
                            <h3>Automation Alerts</h3>
                            <button class="mark-all-read-btn" onclick="markAllAlertsRead()">
                                <i class="fas fa-check-double"></i> Mark All Read
                            </button>
                        </div>
                        <div class="alert-list" id="alert-list">
                            <!-- Alerts will be populated here -->
                        </div>
                        <div class="alert-footer">
                            <a href="/launchpad/one-click-blog" class="view-all-alerts">
                                <i class="fas fa-external-link-alt"></i> View All Alerts
                            </a>
                        </div>
                    </div>
                </div>
                <a href="/workflow/" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Workflow
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- Uses static/css/shared/site-header.css -->
<style>
    .header-gradient {
        background: linear-gradient(90deg, #181c2a 0%, #23273a 100%);
    }
    .nav-dropdown {
        background: #23273a;
        border: 1px solid #31364a;
        box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.45);
    }
    .nav-dropdown a {
        color: #e0e0e0;
    }
    .nav-dropdown a:hover {
        background: #23273a;
        color: #a5b4fc;
    }
    
    /* Alert System Styles */
    .alert-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 0.75rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
    }
    
    .alert-dropdown {
        background: #1e293b;
        border: 1px solid #334155;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .alert-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #334155;
    }
    
    .alert-header h3 {
        font-size: 1rem;
        font-weight: 600;
        color: #f1f5f9;
        margin: 0;
    }
    
    .mark-all-read-btn {
        background: transparent;
        border: 1px solid #8b5cf6;
        color: #8b5cf6;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    
    .mark-all-read-btn:hover {
        background: #8b5cf6;
        color: white;
    }
    
    .alert-list {
        max-height: 300px;
        overflow-y: auto;
    }
    
    .alert-item {
        padding: 16px 20px;
        border-bottom: 1px solid #334155;
        cursor: pointer;
        transition: background 0.2s ease;
    }
    
    .alert-item:hover {
        background: #0f172a;
    }
    
    .alert-item:last-child {
        border-bottom: none;
    }
    
    .alert-item.unread {
        background: #1e293b;
        border-left: 3px solid #8b5cf6;
    }
    
    .alert-item.warning {
        border-left: 3px solid #f59e0b;
    }
    
    .alert-item.error {
        border-left: 3px solid #ef4444;
    }
    
    .alert-item.success {
        border-left: 3px solid #10b981;
    }
    
    .alert-item.info {
        border-left: 3px solid #3b82f6;
    }
    
    .alert-content {
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }
    
    .alert-icon {
        font-size: 1.125rem;
        margin-top: 2px;
    }
    
    .alert-icon.warning {
        color: #f59e0b;
    }
    
    .alert-icon.error {
        color: #ef4444;
    }
    
    .alert-icon.success {
        color: #10b981;
    }
    
    .alert-icon.info {
        color: #3b82f6;
    }
    
    .alert-details {
        flex: 1;
    }
    
    .alert-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    
    .alert-message {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 8px;
        line-height: 1.4;
    }
    
    .alert-time {
        font-size: 0.75rem;
        color: #64748b;
    }
    
    .alert-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }
    
    .alert-action-btn {
        background: transparent;
        border: 1px solid #475569;
        color: #94a3b8;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .alert-action-btn:hover {
        background: #334155;
        border-color: #64748b;
        color: #e2e8f0;
    }
    
    .alert-action-btn.primary:hover {
        background: #8b5cf6;
        border-color: #8b5cf6;
        color: white;
    }
    
    .alert-footer {
        padding: 12px 20px;
        border-top: 1px solid #334155;
        text-align: center;
    }
    
    .view-all-alerts {
        color: #8b5cf6;
        text-decoration: none;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: color 0.2s ease;
    }
    
    .view-all-alerts:hover {
        color: #a78bfa;
    }
    
    .no-alerts {
        padding: 40px 20px;
        text-align: center;
        color: #94a3b8;
    }
    
    .no-alerts i {
        font-size: 2rem;
        margin-bottom: 12px;
        color: #64748b;
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
</style>

<script src="{{ url_for('static', filename='js/shared/site-header.js') }}"></script>
</header>
