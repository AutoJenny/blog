                        <div class="alert-header">

                            <button class="mark-all-read-btn" onclick="markAllAlertsRead()">
                                <i class="fas fa-check-double"></i> Mark All Read
                            </button>
                        </div>
                        <div class="alert-list" id="alert-list">
                            <!-- Alerts will be populated here -->
                        </div>
                        <div class="alert-footer">
                            <a href="/launchpad/one-click-blog" class="view-all-alerts">
                                <i class="fas fa-external-link-alt"></i> View All Alerts
                            </a>

                </div>
                
                <a href="/posts" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Posts
                </a>
                <button class="admin-button bg-dark-accent text-white hover:bg-dark-bg border border-dark-accent px-4 py-2 rounded-lg flex items-center gap-2 shadow transition" id="newPostBtn">
                    <i class="fa-solid fa-plus"></i>
                    New Post
                </button>
                <a href="/docs/" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Docs
                </a>
                <a href="/settings" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Settings
                </a>
                <a href="/workflow/" class="text-dark-text hover:text-dark-accent px-3 py-2 rounded-md text-sm font-medium transition">
                    Workflow

            </div>
        </div>
    </nav>
</header>

<script src="{{ url_for('static', filename='js/shared/site-header.js') }}"></script>
<script>
    // Navigation dropdown functionality
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.nav-group').forEach(group => {
            group.addEventListener('focusin', () => {
                group.querySelector('.nav-dropdown').classList.remove('hidden');
            });
            group.addEventListener('focusout', () => {
                setTimeout(() => {
                    group.querySelector('.nav-dropdown').classList.add('hidden');
                }, 100);
            });
        });
        
    // Initialize alert system
    initializeAlertSystem();
    
    // Create global headerMessages object for automation
    window.headerMessages = {
        addMessage: function(messageData) {
            console.log('[Header Messages] Adding message:', messageData);
            
            // Convert automation message to alert format
            const alert = {
                id: Date.now() + Math.random(), // Simple unique ID
                title: messageData.title || 'Automation Alert',
                message: messageData.message,
                alert_type: messageData.type || 'warning',
                severity: messageData.type || 'warning',
                created_at: new Date().toISOString(),
                is_read: false,
                action_text: 'View Details',
                action_url: messageData.action_url || '/launchpad/one-click-blog'
            };
            
            // Add to alerts array
            alerts.unshift(alert); // Add to beginning
            
            // Update UI
            updateAlertBadge();
            if (alertDropdownOpen) {
                renderAlerts();
            }
            
            console.log('[Header Messages] Message added to alerts:', alert);
        },
        
        getUnreadCount: function() {
            return alerts.filter(alert => !alert.is_read).length;
        },
        
        markAllRead: function() {
            markAllAlertsRead();
        }
    };
    
    console.log('[Header Messages] Global headerMessages object created');
    });
    
    // Alert System JavaScript
    let alerts = [];
    let alertDropdownOpen = false;
    
    function initializeAlertSystem() {
        loadAlerts();
        // Poll for new alerts every 30 seconds
        setInterval(loadAlerts, 30000);
    }
    
    async function loadAlerts() {
        try {
            // Mock data for now - will be replaced with real API call
            const mockAlerts = [
                {
                    id: 1,
                    alert_type: "stuck_post",
                    severity: "warning",
                    post_id: 76,
                    title: "Post #76 Stuck at Image Generation",
                    message: "Failed 3 times - needs manual attention",
                    action_url: "/launchpad/one-click-blog?post=76",
                    action_text: "View Post",
                    created_at: "2025-10-10T14:30:00Z",
                    is_read: false
                },
                {
                    id: 2,
                    alert_type: "ready_publish",
                    severity: "info",
                    post_id: 75,
                    title: "Post #75 Ready for Publication",
                    message: "Scheduled for today at 2:00 PM",
                    action_url: "/launchpad/one-click-blog?post=75&action=publish",
                    action_text: "Publish Now",
                    created_at: "2025-10-10T13:00:00Z",
                    is_read: false
                }
            ];
            
            alerts = mockAlerts;
            updateAlertBadge();
            if (alertDropdownOpen) {
                updateAlertDropdown();
            }
        } catch (error) {
            console.error('Error loading alerts:', error);
        }
    }
    
    function updateAlertBadge() {
        const badge = document.getElementById('alert-badge');
        const unreadCount = alerts.filter(alert => !alert.is_read).length;
        
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }
    
    function toggleAlertDropdown() {
        const dropdown = document.getElementById('alert-dropdown');
        alertDropdownOpen = !alertDropdownOpen;
        
        if (alertDropdownOpen) {
            dropdown.classList.remove('hidden');
            updateAlertDropdown();
        } else {
            dropdown.classList.add('hidden');
        }
    }
    
    function updateAlertDropdown() {
        const alertList = document.getElementById('alert-list');
        
        if (alerts.length === 0) {
            alertList.innerHTML = `
                <div class="no-alerts">
                    <i class="fas fa-bell-slash"></i>
                    <p>No alerts</p>
                </div>
            `;
            return;
        }
        
        alertList.innerHTML = alerts.map(alert => createAlertItem(alert)).join('');
    }
    
    function createAlertItem(alert) {
        const timeAgo = formatTimeAgo(new Date(alert.created_at));
        const iconClass = getAlertIconClass(alert.severity);
        const icon = getAlertIcon(alert.alert_type);
        
        return `
            <div class="alert-item ${alert.severity} ${alert.is_read ? '' : 'unread'}" onclick="handleAlertClick(${alert.id})">
                <div class="alert-content">
                    <i class="fas ${icon} alert-icon ${alert.severity}"></i>
                    <div class="alert-details">
                        <div class="alert-title">${alert.title}</div>
                        <div class="alert-message">${alert.message}</div>
                        <div class="alert-time">${timeAgo}</div>
                        <div class="alert-actions">
                            <button class="alert-action-btn primary" onclick="event.stopPropagation(); handleAlertAction(${alert.id}, '${alert.action_url}')">
                                ${alert.action_text}
                            </button>
                            <button class="alert-action-btn" onclick="event.stopPropagation(); dismissAlert(${alert.id})">
                                Dismiss
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    function getAlertIconClass(severity) {
        const classes = {
            warning: 'warning',
            error: 'error',
            success: 'success',
            info: 'info'
        };
        return classes[severity] || 'info';
    }
    
    function getAlertIcon(alertType) {
        const icons = {
            stuck_post: 'fa-exclamation-triangle',
            ready_publish: 'fa-clock',
            missing_schedule: 'fa-calendar-times',
            low_queue: 'fa-chart-line',
            manual_review: 'fa-eye',
            completion: 'fa-check-circle'
        };
        return icons[alertType] || 'fa-info-circle';
    }
    
    function formatTimeAgo(date) {
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        return `${diffDays}d ago`;
    }
    
    function handleAlertClick(alertId) {
        const alert = alerts.find(a => a.id === alertId);
        if (alert) {
            alert.is_read = true;
            updateAlertBadge();
            updateAlertDropdown();
        }
    }
    
    function handleAlertAction(alertId, actionUrl) {
        const alert = alerts.find(a => a.id === alertId);
        if (alert) {
            alert.is_read = true;
            updateAlertBadge();
            updateAlertDropdown();
            
            // Navigate to action URL
            window.location.href = actionUrl;
        }
    }
    
    function dismissAlert(alertId) {
        alerts = alerts.filter(alert => alert.id !== alertId);
        updateAlertBadge();
        updateAlertDropdown();
    }
    
    function markAllAlertsRead() {
        alerts.forEach(alert => alert.is_read = true);
        updateAlertBadge();
        updateAlertDropdown();
    }
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const alertContainer = document.getElementById('alert-container');
        if (!alertContainer.contains(event.target)) {
            const dropdown = document.getElementById('alert-dropdown');
            dropdown.classList.add('hidden');
            alertDropdownOpen = false;
        }
    });
</script>
