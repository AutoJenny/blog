<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ family_name }}: Historical Narrative - BlogForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #0f172a;
            color: #cbd5e1;
            line-height: 1.8;
            padding: 0;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
            background: #1e293b;
            min-height: 100vh;
        }
        
        .header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #334155;
        }
        
        .header h1 {
            color: #f1f5f9;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .header .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .header .meta {
            color: #64748b;
            font-size: 0.875rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #8b5cf6;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border: 1px solid #8b5cf6;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: #8b5cf6;
            color: white;
        }
        
        .narrative-content {
            font-size: 1.125rem;
            line-height: 1.9;
            color: #cbd5e1;
        }
        
        .narrative-content h1 {
            color: #f1f5f9;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        .narrative-content h3 {
            color: #8b5cf6;
            font-size: 1.75rem;
            font-weight: 600;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #334155;
        }
        
        .narrative-content p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        
        .narrative-content blockquote {
            margin: 2rem 3rem;
            padding: 1.5rem 2rem;
            border-left: 4px solid #8b5cf6;
            background: #0f172a;
            font-style: italic;
            color: #cbd5e1;
            line-height: 1.9;
            border-radius: 0 6px 6px 0;
        }
        
        .narrative-content blockquote br {
            display: block;
            margin: 0.5rem 0;
        }
        
        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px solid #334155;
            text-align: center;
            color: #64748b;
            font-size: 0.875rem;
        }
        
        @media print {
            body {
                background: white;
                color: #1e293b;
            }
            
            .container {
                background: white;
                padding: 2rem;
            }
            
            .header {
                border-bottom: 1px solid #ccc;
            }
            
            .back-link {
                display: none;
            }
            
            .narrative-content {
                color: #1e293b;
            }
            
            .narrative-content h3 {
                color: #4c1d95;
                border-bottom: 1px solid #ccc;
            }
            
            .narrative-content blockquote {
                background: #f9fafb;
                border-left: 3px solid #4c1d95;
                color: #374151;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .narrative-content {
                font-size: 1rem;
            }
            
            .narrative-content h3 {
                font-size: 1.5rem;
            }
            
            .narrative-content blockquote {
                margin: 1.5rem 1rem;
                padding: 1rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/families/{{ family_id }}" class="back-link">← Back to Family Details</a>
        
        <div class="header">
            <h1>{{ family_name }}</h1>
            <div class="subtitle">Extended Historical Narrative</div>
            <div class="meta">
                <span>Last updated: {{ last_updated }}</span>
                {% if word_count %}
                <span>Word count: {{ word_count }}</span>
                {% endif %}
            </div>
        </div>
        
        <div class="narrative-content">
            {{ narrative | safe }}
        </div>
        
        <div class="footer">
            <p>Generated from research data • <a href="/families/{{ family_id }}" style="color: #8b5cf6;">View full family details</a></p>
        </div>
    </div>
</body>
</html>
