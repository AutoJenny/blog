{% extends 'base.html' %}

{% block head %}
<style>
    .filter-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        padding: 12px;
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
        background: #0f172a !important;
        color: #e6e8ef !important;
        border: 1px solid #2d3246 !important;
        padding: 8px 12px !important;
        border-radius: 6px !important;
    }
    .filter-bar select option {
        background: #0f172a !important;
        color: #e6e8ef !important;
    }
    .btn-primary {
        background: #4e6bff;
        color: #fff;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-primary:hover {
        background: #3d5ae5;
    }
    .section-card {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .stat-box {
        padding: 16px;
        background: #0f172a;
        border: 1px solid #2d3246;
        border-radius: 6px;
    }
    .stat-label {
        color: #9ca3af;
        font-size: 12px;
        margin-bottom: 4px;
    }
    .stat-value {
        color: #e6e8ef;
        font-size: 24px;
        font-weight: 700;
    }
    .event-card {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        cursor: pointer;
    }
    .event-card:hover {
        border-color: #4e6bff;
    }
    .event-title {
        color: #e6e8ef;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .event-meta {
        color: #9ca3af;
        font-size: 13px;
        margin-bottom: 12px;
    }
    .event-meta span {
        margin-right: 16px;
    }
    .event-description {
        color: #c9cedc;
        line-height: 1.6;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #2d3246;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold" style="color: #a5b4fc;">
                    <i class="fa-solid fa-calendar-days"></i> Events Synopsis
                </h1>
                <p style="color: #9ca3af; margin-top: 4px;">Scottish events and cultural happenings</p>
            </div>
            <a href="/newsletter" class="btn-secondary" style="background: transparent; color: #a5b4fc; border: 1px solid #2d3246; padding: 8px 14px; border-radius: 6px; font-weight: 700; text-decoration: none; display: inline-block;">
                <i class="fa-solid fa-arrow-left"></i> Back to Newsletter
            </a>
        </div>
        
        <!-- Filter controls -->
        <div class="filter-bar">
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Days back:</label>
            <input type="number" id="days-back" value="30" min="0" max="365" style="width: 80px;">
            
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Days ahead:</label>
            <input type="number" id="days-ahead" value="90" min="0" max="365" style="width: 80px;">
            
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Source:</label>
            <select id="source-filter" style="min-width: 200px;">
                <option value="">All Sources</option>
            </select>
            
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Location:</label>
            <input type="text" id="location-filter" placeholder="Filter by location" style="width: 200px;">
            
            <button onclick="applyFilters()" class="btn-primary">
                <i class="fa-solid fa-filter"></i> Apply Filters
            </button>
            
            <span style="color: #9ca3af; font-size: 13px; margin-left: auto;" id="event-count">Loading...</span>
        </div>

        <div id="events-summary-container">
            <div class="section-card">
                <div style="text-align: center; padding: 48px;">
                    <div style="display: inline-block; width: 32px; height: 32px; border: 3px solid #4e6bff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
                    <p style="color: #9ca3af;">Loading events summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
let currentFilters = {
    days_back: 30,
    days_ahead: 90,
    source: '',
    location: ''
};

async function loadEventsSummary(filters = {}) {
    try {
        const params = new URLSearchParams({
            days_back: filters.days_back || 30,
            days_ahead: filters.days_ahead || 90,
            ...(filters.source ? { source: filters.source } : {}),
            ...(filters.location ? { location: filters.location } : {})
        });
        
        const url = `/newsletter/events/summary?${params.toString()}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (!result || !result.data) {
            throw new Error('Invalid response format');
        }
        
        const data = result.data;
        const container = document.getElementById('events-summary-container');
        
        // Update event count
        const countEl = document.getElementById('event-count');
        if (countEl) {
            countEl.textContent = `${data.total_events} events (${data.upcoming_count} upcoming, ${data.past_count} past)`;
        }
        
        let html = '';
        
        // Summary section
        if (data.summary_text) {
            html += `
                <div class="section-card" style="background: linear-gradient(to right, #1b2138, #151a2e);">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-calendar-days"></i> Events Overview
                    </h2>
                    <div style="color: #e6e8ef; font-size: 16px; line-height: 1.6;">${data.summary_text}</div>
                </div>
            `;
        }
        
        // Stats
        if (data.total_events > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-chart-bar"></i> Overview
                    </h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px;">
                        <div class="stat-box">
                            <div class="stat-label">Total Events</div>
                            <div class="stat-value">${data.total_events}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Upcoming</div>
                            <div class="stat-value" style="color: #6ee7b7;">${data.upcoming_count}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Past</div>
                            <div class="stat-value" style="color: #9ca3af;">${data.past_count}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Sources</div>
                            <div class="stat-value">${Object.keys(data.sources || {}).length}</div>
                        </div>
                    </div>
                    
                    ${data.sources && Object.keys(data.sources).length > 0 ? `
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #2d3246;">
                            <div style="color: #9ca3af; font-size: 13px; margin-bottom: 8px;">Events by Source:</div>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${Object.entries(data.sources).map(([name, count]) => `
                                    <span style="padding: 6px 12px; background: #1b2138; color: #e6e8ef; border-radius: 4px; font-size: 13px;">
                                        ${name}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${data.locations && Object.keys(data.locations).length > 0 ? `
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #2d3246;">
                            <div style="color: #9ca3af; font-size: 13px; margin-bottom: 8px;">Events by Location:</div>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${Object.entries(data.locations).map(([loc, count]) => `
                                    <span style="padding: 6px 12px; background: #1b2138; color: #e6e8ef; border-radius: 4px; font-size: 13px;">
                                        ${loc}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Upcoming events
        if (data.upcoming_events && data.upcoming_events.length > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-calendar-check"></i> Upcoming Events (${data.upcoming_events.length})
                    </h2>
                    <div>
                        ${data.upcoming_events.map((event, idx) => {
                            let eventDate = '';
                            try {
                                if (event.event_date) {
                                    const date = new Date(event.event_date);
                                    if (!isNaN(date.getTime())) {
                                        eventDate = date.toLocaleDateString('en-GB', {
                                            weekday: 'long',
                                            day: 'numeric',
                                            month: 'long',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {
                                console.warn('Error parsing date:', event.event_date, e);
                            }
                            
                            return `
                                <div class="event-card" onclick="viewEventDetail(${event.id})">
                                    <div style="display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 12px;">
                                        <div style="flex: 1;">
                                            <h3 class="event-title">${event.title}</h3>
                                            <div class="event-meta">
                                                ${eventDate ? `<span><i class="fa-solid fa-calendar"></i> ${eventDate}</span>` : ''}
                                                ${event.location ? `<span><i class="fa-solid fa-location-dot"></i> ${event.location}</span>` : ''}
                                                <span><i class="fa-solid fa-source"></i> ${event.source}</span>
                                            </div>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            ${event.url ? `
                                                <a href="${event.url}" target="_blank" class="btn-primary" style="font-size: 13px; padding: 8px 12px;" onclick="event.stopPropagation()">
                                                    <i class="fa-solid fa-external-link"></i> Source
                                                </a>
                                            ` : ''}
                                            <button class="btn-primary" style="font-size: 13px; padding: 8px 12px;" onclick="event.stopPropagation(); viewEventDetail(${event.id})">
                                                <i class="fa-solid fa-eye"></i> Details
                                            </button>
                                        </div>
                                    </div>
                                    ${event.description || event.date_text ? `
                                        <div class="event-description">
                                            ${event.description ? `<p style="margin-bottom: 8px;">${event.description}</p>` : ''}
                                            ${event.date_text ? `<p style="color: #9ca3af; font-size: 13px;">${event.date_text}</p>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // Past events (limited)
        if (data.past_events && data.past_events.length > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-clock-rotate-left"></i> Recent Past Events (${data.past_events.length})
                    </h2>
                    <div>
                        ${data.past_events.map((event) => {
                            let eventDate = '';
                            try {
                                if (event.event_date) {
                                    const date = new Date(event.event_date);
                                    if (!isNaN(date.getTime())) {
                                        eventDate = date.toLocaleDateString('en-GB', {
                                            day: 'numeric',
                                            month: 'short',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {}
                            
                            return `
                                <div class="event-card" onclick="viewEventDetail(${event.id})">
                                    <div style="display: flex; align-items: center; justify-content: space-between;">
                                        <div style="flex: 1;">
                                            <h3 style="color: #e6e8ef; font-weight: 600; margin-bottom: 4px;">${event.title}</h3>
                                            <div style="color: #9ca3af; font-size: 13px;">
                                                ${eventDate ? `<span style="margin-right: 12px;">${eventDate}</span>` : ''}
                                                ${event.location ? `<span style="margin-right: 12px;"><i class="fa-solid fa-location-dot"></i> ${event.location}</span>` : ''}
                                                <span>${event.source}</span>
                                            </div>
                                        </div>
                                        <button class="btn-primary" style="font-size: 13px; padding: 8px 12px;" onclick="event.stopPropagation(); viewEventDetail(${event.id})">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (data.total_events === 0) {
            html = `
                <div class="section-card" style="text-align: center; padding: 48px;">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 48px; color: #9ca3af; margin-bottom: 16px;"></i>
                    <h3 style="color: #e6e8ef; font-size: 20px; font-weight: 600; margin-bottom: 8px;">No Events Found</h3>
                    <p style="color: #9ca3af; margin-bottom: 16px;">No events found for the selected date range and filters.</p>
                    <a href="/newsletter/sources" class="btn-primary">
                        Manage Sources
                    </a>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
        // Populate source filter dropdown
        populateSourceFilter(data.sources || {});
        
    } catch (error) {
        console.error('Error loading events summary:', error);
        document.getElementById('events-summary-container').innerHTML = `
            <div class="section-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                <p style="color: #ef4444;">Error loading events: ${error.message}</p>
            </div>
        `;
    }
}

function populateSourceFilter(sources) {
    const select = document.getElementById('source-filter');
    if (!select) return;
    
    // Clear existing options except "All Sources"
    while (select.options.length > 1) {
        select.remove(1);
    }
    
    // Add source options
    Object.keys(sources).sort().forEach(source => {
        const option = document.createElement('option');
        option.value = source;
        option.textContent = source;
        select.appendChild(option);
    });
}

function applyFilters() {
    currentFilters = {
        days_back: parseInt(document.getElementById('days-back').value) || 30,
        days_ahead: parseInt(document.getElementById('days-ahead').value) || 90,
        source: document.getElementById('source-filter').value || '',
        location: document.getElementById('location-filter').value || ''
    };
    loadEventsSummary(currentFilters);
}

function viewEventDetail(eventId) {
    window.location.href = `/newsletter/events/${eventId}`;
}

// Load on page load
document.addEventListener('DOMContentLoaded', () => {
    loadEventsSummary(currentFilters);
});
</script>
{% endblock %}
