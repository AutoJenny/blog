{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">Events Synopsis</h1>
                <p class="text-gray-400">Scottish events and cultural happenings</p>
            </div>
        </div>
        
        <!-- Filter controls -->
        <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-4 flex items-center gap-4 flex-wrap">
            <label class="text-gray-400 text-sm font-semibold">Days back:</label>
            <input type="number" id="days-back" value="30" min="0" max="365" class="bg-[#1e293b] border border-[#2d3246] text-white px-3 py-2 rounded-lg text-sm w-20 focus:outline-none focus:border-[#7b8dff]">
            
            <label class="text-gray-400 text-sm font-semibold">Days ahead:</label>
            <input type="number" id="days-ahead" value="90" min="0" max="365" class="bg-[#1e293b] border border-[#2d3246] text-white px-3 py-2 rounded-lg text-sm w-20 focus:outline-none focus:border-[#7b8dff]">
            
            <label class="text-gray-400 text-sm font-semibold">Source:</label>
            <select id="source-filter" class="bg-[#1e293b] border border-[#2d3246] text-white px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-[#7b8dff]">
                <option value="">All Sources</option>
            </select>
            
            <label class="text-gray-400 text-sm font-semibold">Location:</label>
            <input type="text" id="location-filter" placeholder="Filter by location" class="bg-[#1e293b] border border-[#2d3246] text-white px-3 py-2 rounded-lg text-sm w-40 focus:outline-none focus:border-[#7b8dff]">
            
            <button onclick="applyFilters()" class="bg-[#4e6bff] hover:bg-[#3d5ae5] text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition shadow">
                <i class="fa-solid fa-filter"></i> Apply Filters
            </button>
            
            <span class="text-gray-500 text-sm ml-auto" id="event-count">Loading...</span>
        </div>
    </div>

    <div id="events-summary-container">
        <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
            <div class="flex items-center justify-center py-12">
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#7b8dff] mb-4"></div>
                    <p class="text-gray-400">Loading events summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentFilters = {
    days_back: 30,
    days_ahead: 90,
    source: '',
    location: ''
};

async function loadEventsSummary(filters = {}) {
    try {
        const params = new URLSearchParams({
            days_back: filters.days_back || 30,
            days_ahead: filters.days_ahead || 90,
            ...(filters.source ? { source: filters.source } : {}),
            ...(filters.location ? { location: filters.location } : {})
        });
        
        const url = `/newsletter/events/summary?${params.toString()}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (!result || !result.data) {
            throw new Error('Invalid response format');
        }
        
        const data = result.data;
        const container = document.getElementById('events-summary-container');
        
        // Update event count
        const countEl = document.getElementById('event-count');
        if (countEl) {
            countEl.textContent = `${data.total_events} events (${data.upcoming_count} upcoming, ${data.past_count} past)`;
        }
        
        let html = '';
        
        // Summary section
        if (data.summary_text) {
            html += `
                <div class="bg-gradient-to-r from-[#1e293b] to-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-calendar-days mr-2 text-[#7b8dff]"></i>
                        Events Overview
                    </h2>
                    <div class="text-lg text-gray-200 leading-relaxed">${data.summary_text}</div>
                </div>
            `;
        }
        
        // Stats
        if (data.total_events > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-chart-bar mr-2 text-[#7b8dff]"></i>
                        Overview
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Total Events</div>
                            <div class="text-2xl font-bold text-white">${data.total_events}</div>
                        </div>
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Upcoming</div>
                            <div class="text-2xl font-bold text-[#6ee7b7]">${data.upcoming_count}</div>
                        </div>
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Past</div>
                            <div class="text-2xl font-bold text-gray-400">${data.past_count}</div>
                        </div>
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Sources</div>
                            <div class="text-2xl font-bold text-white">${Object.keys(data.sources || {}).length}</div>
                        </div>
                    </div>
                    
                    ${data.sources && Object.keys(data.sources).length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-[#2d3246]">
                            <div class="text-gray-400 text-sm mb-2">Events by Source:</div>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(data.sources).map(([name, count]) => `
                                    <span class="px-3 py-1 bg-[#1e293b] text-gray-200 rounded text-sm">
                                        ${name}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${data.locations && Object.keys(data.locations).length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-[#2d3246]">
                            <div class="text-gray-400 text-sm mb-2">Events by Location:</div>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(data.locations).map(([loc, count]) => `
                                    <span class="px-3 py-1 bg-[#1e293b] text-gray-200 rounded text-sm">
                                        ${loc}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Upcoming events
        if (data.upcoming_events && data.upcoming_events.length > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-calendar-check mr-2 text-[#7b8dff]"></i>
                        Upcoming Events (${data.upcoming_events.length})
                    </h2>
                    <div class="space-y-4">
                        ${data.upcoming_events.map((event, idx) => {
                            let eventDate = '';
                            try {
                                if (event.event_date) {
                                    const date = new Date(event.event_date);
                                    if (!isNaN(date.getTime())) {
                                        eventDate = date.toLocaleDateString('en-GB', {
                                            weekday: 'long',
                                            day: 'numeric',
                                            month: 'long',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {
                                console.warn('Error parsing date:', event.event_date, e);
                            }
                            
                            return `
                                <div class="bg-[#1e293b] border border-[#2d3246] rounded-lg p-5 hover:border-[#7b8dff] transition cursor-pointer" onclick="viewEventDetail(${event.id})">
                                    <div class="flex items-start justify-between mb-3">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-2">
                                                <h3 class="text-lg font-semibold text-white">
                                                    ${event.title}
                                                </h3>
                                            </div>
                                            <div class="flex items-center gap-3 text-sm text-gray-400 mb-2 flex-wrap">
                                                ${eventDate ? `<span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-calendar"></i>
                                                    ${eventDate}
                                                </span>` : ''}
                                                ${event.location ? `<span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-location-dot"></i>
                                                    ${event.location}
                                                </span>` : ''}
                                                <span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-source"></i>
                                                    ${event.source}
                                                </span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            ${event.url ? `
                                                <a href="${event.url}" target="_blank" class="px-3 py-1 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition text-sm" onclick="event.stopPropagation()">
                                                    <i class="fa-solid fa-external-link"></i> Source
                                                </a>
                                            ` : ''}
                                            <button class="px-3 py-1 bg-[#4e6bff] text-white rounded hover:bg-[#3d5ae5] transition text-sm" onclick="event.stopPropagation(); viewEventDetail(${event.id})">
                                                <i class="fa-solid fa-eye"></i> Details
                                            </button>
                                        </div>
                                    </div>
                                    ${event.description || event.date_text ? `
                                        <div class="mt-3 pt-3 border-t border-[#2d3246]">
                                            ${event.description ? `<p class="text-gray-300 leading-relaxed mb-2">${event.description}</p>` : ''}
                                            ${event.date_text ? `<p class="text-gray-400 text-sm">${event.date_text}</p>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // Past events (limited)
        if (data.past_events && data.past_events.length > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-clock-rotate-left mr-2 text-[#7b8dff]"></i>
                        Recent Past Events (${data.past_events.length})
                    </h2>
                    <div class="space-y-3">
                        ${data.past_events.map((event) => {
                            let eventDate = '';
                            try {
                                if (event.event_date) {
                                    const date = new Date(event.event_date);
                                    if (!isNaN(date.getTime())) {
                                        eventDate = date.toLocaleDateString('en-GB', {
                                            day: 'numeric',
                                            month: 'short',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {}
                            
                            return `
                                <div class="bg-[#1e293b] border border-[#2d3246] rounded-lg p-4 hover:border-[#7b8dff] transition cursor-pointer" onclick="viewEventDetail(${event.id})">
                                    <div class="flex items-center justify-between">
                                        <div class="flex-1">
                                            <h3 class="text-white font-semibold mb-1">${event.title}</h3>
                                            <div class="flex items-center gap-3 text-sm text-gray-400">
                                                ${eventDate ? `<span>${eventDate}</span>` : ''}
                                                ${event.location ? `<span><i class="fa-solid fa-location-dot"></i> ${event.location}</span>` : ''}
                                                <span>${event.source}</span>
                                            </div>
                                        </div>
                                        <button class="ml-4 px-3 py-1 bg-[#4e6bff] text-white rounded hover:bg-[#3d5ae5] transition text-sm" onclick="event.stopPropagation(); viewEventDetail(${event.id})">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (data.total_events === 0) {
            html = `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-8 text-center">
                    <i class="fa-solid fa-calendar-xmark text-4xl text-gray-500 mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-2">No Events Found</h3>
                    <p class="text-gray-400 mb-4">No events found for the selected date range and filters.</p>
                    <a href="/newsletter/sources" class="inline-block px-4 py-2 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition">
                        Manage Sources
                    </a>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
        // Populate source filter dropdown
        populateSourceFilter(data.sources || {});
        
    } catch (error) {
        console.error('Error loading events summary:', error);
        document.getElementById('events-summary-container').innerHTML = `
            <div class="bg-red-900/20 border border-red-500 rounded-lg p-6">
                <p class="text-red-400">Error loading events: ${error.message}</p>
            </div>
        `;
    }
}

function populateSourceFilter(sources) {
    const select = document.getElementById('source-filter');
    if (!select) return;
    
    // Clear existing options except "All Sources"
    while (select.options.length > 1) {
        select.remove(1);
    }
    
    // Add source options
    Object.keys(sources).sort().forEach(source => {
        const option = document.createElement('option');
        option.value = source;
        option.textContent = source;
        select.appendChild(option);
    });
}

function applyFilters() {
    currentFilters = {
        days_back: parseInt(document.getElementById('days-back').value) || 30,
        days_ahead: parseInt(document.getElementById('days-ahead').value) || 90,
        source: document.getElementById('source-filter').value || '',
        location: document.getElementById('location-filter').value || ''
    };
    loadEventsSummary(currentFilters);
}

function viewEventDetail(eventId) {
    window.location.href = `/newsletter/events/${eventId}`;
}

// Load on page load
document.addEventListener('DOMContentLoaded', () => {
    loadEventsSummary(currentFilters);
});
</script>
{% endblock %}
