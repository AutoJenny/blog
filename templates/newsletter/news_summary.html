{% extends 'base.html' %}

{% block head %}
<style>
    .filter-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        padding: 12px;
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
    }
    .filter-bar select {
        background: #0f172a !important;
        color: #e6e8ef !important;
        border: 1px solid #2d3246 !important;
        padding: 8px 12px !important;
        border-radius: 6px !important;
    }
    .filter-bar select option {
        background: #0f172a !important;
        color: #e6e8ef !important;
    }
    .btn-primary {
        background: #4e6bff;
        color: #fff;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-primary:hover {
        background: #3d5ae5;
    }
    .btn-secondary {
        background: transparent;
        color: #a5b4fc;
        border: 1px solid #2d3246;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        display: inline-block;
        cursor: pointer;
    }
    .btn-secondary:hover {
        background: #1b2138;
        border-color: #4e6bff;
    }
    .section-card {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .stat-box {
        padding: 16px;
        background: #0f172a;
        border: 1px solid #2d3246;
        border-radius: 6px;
    }
    .stat-label {
        color: #9ca3af;
        font-size: 12px;
        margin-bottom: 4px;
    }
    .stat-value {
        color: #e6e8ef;
        font-size: 24px;
        font-weight: 700;
    }
    .story-card {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold" style="color: #a5b4fc;">
                    <i class="fa-solid fa-newspaper"></i> News Synopsis
                </h1>
                <p style="color: #9ca3af; margin-top: 4px;">Weekly news overview from Scottish sources</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="clean-btn" onclick="cleanSynopses()" class="btn-secondary">
                    <i class="fa-solid fa-broom"></i> Clean Synopses
                </button>
                <button id="reanalyze-btn" onclick="reanalyzeNews()" class="btn-primary">
                    <i class="fa-solid fa-refresh"></i> Re-analyze News
                </button>
            </div>
        </div>
        
        <!-- Sort controls -->
        <div class="filter-bar">
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Sort by:</label>
            <select id="sort-select" onchange="changeSort()" style="min-width: 200px;">
                <option value="combined_score">Relevance + Freshness</option>
                <option value="suitability_score">Relevance to Values (Score)</option>
                <option value="published_at">Recency (Newest First)</option>
            </select>
            <span style="color: #9ca3af; font-size: 13px; margin-left: auto;" id="story-count">Loading...</span>
        </div>

        <div id="news-summary-container">
            <div class="section-card">
                <div style="text-align: center; padding: 48px;">
                    <div style="display: inline-block; width: 32px; height: 32px; border: 3px solid #4e6bff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
                    <p style="color: #9ca3af;">Loading news summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
async function loadNewsSummary(sortBy = 'combined_score', limit = 100) {
    try {
        const url = `/newsletter/news/summary?days_back=7&limit=${limit}&sort_by=${sortBy}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
        
        const result = await response.json();
        
        if (!result || !result.data) {
            throw new Error('Invalid response format from server');
        }
        
        const data = result.data;
        const container = document.getElementById('news-summary-container');
        
        // Update story count
        const countEl = document.getElementById('story-count');
        if (countEl) {
            countEl.textContent = `${data.total_stories} stories from ${Object.keys(data.sources || {}).length} sources`;
        }
        
        let html = '';
        
        // Overall summary
        if (data.summary_text && data.summary_text !== 'No relevant news stories found for this period.') {
            html += `
                <div class="section-card" style="background: linear-gradient(to right, #1b2138, #151a2e);">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-newspaper"></i> Weekly News Synopsis
                    </h2>
                    <div style="color: #e6e8ef; font-size: 16px; line-height: 1.6; white-space: pre-line;">${data.summary_text}</div>
                </div>
            `;
        }
        
        // Stats
        if (data.total_stories > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-chart-bar"></i> Overview
                    </h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px;">
                        <div class="stat-box">
                            <div class="stat-label">Total Stories</div>
                            <div class="stat-value">${data.total_stories}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Days Covered</div>
                            <div class="stat-value">${data.days_back}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Sources</div>
                            <div class="stat-value">${Object.keys(data.sources || {}).length}</div>
                        </div>
                    </div>
                    
                    ${data.sources && Object.keys(data.sources).length > 0 ? `
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #2d3246;">
                            <div style="color: #9ca3af; font-size: 13px; margin-bottom: 8px;">Stories by Source:</div>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${Object.entries(data.sources).map(([name, count]) => `
                                    <span style="padding: 6px 12px; background: #1b2138; color: #e6e8ef; border-radius: 4px; font-size: 13px;">
                                        ${name}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Top stories
        if (data.top_stories && data.top_stories.length > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-star"></i> Top Stories
                    </h2>
                    <div>
                        ${data.top_stories.map((story, idx) => {
                            let pubDate = '';
                            try {
                                if (story.published_at) {
                                    const date = new Date(story.published_at);
                                    if (!isNaN(date.getTime())) {
                                        pubDate = date.toLocaleDateString('en-GB', {
                                            day: 'numeric',
                                            month: 'short',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {
                                console.warn('Error parsing date:', story.published_at, e);
                            }
                            
                            return `
                                <div class="story-card">
                                    <div style="display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 12px;">
                                        <div style="flex: 1;">
                                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                                <span style="color: #4e6bff; font-weight: 700;">${idx + 1}.</span>
                                                <h3 style="color: #e6e8ef; font-size: 18px; font-weight: 600;">
                                                    <a href="${story.url}" target="_blank" style="color: #e6e8ef; text-decoration: none;" onmouseover="this.style.color='#4e6bff';" onmouseout="this.style.color='#e6e8ef';">
                                                        ${story.title}
                                                    </a>
                                                </h3>
                                            </div>
                                            <div style="display: flex; align-items: center; gap: 12px; color: #9ca3af; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap;">
                                                <span><i class="fa-solid fa-source"></i> ${story.source}</span>
                                                ${pubDate ? `<span><i class="fa-solid fa-calendar"></i> ${pubDate}</span>` : ''}
                                                ${story.suitability_score ? `<span title="Relevance score (1-9) - diaspora interest in Scottish heritage/culture"><i class="fa-solid fa-star"></i> Relevance: ${story.suitability_score}/9</span>` : ''}
                                                ${story.combined_score ? `<span title="Combined score (relevance + freshness)"><i class="fa-solid fa-chart-line"></i> Combined: ${parseFloat(story.combined_score).toFixed(1)}</span>` : ''}
                                            </div>
                                        </div>
                                        <a href="${story.url}" target="_blank" class="btn-primary" style="font-size: 13px; padding: 8px 12px; text-decoration: none;">
                                            Read
                                        </a>
                                    </div>
                                    ${story.synopsis ? `
                                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #2d3246;">
                                            <p style="color: #c9cedc; line-height: 1.6;">${story.synopsis}</p>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (data.total_stories === 0 || !data.summary_text || data.summary_text.includes('No relevant')) {
            let message = 'News analysis is in progress. Once stories are analyzed and synopses are generated, they will appear here.';
            if (data.unanalyzed_count && data.unanalyzed_count > 0) {
                message = `${data.unanalyzed_count} news items need to be analyzed. Click "Re-analyze News" above to process them.`;
            }
            html = `
                <div class="section-card" style="text-align: center; padding: 48px;">
                    <i class="fa-solid fa-newspaper" style="font-size: 48px; color: #9ca3af; margin-bottom: 16px;"></i>
                    <h3 style="color: #e6e8ef; font-size: 20px; font-weight: 600; margin-bottom: 8px;">No News Stories Yet</h3>
                    <p style="color: #9ca3af; margin-bottom: 16px;">${message}</p>
                    <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                        <a href="/newsletter/sources" class="btn-primary" style="text-decoration: none;">
                            Manage Sources
                        </a>
                        ${data.unanalyzed_count && data.unanalyzed_count > 0 ? `
                            <button onclick="reanalyzeNews()" class="btn-primary">
                                Re-analyze News
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error loading news summary:', error);
        const errorMsg = error.message || 'Unknown error occurred';
        document.getElementById('news-summary-container').innerHTML = `
            <div class="section-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                <h3 style="color: #ef4444; font-weight: 600; margin-bottom: 8px;">Error Loading Summary</h3>
                <p style="color: #ef4444; margin-bottom: 16px;">${errorMsg}</p>
                <button onclick="loadNewsSummary()" class="btn-primary">
                    <i class="fa-solid fa-refresh"></i> Try Again
                </button>
            </div>
        `;
    }
}

async function cleanSynopses() {
    const btn = document.getElementById('clean-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cleaning...';
    
    try {
        const response = await fetch('/newsletter/news/clean', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert(result.message);
            // Reload the summary
            loadNewsSummary();
        } else {
            alert('Error: ' + (result.error || 'Failed to clean synopses'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

async function reanalyzeNews() {
    const btn = document.getElementById('reanalyze-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Re-analyzing...';
    
    try {
        const response = await fetch('/newsletter/news/reanalyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert(result.message);
            // Reload the summary
            loadNewsSummary();
        } else {
            alert('Error: ' + (result.error || 'Failed to re-analyze news'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

let currentSort = 'combined_score';
let currentLimit = 100;

function changeSort() {
    const select = document.getElementById('sort-select');
    currentSort = select.value;
    loadNewsSummary(currentSort, currentLimit);
}

// Load summary on page load
loadNewsSummary(currentSort, currentLimit);
</script>

{% endblock %}
