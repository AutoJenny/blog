{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">News Synopsis</h1>
                <p class="text-gray-400">Weekly news overview from Scottish sources</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="clean-btn" onclick="cleanSynopses()" class="bg-[#1e293b] hover:bg-[#334155] border border-[#475569] text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-broom"></i> Clean Synopses
                </button>
                <button id="reanalyze-btn" onclick="reanalyzeNews()" class="bg-[#4e6bff] hover:bg-[#3d5ae5] text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-refresh"></i> Re-analyze News
                </button>
            </div>
        </div>
        
        <!-- Sort controls -->
        <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-4 flex items-center gap-4">
            <label class="text-gray-400 text-sm font-semibold">Sort by:</label>
            <select id="sort-select" onchange="changeSort()" class="bg-[#1e293b] border border-[#2d3246] text-white px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-[#7b8dff]">
                <option value="combined_score">Relevance + Freshness</option>
                <option value="suitability_score">Relevance to Values (Score)</option>
                <option value="published_at">Recency (Newest First)</option>
            </select>
            <span class="text-gray-500 text-sm ml-auto" id="story-count">Loading...</span>
        </div>
    </div>

    <div id="news-summary-container">
        <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
            <div class="flex items-center justify-center py-12">
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#7b8dff] mb-4"></div>
                    <p class="text-gray-400">Loading news summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadNewsSummary(sortBy = 'combined_score', limit = 100) {
    try {
        const url = `/newsletter/news/summary?days_back=7&limit=${limit}&sort_by=${sortBy}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
        
        const result = await response.json();
        
        if (!result || !result.data) {
            throw new Error('Invalid response format from server');
        }
        
        const data = result.data;
        const container = document.getElementById('news-summary-container');
        
        // Update story count
        const countEl = document.getElementById('story-count');
        if (countEl) {
            countEl.textContent = `${data.total_stories} stories from ${Object.keys(data.sources || {}).length} sources`;
        }
        
        let html = '';
        
        // Overall summary
        if (data.summary_text && data.summary_text !== 'No relevant news stories found for this period.') {
            html += `
                <div class="bg-gradient-to-r from-[#1e293b] to-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-newspaper mr-2 text-[#7b8dff]"></i>
                        Weekly News Synopsis
                    </h2>
                    <div class="text-lg text-gray-200 leading-relaxed whitespace-pre-line">${data.summary_text}</div>
                </div>
            `;
        }
        
        // Stats
        if (data.total_stories > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-chart-bar mr-2 text-[#7b8dff]"></i>
                        Overview
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Total Stories</div>
                            <div class="text-2xl font-bold text-white">${data.total_stories}</div>
                        </div>
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Days Covered</div>
                            <div class="text-2xl font-bold text-white">${data.days_back}</div>
                        </div>
                        <div class="bg-[#1e293b] rounded p-4">
                            <div class="text-gray-400 text-sm mb-1">Sources</div>
                            <div class="text-2xl font-bold text-white">${Object.keys(data.sources || {}).length}</div>
                        </div>
                    </div>
                    
                    ${data.sources && Object.keys(data.sources).length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-[#2d3246]">
                            <div class="text-gray-400 text-sm mb-2">Stories by Source:</div>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(data.sources).map(([name, count]) => `
                                    <span class="px-3 py-1 bg-[#1e293b] text-gray-200 rounded text-sm">
                                        ${name}: ${count}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Top stories
        if (data.top_stories && data.top_stories.length > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-star mr-2 text-[#7b8dff]"></i>
                        Top Stories
                    </h2>
                    <div class="space-y-4">
                        ${data.top_stories.map((story, idx) => {
                            let pubDate = '';
                            try {
                                if (story.published_at) {
                                    const date = new Date(story.published_at);
                                    if (!isNaN(date.getTime())) {
                                        pubDate = date.toLocaleDateString('en-GB', {
                                            day: 'numeric',
                                            month: 'short',
                                            year: 'numeric'
                                        });
                                    }
                                }
                            } catch (e) {
                                console.warn('Error parsing date:', story.published_at, e);
                            }
                            
                            return `
                                <div class="bg-[#1e293b] border border-[#2d3246] rounded-lg p-5">
                                    <div class="flex items-start justify-between mb-3">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-2">
                                                <span class="text-[#7b8dff] font-bold">${idx + 1}.</span>
                                                <h3 class="text-lg font-semibold text-white">
                                                    <a href="${story.url}" target="_blank" class="hover:text-[#7b8dff] transition">
                                                        ${story.title}
                                                    </a>
                                                </h3>
                                            </div>
                                            <div class="flex items-center gap-3 text-sm text-gray-400 mb-2">
                                                <span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-source"></i>
                                                    ${story.source}
                                                </span>
                                                ${pubDate ? `<span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-calendar"></i>
                                                    ${pubDate}
                                                </span>` : ''}
                                                ${story.suitability_score ? `<span class="flex items-center gap-1" title="Relevance score (1-9) - diaspora interest in Scottish heritage/culture">
                                                    <i class="fa-solid fa-star"></i>
                                                    Relevance: ${story.suitability_score}/9
                                                </span>` : ''}
                                                ${story.combined_score ? `<span class="flex items-center gap-1" title="Combined score (relevance + freshness)">
                                                    <i class="fa-solid fa-chart-line"></i>
                                                    Combined: ${parseFloat(story.combined_score).toFixed(1)}
                                                </span>` : ''}
                                            </div>
                                        </div>
                                        <a href="${story.url}" target="_blank" class="ml-4 px-3 py-1 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition text-sm">
                                            Read
                                        </a>
                                    </div>
                                    ${story.synopsis ? `
                                        <div class="mt-3 pt-3 border-t border-[#2d3246]">
                                            <p class="text-gray-300 leading-relaxed">${story.synopsis}</p>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (data.total_stories === 0 || !data.summary_text || data.summary_text.includes('No relevant')) {
            let message = 'News analysis is in progress. Once stories are analyzed and synopses are generated, they will appear here.';
            if (data.unanalyzed_count && data.unanalyzed_count > 0) {
                message = `${data.unanalyzed_count} news items need to be analyzed. Click "Re-analyze News" above to process them.`;
            }
            html = `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-8 text-center">
                    <i class="fa-solid fa-newspaper text-4xl text-gray-500 mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-2">No News Stories Yet</h3>
                    <p class="text-gray-400 mb-4">${message}</p>
                    <div class="flex items-center justify-center gap-3">
                        <a href="/newsletter/sources" class="inline-block px-4 py-2 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition">
                            Manage Sources
                        </a>
                        ${data.unanalyzed_count && data.unanalyzed_count > 0 ? `
                            <button onclick="reanalyzeNews()" class="px-4 py-2 bg-[#4e6bff] text-white rounded hover:bg-[#3d5ae5] transition">
                                Re-analyze News
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error loading news summary:', error);
        const errorMsg = error.message || 'Unknown error occurred';
        document.getElementById('news-summary-container').innerHTML = `
            <div class="bg-red-900/20 border border-red-500 rounded-lg p-6">
                <h3 class="text-red-400 font-semibold mb-2">Error Loading Summary</h3>
                <p class="text-red-300 mb-4">${errorMsg}</p>
                <button onclick="loadNewsSummary()" class="px-4 py-2 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition">
                    <i class="fa-solid fa-refresh"></i> Try Again
                </button>
            </div>
        `;
    }
}

async function cleanSynopses() {
    const btn = document.getElementById('clean-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cleaning...';
    
    try {
        const response = await fetch('/newsletter/news/clean', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert(result.message);
            // Reload the summary
            loadNewsSummary();
        } else {
            alert('Error: ' + (result.error || 'Failed to clean synopses'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

async function reanalyzeNews() {
    const btn = document.getElementById('reanalyze-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Re-analyzing...';
    
    try {
        const response = await fetch('/newsletter/news/reanalyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert(result.message);
            // Reload the summary
            loadNewsSummary();
        } else {
            alert('Error: ' + (result.error || 'Failed to re-analyze news'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

let currentSort = 'combined_score';
let currentLimit = 100;

function changeSort() {
    const select = document.getElementById('sort-select');
    currentSort = select.value;
    loadNewsSummary(currentSort, currentLimit);
}

// Load summary on page load
loadNewsSummary(currentSort, currentLimit);
</script>

{% endblock %}
