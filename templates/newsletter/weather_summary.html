{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-white mb-2">Weather Summary</h1>
        <p class="text-gray-400">Weekly weather overview for Scotland</p>
    </div>

    <div id="weather-summary-container">
        <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
            <div class="flex items-center justify-center py-12">
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#7b8dff] mb-4"></div>
                    <p class="text-gray-400">Loading weather summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadWeatherSummary() {
    try {
        const response = await fetch('/newsletter/weather/summary?days_back=7&days_ahead=7');
        const result = await response.json();
        
        if (!response.ok) {
            throw new Error(result.error || 'Failed to load weather summary');
        }
        
        const data = result.data;
        const container = document.getElementById('weather-summary-container');
        
        let html = '';
        
        // Overall summary text
        if (data.summary_text) {
            html += `
                <div class="bg-gradient-to-r from-[#1e293b] to-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-cloud-sun mr-2 text-[#7b8dff]"></i>
                        Weekly Synopsis
                    </h2>
                    <p class="text-lg text-gray-200 leading-relaxed">${data.summary_text}</p>
                </div>
            `;
        }
        
        // Past week summary
        if (data.past_week && data.past_week.summary.days_with_data > 0) {
            const past = data.past_week.summary;
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-chevron-left mr-2 text-[#7b8dff]"></i>
                        Past Week (${past.days_with_data} days of data)
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${past.avg_high ? `
                            <div class="bg-[#1e293b] rounded p-4">
                                <div class="text-gray-400 text-sm mb-1">Avg High</div>
                                <div class="text-2xl font-bold text-white">${past.avg_high}°C</div>
                                ${past.high_max ? `<div class="text-xs text-gray-500 mt-1">Max: ${past.high_max}°C</div>` : ''}
                            </div>
                        ` : ''}
                        ${past.avg_low ? `
                            <div class="bg-[#1e293b] rounded p-4">
                                <div class="text-gray-400 text-sm mb-1">Avg Low</div>
                                <div class="text-2xl font-bold text-white">${past.avg_low}°C</div>
                                ${past.low_min ? `<div class="text-xs text-gray-500 mt-1">Min: ${past.low_min}°C</div>` : ''}
                            </div>
                        ` : ''}
                    </div>
                    ${past.conditions && past.conditions.length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-[#2d3246]">
                            <div class="text-gray-400 text-sm mb-2">Conditions:</div>
                            <div class="flex flex-wrap gap-2">
                                ${past.conditions.map(c => `
                                    <span class="px-3 py-1 bg-[#1e293b] text-gray-200 rounded text-sm">${c}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Forecast summary
        if (data.forecast_week && data.forecast_week.summary.days_with_data > 0) {
            const forecast = data.forecast_week.summary;
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6 mb-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-chevron-right mr-2 text-[#7b8dff]"></i>
                        Next Week Forecast (${forecast.days_with_data} days of data)
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${forecast.avg_high ? `
                            <div class="bg-[#1e293b] rounded p-4">
                                <div class="text-gray-400 text-sm mb-1">Avg High</div>
                                <div class="text-2xl font-bold text-white">${forecast.avg_high}°C</div>
                                ${forecast.high_max ? `<div class="text-xs text-gray-500 mt-1">Max: ${forecast.high_max}°C</div>` : ''}
                            </div>
                        ` : ''}
                        ${forecast.avg_low ? `
                            <div class="bg-[#1e293b] rounded p-4">
                                <div class="text-gray-400 text-sm mb-1">Avg Low</div>
                                <div class="text-2xl font-bold text-white">${forecast.avg_low}°C</div>
                                ${forecast.low_min ? `<div class="text-xs text-gray-500 mt-1">Min: ${forecast.low_min}°C</div>` : ''}
                            </div>
                        ` : ''}
                    </div>
                    ${forecast.conditions && forecast.conditions.length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-[#2d3246]">
                            <div class="text-gray-400 text-sm mb-2">Expected Conditions:</div>
                            <div class="flex flex-wrap gap-2">
                                ${forecast.conditions.map(c => `
                                    <span class="px-3 py-1 bg-[#1e293b] text-gray-200 rounded text-sm">${c}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Daily breakdown
        if (data.daily_summaries && data.daily_summaries.length > 0) {
            html += `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-6">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                        <i class="fa-solid fa-calendar-days mr-2 text-[#7b8dff]"></i>
                        Daily Breakdown
                    </h2>
                    <div class="space-y-3">
                        ${data.daily_summaries.map(day => {
                            const dateStr = new Date(day.date).toLocaleDateString('en-GB', { 
                                weekday: 'short', 
                                day: 'numeric', 
                                month: 'short' 
                            });
                            const isToday = day.is_today;
                            const isPast = day.is_past;
                            const hasData = day.has_data;
                            
                            return `
                                <div class="flex items-center justify-between p-4 bg-[#1e293b] rounded ${isToday ? 'ring-2 ring-[#7b8dff]' : ''}">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-white font-medium">${dateStr}</span>
                                            ${isToday ? '<span class="px-2 py-0.5 bg-[#7b8dff] text-white text-xs rounded">Today</span>' : ''}
                                            ${isPast ? '<span class="text-gray-500 text-xs">Past</span>' : ''}
                                        </div>
                                        ${hasData ? `
                                            ${day.temp_high || day.temp_low ? `
                                                <div class="text-gray-300 text-sm">
                                                    ${day.temp_high ? `High: ${day.temp_high}°C` : ''}
                                                    ${day.temp_high && day.temp_low ? ' / ' : ''}
                                                    ${day.temp_low ? `Low: ${day.temp_low}°C` : ''}
                                                    ${day.temp_vs_norm ? `
                                                        <span class="ml-2 text-xs ${day.temp_vs_norm > 0 ? 'text-green-400' : 'text-blue-400'}">
                                                            (${day.temp_vs_norm > 0 ? '+' : ''}${day.temp_vs_norm.toFixed(1)}°C vs norm)
                                                        </span>
                                                    ` : ''}
                                                </div>
                                            ` : ''}
                                            ${day.primary_condition ? `
                                                <div class="text-gray-400 text-xs mt-1">${day.primary_condition}</div>
                                            ` : ''}
                                        ` : `
                                            <div class="text-gray-500 text-sm italic">No data available</div>
                                        `}
                                    </div>
                                    ${day.seasonal_norm ? `
                                        <div class="ml-4 text-right">
                                            <div class="text-gray-500 text-xs">Typical</div>
                                            <div class="text-gray-400 text-sm">${day.seasonal_norm.high}°C / ${day.seasonal_norm.low}°C</div>
                                            <div class="text-gray-600 text-xs mt-1">${day.seasonal_norm.description}</div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (!data.summary_text || data.summary_text.includes('collection in progress')) {
            html = `
                <div class="bg-[#0f172a] border border-[#2d3246] rounded-lg p-8 text-center">
                    <i class="fa-solid fa-cloud-rain text-4xl text-gray-500 mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-2">No Weather Data Yet</h3>
                    <p class="text-gray-400 mb-4">
                        Weather data collection is in progress. Once data is gathered from BBC Scotland Weather, 
                        the summary will appear here.
                    </p>
                    <a href="/newsletter/sources" class="inline-block px-4 py-2 bg-[#7b8dff] text-white rounded hover:bg-[#6a7dee] transition">
                        Manage Sources
                    </a>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error loading weather summary:', error);
        document.getElementById('weather-summary-container').innerHTML = `
            <div class="bg-red-900/20 border border-red-500 rounded-lg p-6">
                <h3 class="text-red-400 font-semibold mb-2">Error Loading Summary</h3>
                <p class="text-red-300">${error.message}</p>
            </div>
        `;
    }
}

// Load summary on page load
loadWeatherSummary();
</script>

{% endblock %}
