{% extends 'base.html' %}

{% block head %}
<style>
    .filter-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        padding: 12px;
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
    }
    .filter-bar input {
        background: #0f172a !important;
        color: #e6e8ef !important;
        border: 1px solid #2d3246 !important;
        padding: 8px 12px !important;
        border-radius: 6px !important;
    }
    .section-card {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .stat-box {
        padding: 16px;
        background: #0f172a;
        border: 1px solid #2d3246;
        border-radius: 6px;
    }
    .stat-label {
        color: #9ca3af;
        font-size: 12px;
        margin-bottom: 4px;
    }
    .stat-value {
        color: #e6e8ef;
        font-size: 24px;
        font-weight: 700;
    }
    .forecast-day {
        background: #151a2e;
        border: 1px solid #2d3246;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold" style="color: #a5b4fc;">
                    <i class="fa-solid fa-cloud-sun"></i> Weather Synopsis
                </h1>
                <p style="color: #9ca3af; margin-top: 4px;">Past week and forecast for Scotland</p>
            </div>
            <a href="/newsletter" class="btn-secondary" style="background: transparent; color: #a5b4fc; border: 1px solid #2d3246; padding: 8px 14px; border-radius: 6px; font-weight: 700; text-decoration: none; display: inline-block;">
                <i class="fa-solid fa-arrow-left"></i> Back to Newsletter
            </a>
        </div>
        
        <!-- Filter controls -->
        <div class="filter-bar">
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Days back:</label>
            <input type="number" id="days-back" value="7" min="0" max="30" style="width: 80px;">
            
            <label style="color: #9ca3af; font-size: 13px; font-weight: 600;">Days ahead:</label>
            <input type="number" id="days-ahead" value="7" min="0" max="14" style="width: 80px;">
            
            <button onclick="applyFilters()" class="btn-primary" style="background: #4e6bff; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;">
                <i class="fa-solid fa-filter"></i> Apply Filters
            </button>
            
            <span style="color: #9ca3af; font-size: 13px; margin-left: auto;" id="weather-status">Loading...</span>
        </div>

        <div id="weather-summary-container">
            <div class="section-card">
                <div style="text-align: center; padding: 48px;">
                    <div style="display: inline-block; width: 32px; height: 32px; border: 3px solid #4e6bff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
                    <p style="color: #9ca3af;">Loading weather summary...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
let currentFilters = {
    days_back: 7,
    days_ahead: 7
};

async function loadWeatherSummary(filters = {}) {
    try {
        const params = new URLSearchParams({
            days_back: filters.days_back || 7,
            days_ahead: filters.days_ahead || 7
        });
        
        const url = `/newsletter/weather/summary?${params.toString()}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        
        if (!result || !result.data) {
            throw new Error('Invalid response format');
        }
        
        const data = result.data;
        const container = document.getElementById('weather-summary-container');
        
        let html = '';
        
        // Summary section
        if (data.summary_text) {
            html += `
                <div class="section-card" style="background: linear-gradient(to right, #1b2138, #151a2e);">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-cloud-sun"></i> Weather Overview
                    </h2>
                    <div style="color: #e6e8ef; font-size: 16px; line-height: 1.6; white-space: pre-line;">${data.summary_text}</div>
                </div>
            `;
        }
        
        // Stats
        if (data.total_items > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-chart-bar"></i> Overview
                    </h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;">
                        <div class="stat-box">
                            <div class="stat-label">Total Items</div>
                            <div class="stat-value">${data.total_items}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Past Week</div>
                            <div class="stat-value">${data.past_week_count || 0}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Forecast</div>
                            <div class="stat-value">${data.forecast_count || 0}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Past week
        if (data.past_week && data.past_week.length > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-chevron-left"></i> Past Week
                    </h2>
                    <div>
                        ${data.past_week.map((day, idx) => `
                            <div class="forecast-day">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                                    <h3 style="color: #e6e8ef; font-weight: 600;">${day.date || 'Unknown date'}</h3>
                                    ${day.temp_high ? `<span style="color: #e6e8ef; font-weight: 700;">${day.temp_high}°C</span>` : ''}
                                </div>
                                ${day.condition ? `<p style="color: #9ca3af; font-size: 13px; margin-bottom: 4px;">${day.condition}</p>` : ''}
                                ${day.summary ? `<p style="color: #c9cedc; font-size: 14px; line-height: 1.5;">${day.summary}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // Forecast
        if (data.forecast && data.forecast.length > 0) {
            html += `
                <div class="section-card">
                    <h2 style="color: #a5b4fc; font-size: 20px; font-weight: 600; margin-bottom: 16px;">
                        <i class="fa-solid fa-chevron-right"></i> Forecast
                    </h2>
                    <div>
                        ${data.forecast.map((day, idx) => `
                            <div class="forecast-day">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                                    <h3 style="color: #e6e8ef; font-weight: 600;">${day.date || 'Unknown date'}</h3>
                                    ${day.temp_high ? `<span style="color: #e6e8ef; font-weight: 700;">${day.temp_high}°C</span>` : ''}
                                </div>
                                ${day.condition ? `<p style="color: #9ca3af; font-size: 13px; margin-bottom: 4px;">${day.condition}</p>` : ''}
                                ${day.summary ? `<p style="color: #c9cedc; font-size: 14px; line-height: 1.5;">${day.summary}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // No data message
        if (data.total_items === 0) {
            html = `
                <div class="section-card" style="text-align: center; padding: 48px;">
                    <i class="fa-solid fa-cloud" style="font-size: 48px; color: #9ca3af; margin-bottom: 16px;"></i>
                    <h3 style="color: #e6e8ef; font-size: 20px; font-weight: 600; margin-bottom: 8px;">No Weather Data</h3>
                    <p style="color: #9ca3af; margin-bottom: 16px;">No weather data found for the selected date range.</p>
                    <a href="/newsletter/sources" class="btn-primary" style="background: #4e6bff; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; text-decoration: none; display: inline-block;">
                        Manage Sources
                    </a>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error loading weather summary:', error);
        document.getElementById('weather-summary-container').innerHTML = `
            <div class="section-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                <p style="color: #ef4444;">Error loading weather: ${error.message}</p>
            </div>
        `;
    }
}

function applyFilters() {
    currentFilters = {
        days_back: parseInt(document.getElementById('days-back').value) || 7,
        days_ahead: parseInt(document.getElementById('days-ahead').value) || 7
    };
    loadWeatherSummary(currentFilters);
}

// Load on page load
document.addEventListener('DOMContentLoaded', () => {
    loadWeatherSummary(currentFilters);
});
</script>
{% endblock %}
