{% if block and block.items %}
<!-- New Products Block Panel -->
<tr>
  <td style="padding:0 24px 24px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fef9e7; border-radius:8px; border:1px solid #e8dcc0;">
      <tr>
        <td style="padding:20px;">
          <h3 style="margin:0 0 16px 0; font-size:18px; font-weight:700; color:#3d2817; font-family:Georgia, 'Times New Roman', serif;">New This Week</h3>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
            <tr>
              {% for p in block.items %}
              <td width="33.33%" style="vertical-align:top; padding:8px; text-align:center;">
                {% if p.image_url %}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding:0 0 8px 0;">
                      <img src="{{ p.image_url }}" alt="{{ p.name }}" width="160" style="width:100%; max-width:160px; height:auto; border-radius:6px; display:block; margin:0 auto;" />
                    </td>
                  </tr>
                </table>
                {% endif %}
                <div style="font-size:14px; font-weight:600; color:#3d2817; margin:0 0 4px 0; font-family:Arial, Helvetica, sans-serif;">{{ p.name }}</div>
                {% if p.slug %}<a href="{{ p.slug }}" style="color:#6b4e3d; text-decoration:underline; font-size:14px; font-family:Arial, Helvetica, sans-serif;">Explore</a>{% endif %}
              </td>
              {% endfor %}
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endif %}
