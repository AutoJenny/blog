{% if block and block.title %}
<!-- Feature Block Panel -->
<tr>
  <td style="padding:0 24px 24px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fef9e7; border-radius:8px; border:1px solid #e8dcc0;">
      <tr>
        <td style="padding:20px;">
          <h2 style="margin:0 0 12px 0; font-size:20px; font-weight:700; color:#3d2817; font-family:Georgia, 'Times New Roman', serif;">{{ block.title }}</h2>
          {% if block.hero_image %}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
            <tr>
              <td>
                <img src="{{ block.hero_image }}" alt="{{ block.title }}" width="560" style="width:100%; max-width:560px; height:auto; border-radius:6px; display:block;" />
              </td>
            </tr>
          </table>
          {% endif %}
          {% if block.excerpt %}
          <p style="margin:0 0 12px 0; font-size:16px; line-height:1.6; color:#3d2817; font-family:Arial, Helvetica, sans-serif;">{{ block.excerpt }}</p>
          {% endif %}
          {% if block.url %}
          <p style="margin:0; font-size:16px; font-family:Arial, Helvetica, sans-serif;"><a href="{{ block.url }}" style="color:#6b4e3d; text-decoration:underline;">Read more</a></p>
          {% endif %}
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endif %}
