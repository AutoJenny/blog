{% set title = block.title or 'Welcome' %}
{% set text = block.text or 'Thanks for subscribing. Here’s what’s new this week.' %}
<section style="margin-bottom:24px;">
  <h2 style="color:#fff; font-size:20px; font-weight:700; margin:0 0 8px 0;">{{ title }}</h2>
  <p style="color:#c9cedc; margin:8px 0 0 0;">{{ text }}</p>
</section>
