{% if block %}
<!-- Spotlight Block Panel -->
<tr>
  <td style="padding:16px 24px 0 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fef9e7; border-radius:8px; border:1px solid #e8dcc0;">
      <tr>
        <td style="padding:20px;">
          <h3 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#3d2817; font-family:Georgia, 'Times New Roman', serif;">Product Spotlight</h3>
          {% if block.image_url %}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
            <tr>
              <td>
                <img src="{{ block.image_url }}" alt="{{ block.name }}" width="560" style="width:100%; max-width:560px; height:auto; border-radius:6px; display:block;" />
              </td>
            </tr>
          </table>
          {% endif %}
          <div style="font-size:16px; font-weight:600; color:#3d2817; margin:0 0 8px 0; font-family:Arial, Helvetica, sans-serif;">{{ block.name }}</div>
          {% if block.short_description %}
          <p style="margin:0 0 12px 0; font-size:16px; line-height:1.6; color:#3d2817; font-family:Arial, Helvetica, sans-serif;">{{ block.short_description }}</p>
          {% endif %}
          {% if block.slug %}
          <p style="margin:0; font-size:16px; font-family:Arial, Helvetica, sans-serif;"><a href="{{ block.slug }}" style="color:#6b4e3d; text-decoration:underline;">Learn more</a></p>
          {% endif %}
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endif %}
