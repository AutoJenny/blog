{% if block %}
<!-- Snapshot Block Panel -->
<tr>
  <td style="padding:16px 24px 0 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fef9e7; border-radius:8px; border:1px solid #e8dcc0;">
      <tr>
        <td style="padding:20px;">
          <h3 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#3d2817; font-family:Georgia, 'Times New Roman', serif;">Scottish Snapshot</h3>
          <p style="margin:0; font-size:16px; line-height:1.6; color:#3d2817; font-family:Arial, Helvetica, sans-serif;">
            {% if block.url %}<a href="{{ block.url }}" style="color:#6b4e3d; text-decoration:underline;">{{ block.title }}</a>{% else %}{{ block.title }}{% endif %}
            {% if block.publisher %}<span style="color:#5c3e2a;"> — {{ block.publisher }}</span>{% endif %}
          </p>
          {% if block.comment %}
          <p style="margin:12px 0 0 0; font-size:16px; line-height:1.6; color:#3d2817; font-family:Arial, Helvetica, sans-serif;">{{ block.comment }}</p>
          {% endif %}
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endif %}
